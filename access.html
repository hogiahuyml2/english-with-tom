<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Quản lý truy cập — English With Tom</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#6F58EE">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=26">
<style>
.ac-wrap { max-width: 1180px; margin: 0 auto; padding: 14px 16px 70px; }
.ac-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; } .ac-top h1 { font-size: 24px; margin: 0; flex: 1; min-width: 220px; }
.ac-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; min-height: 40px; border-radius: 10px; border: 1.5px solid var(--border); background: var(--surface); color: var(--text); font: 700 13.5px inherit; font-family: inherit; cursor: pointer; text-decoration: none; }
.ac-btn.on { background: var(--primary); border-color: var(--primary); color: #fff; } .ac-btn.sm { min-height: 32px; padding: 4px 10px; font-size: 12.5px; }
.ac-box { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow); margin-bottom: 14px; }
.ac-in, .ac-sel { padding: 8px 11px; border: 1.5px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--text); font-size: 14px; font-family: inherit; min-height: 40px; }
.ac-bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.ac-kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
.ac-k { background: var(--surface); border: 1.5px solid var(--border); border-radius: 14px; padding: 12px 14px; }
.ac-k b { display: block; font-size: 26px; line-height: 1.1; } .ac-k span { font-size: 12.5px; color: var(--text-muted); } .ac-k small { display: block; font-size: 11.5px; color: var(--text-faint); margin-top: 2px; }
.ac-k.g b { color: var(--success); } .ac-k.p b { color: var(--primary); } .ac-k.o b { color: #d97706; }
.ac-note { background: var(--primary-soft); border-radius: 10px; padding: 10px 12px; font-size: 13px; line-height: 1.6; margin-bottom: 12px; color: var(--text); }
.ac-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.ac-scroll { overflow-x: auto; }
.ac-t { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 640px; } .ac-t th { text-align: left; font-size: 12px; color: var(--text-muted); padding: 8px 10px; border-bottom: 2px solid var(--border); white-space: nowrap; } .ac-t td { padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
.ac-t tr.click { cursor: pointer; } .ac-t tr.click:hover td { background: var(--primary-soft); }
.ac-t small { color: var(--text-faint); display: block; font-size: 11.5px; word-break: break-all; }
.ac-bdg { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11.5px; font-weight: 700; background: var(--primary-soft); color: var(--primary); white-space: nowrap; }
.ac-bdg.g { background: var(--success-soft); color: var(--success); } .ac-bdg.w { background: var(--warning-soft); color: #92400e; } .ac-bdg.r { background: #fee2e2; color: #b91c1c; }
.ac-chart { display: flex; align-items: flex-end; gap: 6px; height: 170px; padding: 6px 0 0; overflow-x: auto; }
.ac-col { flex: 1; min-width: 34px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; cursor: pointer; }
.ac-col .bars { display: flex; align-items: flex-end; gap: 2px; height: 130px; } .ac-col .bars i { width: 9px; border-radius: 4px 4px 0 0; display: block; min-height: 2px; }
.ac-col .bars i.v { background: #c4b5fd; } .ac-col .bars i.l { background: var(--primary); } .ac-col .bars i.a { background: var(--success); }
.ac-col small { font-size: 10.5px; color: var(--text-faint); margin-top: 4px; } .ac-col.sel small { color: var(--primary); font-weight: 700; } .ac-col.sel { background: var(--primary-soft); border-radius: 8px; }
.ac-leg { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-muted); margin-top: 6px; } .ac-leg i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; }
.ac-hours { display: grid; grid-template-columns: repeat(24, 1fr); gap: 3px; align-items: end; height: 80px; } .ac-hours i { display: block; background: var(--primary); border-radius: 3px 3px 0 0; min-height: 2px; } .ac-hl { display: grid; grid-template-columns: repeat(24, 1fr); gap: 3px; font-size: 9.5px; color: var(--text-faint); text-align: center; }
.ac-tl { border-left: 3px solid var(--border); margin-left: 8px; padding-left: 14px; } .ac-ev { position: relative; padding: 5px 0; font-size: 13.5px; } .ac-ev::before { content: ""; position: absolute; left: -21px; top: 12px; width: 10px; height: 10px; border-radius: 50%; background: var(--border); } .ac-ev.act::before { background: var(--success); } .ac-ev time { color: var(--text-faint); font-size: 12px; margin-right: 8px; font-variant-numeric: tabular-nums; }
.ac-modal { position: fixed; inset: 0; background: rgba(15,10,40,.5); z-index: 9500; display: none; align-items: flex-start; justify-content: center; padding: 30px 12px; overflow: auto; } .ac-modal.on { display: flex; }
.ac-card { background: var(--surface); border-radius: 18px; max-width: 760px; width: 100%; padding: 18px; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
.ac-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; } @media (max-width: 820px) { .ac-grid2 { grid-template-columns: 1fr; } }
.ac-muted { color: var(--text-muted); font-size: 13px; }
</style>
</head>
<body data-page="" data-guard="teacher">
<div id="site-header"></div>
<main class="ac-wrap">
  <div class="ac-top">
    <h1>📈 Quản lý truy cập</h1>
    <a class="ac-btn" href="teacher.html" id="backLink">← Khu vực giáo viên</a>
  </div>
  <div class="ac-note" id="scopeNote"></div>

  <div class="ac-bar">
    <button class="ac-btn sm" id="prevDay" aria-label="Ngày trước">◀</button>
    <input type="date" class="ac-in" id="dayIn" aria-label="Chọn ngày">
    <button class="ac-btn sm" id="nextDay" aria-label="Ngày sau">▶</button>
    <button class="ac-btn sm" id="todayBtn">Hôm nay</button>
    <select class="ac-sel" id="rangeSel" aria-label="Số ngày hiển thị biểu đồ"><option value="7">7 ngày</option><option value="14" selected>14 ngày</option><option value="30">30 ngày</option><option value="60">60 ngày</option></select>
    <label class="ac-muted" id="stuWrap" style="display:none;"><input type="checkbox" id="stuOnly"> Chỉ học sinh</label>
    <span style="flex:1"></span>
    <span class="ac-bdg g" id="onlineBdg" title="Có hoạt động trong 5 phút gần đây">● Đang online: …</span>
    <button class="ac-btn sm" id="refresh">↻ Tải lại</button>
  </div>

  <div class="ac-kpis" id="kpis"></div>

  <div class="ac-box">
    <b>Biểu đồ theo ngày</b> <span class="ac-muted">(bấm vào một ngày để xem chi tiết)</span>
    <div class="ac-chart" id="chart"></div>
    <div class="ac-leg"><span><i style="background:#c4b5fd"></i>Lượt truy cập</span><span><i style="background:var(--primary)"></i>Lượt truy cập có đăng nhập</span><span><i style="background:var(--success)"></i>Người dùng có hoạt động</span></div>
  </div>

  <div class="ac-tabs" id="tabs">
    <button class="ac-btn on" data-t="visitors">👥 Ai đã truy cập</button>
    <button class="ac-btn" data-t="actions">📜 Nhật ký hoạt động</button>
    <button class="ac-btn" data-t="types">🧩 Các loại hoạt động</button>
    <button class="ac-btn" data-t="pages">📄 Trang được xem</button>
    <button class="ac-btn" data-t="days">📅 Bảng theo ngày</button>
  </div>
  <div class="ac-box" id="pane"><div class="ac-muted">Đang tải…</div></div>
  <div class="ac-muted" id="foot"></div>
</main>

<div class="ac-modal" id="modal"><div class="ac-card" id="modalCard"></div></div>
<script src="js/track.js?v=1" defer></script>
<script src="js/main.js?v=51"></script>
<script>
(function () {
'use strict';
var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function api(url) { return fetch(url, { credentials: 'same-origin' }).then(function (r) { return r.json().then(function (d) { if (!r.ok) throw new Error(d.error || 'Lỗi'); return d; }); }); }
var VN = 7 * 3600 * 1000;
function dayStr(ms) { return new Date(ms + VN).toISOString().slice(0, 10); }
function hm(ms) { var d = new Date(ms + VN); return ('0' + d.getUTCHours()).slice(-2) + ':' + ('0' + d.getUTCMinutes()).slice(-2); }
function hms(ms) { var d = new Date(ms + VN); return hm(ms) + ':' + ('0' + d.getUTCSeconds()).slice(-2); }
function dm(day) { return day.slice(8) + '/' + day.slice(5, 7); }
function dfull(day) { var p = day.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
var ROLE = { student: 'Học sinh', teacher: 'Giáo viên', admin: 'Quản trị' }, DEV = { mobile: '📱 Điện thoại', desktop: '💻 Máy tính', tablet: '📲 Máy tính bảng' };
var S = { day: dayStr(Date.now()), range: 14, tab: 'visitors', stu: false, sum: null, dd: null, me: null, cat: '', q: '', actions: null };

function qs() { return (S.stu ? '&students=1' : ''); }
function csv(rows, name) {
  var t = '﻿' + rows.map(function (r) { return r.map(function (c) { c = String(c == null ? '' : c); return /[",\n;]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join(','); }).join('\n');
  var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([t], { type: 'text/csv;charset=utf-8' })); a.download = name; document.body.appendChild(a); a.click(); a.remove();
}

function loadAll() {
  $('dayIn').value = S.day; $('pane').innerHTML = '<div class="ac-muted">Đang tải…</div>';
  return Promise.all([api('/api/access/summary?days=' + S.range + qs()), api('/api/access/day?date=' + S.day + qs())]).then(function (r) { S.sum = r[0]; S.dd = r[1]; S.actions = null; renderTop(); renderPane(); })
    .catch(function (e) { $('pane').innerHTML = '<div class="ac-note" style="background:var(--warning-soft)">⚠️ ' + esc(e.message) + '</div>'; });
}

function renderTop() {
  var t = S.dd.totals, o = S.sum.online;
  $('onlineBdg').textContent = '● Đang online: ' + o.visitors + ' (' + o.users + ' đã đăng nhập)';
  var days = S.sum.days, prev = days.filter(function (d) { return d.day === S.day; })[0];
  $('kpis').innerHTML = [
    ['p', t.visits, 'Lượt truy cập', 'Mỗi lần vào web, cách nhau > 30 phút tính là lượt mới'],
    ['', t.visitors, 'Thiết bị / khách truy cập', 'Số trình duyệt khác nhau'],
    ['g', t.loggedVisits, 'Lượt truy cập có đăng nhập', t.guestVisits + ' lượt chưa đăng nhập'],
    ['g', t.users, 'Người dùng đăng nhập', 'Số tài khoản có mở trang'],
    ['o', t.actors, 'Người dùng có hoạt động', 'Có làm bài, chơi, nộp bài…'],
    ['o', t.actions, 'Tổng số thao tác', 'Xem tab “Nhật ký hoạt động”'],
    ['', t.views, 'Lượt xem trang', ''],
    ['', S.me && S.me.role === 'admin' ? (prev ? prev.newUsers : 0) : '—', 'Tài khoản mới đăng ký', S.me && S.me.role === 'admin' ? 'trong ngày' : 'chỉ quản trị thấy']
  ].map(function (k) { return '<div class="ac-k ' + k[0] + '"><b>' + k[1] + '</b><span>' + k[2] + '</span>' + (k[3] ? '<small>' + k[3] + '</small>' : '') + '</div>'; }).join('');
  var max = Math.max.apply(null, days.map(function (d) { return d.visits; }).concat([1]));
  $('chart').innerHTML = days.map(function (d) {
    var h = function (v) { return Math.max(2, Math.round(v / max * 128)); };
    return '<div class="ac-col' + (d.day === S.day ? ' sel' : '') + '" data-d="' + d.day + '" title="' + dfull(d.day) + ': ' + d.visits + ' lượt truy cập, ' + d.loggedVisits + ' có đăng nhập, ' + d.actors + ' người có hoạt động"><div class="bars"><i class="v" style="height:' + h(d.visits) + 'px"></i><i class="l" style="height:' + h(d.loggedVisits) + 'px"></i><i class="a" style="height:' + h(d.actors) + 'px"></i></div><small>' + dm(d.day) + '</small></div>';
  }).join('');
  Array.prototype.forEach.call($('chart').querySelectorAll('.ac-col'), function (c) { c.onclick = function () { S.day = c.getAttribute('data-d'); loadAll(); }; });
}

function renderPane() {
  Array.prototype.forEach.call($('tabs').querySelectorAll('button'), function (b) { b.classList.toggle('on', b.getAttribute('data-t') === S.tab); });
  var f = { visitors: paneVisitors, actions: paneActions, types: paneTypes, pages: panePages, days: paneDays }[S.tab]; f();
}

function paneVisitors() {
  var v = S.dd.visitors, d = S.dd;
  if (!v.length) { $('pane').innerHTML = '<div class="ac-muted">Chưa có ai truy cập trong ngày ' + dfull(S.day) + '.</div>'; return; }
  var mx = Math.max.apply(null, d.hours.concat([1]));
  var h = '<div class="ac-grid2" style="margin-bottom:14px;"><div><b>Theo giờ trong ngày</b> <span class="ac-muted">(lượt xem trang)</span><div class="ac-hours">' + d.hours.map(function (n, i) { return '<i title="' + i + 'h: ' + n + '" style="height:' + Math.max(2, Math.round(n / mx * 76)) + 'px"></i>'; }).join('') + '</div><div class="ac-hl">' + d.hours.map(function (n, i) { return '<span>' + (i % 3 === 0 ? i : '') + '</span>'; }).join('') + '</div></div>' +
    '<div><b>Thiết bị</b><div class="ac-muted" style="margin-top:6px;line-height:1.9">📱 Điện thoại: <b>' + d.devices.mobile + '</b> · 💻 Máy tính: <b>' + d.devices.desktop + '</b> · 📲 Máy tính bảng: <b>' + d.devices.tablet + '</b><br>👤 Có đăng nhập: <b>' + (v.length - d.totals.guests) + '</b> · 🕶 Khách chưa đăng nhập: <b>' + d.totals.guests + '</b></div></div></div>';
  h += '<div class="ac-bar"><b>' + v.length + ' người / thiết bị truy cập ngày ' + dfull(S.day) + '</b><span style="flex:1"></span><input class="ac-in" id="vq" placeholder="Tìm tên, email…" style="max-width:220px"><button class="ac-btn sm" id="vcsv">⬇ Xuất CSV</button></div>';
  h += '<div class="ac-scroll"><table class="ac-t"><thead><tr><th>Ai</th><th>Vai trò</th><th>Lượt truy cập</th><th>Lượt xem trang</th><th>Thao tác</th><th>Từ – đến</th><th>Thiết bị</th><th>Hay xem</th></tr></thead><tbody id="vbody"></tbody></table></div>';
  $('pane').innerHTML = h;
  function rows(q) {
    q = (q || '').toLowerCase();
    $('vbody').innerHTML = v.filter(function (x) { return !q || ((x.name || '') + ' ' + (x.email || '') + ' ' + (x.type === 'guest' ? 'khách' : '')).toLowerCase().indexOf(q) >= 0; }).map(function (x) {
      return '<tr class="click" data-k="' + esc(x.key) + '"><td>' + (x.type === 'user' ? '<b>' + esc(x.name || ('#' + x.userId)) + '</b><small>' + esc(x.email || '') + '</small>' : '<b>🕶 Khách chưa đăng nhập</b><small>mã ' + esc((x.vid || '').slice(0, 6)) + ' · mạng ' + esc(x.ip || '') + (x.country ? ' · ' + esc(x.country) : '') + '</small>') + '</td>' +
        '<td>' + (x.role ? '<span class="ac-bdg ' + (x.role === 'student' ? '' : 'w') + '">' + ROLE[x.role] + '</span>' : '<span class="ac-bdg">Khách</span>') + '</td><td>' + x.visits + '</td><td>' + x.views + '</td><td>' + (x.actions ? '<span class="ac-bdg g">' + x.actions + '</span>' : '0') + '</td>' +
        '<td>' + hm(x.first) + ' – ' + hm(x.last) + '</td><td>' + esc(x.device.split('/').map(function (k) { return DEV[k] || k; }).join(', ')) + '<small>' + esc(x.browser) + '</small></td><td>' + x.topPages.map(function (p) { return esc(p.name) + ' ×' + p.n; }).join('<br>') + '</td></tr>';
    }).join('') || '<tr><td colspan="8" class="ac-muted">Không có kết quả.</td></tr>';
    Array.prototype.forEach.call($('vbody').querySelectorAll('tr.click'), function (tr) { tr.onclick = function () { var x = v.filter(function (y) { return y.key === tr.getAttribute('data-k'); })[0]; openTimeline(x); }; });
  }
  rows(''); $('vq').oninput = function () { rows(this.value); };
  $('vcsv').onclick = function () { csv([['Ai', 'Email', 'Vai trò', 'Lượt truy cập', 'Lượt xem trang', 'Thao tác', 'Từ', 'Đến', 'Thiết bị', 'Trình duyệt']].concat(v.map(function (x) { return [x.name || 'Khách', x.email || '', x.role ? ROLE[x.role] : 'Khách', x.visits, x.views, x.actions, hm(x.first), hm(x.last), x.device, x.browser]; })), 'truy-cap-' + S.day + '.csv'); };
}

function openTimeline(x) {
  $('modal').classList.add('on'); $('modalCard').innerHTML = '<div class="ac-muted">Đang tải…</div>';
  api('/api/access/timeline?date=' + S.day + (x.userId ? '&user=' + x.userId : '&vid=' + encodeURIComponent(x.vid)) + qs()).then(function (d) {
    var views = d.events.filter(function (e) { return e.type === 'view'; }).length, acts = d.events.length - views;
    $('modalCard').innerHTML = '<div class="ac-bar"><b style="font-size:17px;flex:1">' + (d.user ? esc(d.user.name) + ' <span class="ac-muted">' + esc(d.user.email) + '</span>' : '🕶 Khách chưa đăng nhập') + '</b><button class="ac-btn sm" id="mx">✕ Đóng</button></div>' +
      '<div class="ac-muted" style="margin-bottom:8px">Ngày ' + dfull(S.day) + ' · ' + views + ' lượt xem trang · ' + acts + ' thao tác (chấm xanh = việc người đó đã làm)</div><div class="ac-tl">' +
      (d.events.map(function (e) { return '<div class="ac-ev ' + (e.type === 'action' ? 'act' : '') + '"><time>' + hms(e.ts) + '</time>' + (e.type === 'action' ? '<b>' + esc(e.label) + '</b> <span class="ac-bdg g">' + esc(e.catName || '') + '</span>' : esc(e.label) + (e.anon ? ' <span class="ac-muted">(chưa đăng nhập)</span>' : '')) + '</div>'; }).join('') || '<div class="ac-muted">Không có dữ liệu.</div>') + '</div>';
    $('mx').onclick = function () { $('modal').classList.remove('on'); };
  }).catch(function (e) { $('modalCard').innerHTML = '<div class="ac-note">⚠️ ' + esc(e.message) + '</div><button class="ac-btn sm" id="mx">Đóng</button>'; $('mx').onclick = function () { $('modal').classList.remove('on'); }; });
}
$('modal').onclick = function (e) { if (e.target === $('modal')) $('modal').classList.remove('on'); };

function paneActions() {
  var cats = S.dd.cats_all, h = '<div class="ac-bar"><select class="ac-sel" id="acCat"><option value="">Tất cả nhóm</option>' + Object.keys(cats).map(function (k) { return '<option value="' + k + '"' + (S.cat === k ? ' selected' : '') + '>' + esc(cats[k]) + '</option>'; }).join('') + '</select><input class="ac-in" id="acQ" placeholder="Tìm tên người dùng, email, hoạt động…" value="' + esc(S.q) + '" style="flex:1;min-width:200px"><button class="ac-btn sm" id="acCsv">⬇ Xuất CSV</button></div><div id="acList" class="ac-muted">Đang tải…</div>';
  $('pane').innerHTML = h;
  var tm; function go() {
    api('/api/access/actions?date=' + S.day + '&cat=' + S.cat + '&q=' + encodeURIComponent(S.q) + '&limit=300' + qs()).then(function (d) {
      S.actions = d;
      $('acList').innerHTML = '<div style="margin-bottom:8px"><b>' + d.total + ' thao tác</b> ngày ' + dfull(S.day) + (d.total > d.rows.length ? ' (hiện ' + d.rows.length + ' thao tác mới nhất)' : '') + '</div><div class="ac-scroll"><table class="ac-t" style="min-width:560px"><thead><tr><th>Giờ</th><th>Ai</th><th>Làm gì</th><th>Nhóm</th></tr></thead><tbody>' +
        (d.rows.map(function (r) { return '<tr><td style="white-space:nowrap">' + hms(r.ts) + '</td><td><b>' + esc(r.name || '—') + '</b><small>' + esc(r.email || '') + '</small></td><td>' + esc(r.label) + '</td><td><span class="ac-bdg ' + (r.cat === 'auth' ? 'w' : 'g') + '">' + esc(r.catName) + '</span></td></tr>'; }).join('') || '<tr><td colspan="4" class="ac-muted">Chưa có hoạt động nào.</td></tr>') + '</tbody></table></div>';
    }).catch(function (e) { $('acList').textContent = e.message; });
  }
  go();
  $('acCat').onchange = function () { S.cat = this.value; go(); };
  $('acQ').oninput = function () { S.q = this.value; clearTimeout(tm); tm = setTimeout(go, 300); };
  $('acCsv').onclick = function () { if (!S.actions) return; csv([['Giờ', 'Tên', 'Email', 'Hoạt động', 'Nhóm']].concat(S.actions.rows.map(function (r) { return [hms(r.ts), r.name || '', r.email || '', r.label, r.catName]; })), 'hoat-dong-' + S.day + '.csv'); };
}

function paneTypes() {
  var L = S.dd.labels;
  $('pane').innerHTML = '<div class="ac-bar"><b>Người dùng đã làm những gì trong ngày ' + dfull(S.day) + '</b></div>' + (S.dd.cats.length ? '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">' + S.dd.cats.map(function (c) { return '<span class="ac-bdg g">' + esc(c.name) + ': ' + c.n + '</span>'; }).join('') + '</div>' : '') +
    '<div class="ac-scroll"><table class="ac-t" style="min-width:480px"><thead><tr><th>Hoạt động</th><th>Nhóm</th><th>Số lần</th><th>Số người</th></tr></thead><tbody>' + (L.map(function (x) { return '<tr><td>' + esc(x.label) + '</td><td>' + esc(x.catName) + '</td><td><b>' + x.n + '</b></td><td>' + x.who + '</td></tr>'; }).join('') || '<tr><td colspan="4" class="ac-muted">Chưa có hoạt động nào.</td></tr>') + '</tbody></table></div>';
}

function panePages() {
  var P = S.dd.pages;
  $('pane').innerHTML = '<div class="ac-bar"><b>Các trang được xem nhiều nhất ngày ' + dfull(S.day) + '</b></div><div class="ac-scroll"><table class="ac-t" style="min-width:420px"><thead><tr><th>Trang</th><th>Lượt xem</th><th>Số người / thiết bị</th></tr></thead><tbody>' + (P.map(function (p) { return '<tr><td>' + esc(p.name) + '<small>' + esc(p.path) + '</small></td><td><b>' + p.views + '</b></td><td>' + p.who + '</td></tr>'; }).join('') || '<tr><td colspan="3" class="ac-muted">Chưa có dữ liệu.</td></tr>') + '</tbody></table></div>';
}

function paneDays() {
  var D = S.sum.days.slice().reverse();
  $('pane').innerHTML = '<div class="ac-bar"><b>Thống kê ' + S.range + ' ngày gần nhất</b><span style="flex:1"></span><button class="ac-btn sm" id="dCsv">⬇ Xuất CSV</button></div><div class="ac-scroll"><table class="ac-t" style="min-width:760px"><thead><tr><th>Ngày</th><th>Lượt truy cập</th><th>Có đăng nhập</th><th>Chưa đăng nhập</th><th>Thiết bị</th><th>Người dùng đăng nhập</th><th>Người có hoạt động</th><th>Thao tác</th><th>Lượt xem trang</th><th>TK mới</th></tr></thead><tbody>' +
    D.map(function (d) { return '<tr class="click" data-d="' + d.day + '"><td><b>' + dfull(d.day) + '</b></td><td>' + d.visits + '</td><td>' + d.loggedVisits + '</td><td>' + d.guestVisits + '</td><td>' + d.visitors + '</td><td>' + d.users + '</td><td>' + d.actors + '</td><td>' + d.actions + '</td><td>' + d.views + '</td><td>' + d.newUsers + '</td></tr>'; }).join('') + '</tbody></table></div>';
  Array.prototype.forEach.call($('pane').querySelectorAll('tr.click'), function (tr) { tr.onclick = function () { S.day = tr.getAttribute('data-d'); S.tab = 'visitors'; loadAll(); }; });
  $('dCsv').onclick = function () { csv([['Ngày', 'Lượt truy cập', 'Có đăng nhập', 'Chưa đăng nhập', 'Thiết bị', 'Người dùng đăng nhập', 'Người có hoạt động', 'Thao tác', 'Lượt xem trang', 'Tài khoản mới']].concat(D.map(function (d) { return [d.day, d.visits, d.loggedVisits, d.guestVisits, d.visitors, d.users, d.actors, d.actions, d.views, d.newUsers]; })), 'thong-ke-truy-cap.csv'); };
}

Array.prototype.forEach.call($('tabs').querySelectorAll('button'), function (b) { b.onclick = function () { S.tab = b.getAttribute('data-t'); renderPane(); }; });
$('dayIn').onchange = function () { if (this.value) { S.day = this.value; loadAll(); } };
$('prevDay').onclick = function () { S.day = dayStr(Date.parse(S.day + 'T00:00:00Z') - 86400000 + VN); loadAll(); };
$('nextDay').onclick = function () { S.day = dayStr(Date.parse(S.day + 'T00:00:00Z') + 86400000 + VN); loadAll(); };
$('todayBtn').onclick = function () { S.day = dayStr(Date.now()); loadAll(); };
$('rangeSel').onchange = function () { S.range = +this.value; loadAll(); };
$('stuOnly').onchange = function () { S.stu = this.checked; loadAll(); };
$('refresh').onclick = loadAll;

fetch('/api/me', { credentials: 'same-origin' }).then(function (r) { return r.json(); }).then(function (d) {
  S.me = d.user;
  if (!d.user || (d.user.role !== 'teacher' && d.user.role !== 'admin')) { location.href = 'login.html?next=access.html'; return; }
  if (d.user.role === 'admin') { $('stuWrap').style.display = ''; $('backLink').href = 'admin.html'; $('backLink').textContent = '← Quản trị'; $('scopeNote').innerHTML = '🔐 <b>Quản trị:</b> bạn thấy toàn bộ lượt truy cập, kể cả khách chưa đăng nhập. Hệ thống <b>không lưu địa chỉ IP</b>, chỉ lưu mã rút gọn để nhận ra cùng một thiết bị. Dữ liệu được giữ 120 ngày. Số liệu bắt đầu tính từ lúc tính năng này được bật.'; }
  else $('scopeNote').innerHTML = '👩‍🏫 <b>Giáo viên:</b> bạn chỉ thấy <b>học sinh trong các lớp của mình</b>. Số liệu bắt đầu tính từ lúc tính năng này được bật.';
  loadAll();
});
})();
</script>
</body>
</html>

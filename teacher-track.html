  var st = '<span class="tk-badge ' + (r.st === 'none' ? 'b-none' : r.st === 'pend' ? 'b-pend' : 'b-ok') + '">' + SC[r.st] + '</span>' + (r.late ? '<span class="tk-badge b-late">muộn</span>' : '') + (r.overdue ? '<span class="tk-badge b-late">quá hạn</span>' : '') + ((r.leaves || r.pastes) ? '<span class="tk-badge b-late" style="background:#fee2e2;color:#991b1b" title="Chế độ thi: số lần rời trang / thử dán nội dung">⚠️ rời ' + (r.leaves || 0) + (r.pastes ? ' · dán ' + r.pastes : '') + '</span>' : (r.strict ? '<span class="tk-badge b-ok" title="Chế độ thi đã bật">🔒</span>' : ''));
  var act = r.sub_id ? '<a class="tk-btn sm" href="teacher.html?tab=grade&sub=' + r.sub_id + '">' + (r.st === 'ok' ? 'Xem' : 'Chấm') + '</a>' : '<span class="tk-hint">—</span>';
  return '<tr><td>' + (r.st === 'none' && r.student_id ? '<input type="checkbox" data-sel="' + r.aid + '"' + (SEL[r.aid] ? ' checked' : '') + '>' : '') + '</td><td><b>' + esc(r.nm) + '</b><div class="tk-hint">' + esc(r.student_email) + '</div></td><td>' + (r.cnames.length ? r.cnames.map(function (c) { return '<span class="tk-cls">' + esc(c) + '</span>'; }).join('') : '<span class="tk-cls none">chưa vào lớp</span>') + '</td><td>' + esc(r.title) + '<div class="tk-hint">' + esc(r.skill) + ' · ' + esc(r.program) + '</div></td><td>' + fmt(r.asgT) + '</td><td>' + fmt(r.dueT) + '</td><td>' + st + '</td><td>' + sc + '</td><td>' + fmt(r.subT) + '</td><td>' + act + '</td></tr>';
}
function renderTable() {
  var rows = filtered().sort(function (a, b) { var x = sortVal(a, SORT.k), y = sortVal(b, SORT.k); return (x < y ? -1 : x > y ? 1 : 0) * SORT.d; });
  var pages = Math.max(1, Math.ceil(rows.length / PER)); if (PAGE > pages) PAGE = pages;
  $('thead').innerHTML = '<tr>' + COLS.map(function (c) { return '<th class="' + (c[2] ? 'nos' : '') + '" data-sort="' + (c[2] ? '' : c[0]) + '">' + (c[0] === 'sel' ? '<input type="checkbox" id="selAll" title="Chọn tất cả bài chưa nộp đang lọc">' : esc(c[1]) + (SORT.k === c[0] ? (SORT.d > 0 ? ' ▲' : ' ▼') : '')) + '</th>'; }).join('') + '</tr>';
  var gb = $('groupBy').value, body = '';
  if (!rows.length) body = '<tr><td class="tk-empty" colspan="10">Không có dòng nào khớp bộ lọc. Bấm “Xoá bộ lọc” để xem tất cả.</td></tr>';
  else if (gb) {
    var G = {}, order = []; rows.forEach(function (r) { var ks = gb === 'class' ? r.clsKey : gb === 'ex' ? [r.title] : [r.nm]; ks.forEach(function (k) { if (!G[k]) { G[k] = []; order.push(k); } G[k].push(r); }); });
    order.sort(function (a, b) { return a.localeCompare(b, 'vi'); });
    order.forEach(function (k) { var g = G[k], sub = g.filter(function (r) { return r.sub_id; }).length, sc = g.filter(function (r) { return r.pct != null && r.st === 'ok'; }), avg = sc.length ? Math.round(sc.reduce(function (s, r) { return s + r.pct; }, 0) / sc.length) : null; body += '<tr class="gh"><td colspan="10">' + esc(k) + ' — ' + g.length + ' bài · đã nộp ' + sub + '/' + g.length + ' · chưa nộp ' + (g.length - sub) + (avg == null ? '' : ' · điểm TB ' + avg + '%') + '</td></tr>' + g.map(rowHtml).join(''); });
    $('pager').innerHTML = '<span class="tk-hint">Đang nhóm — hiển thị toàn bộ ' + rows.length + ' dòng.</span>';
  } else body = rows.slice((PAGE - 1) * PER, PAGE * PER).map(rowHtml).join('');
  $('tbody').innerHTML = body;
  if (!gb) $('pager').innerHTML = pages > 1 ? '<button class="tk-btn sm" data-pg="-1"' + (PAGE <= 1 ? ' disabled' : '') + '>← Trước</button><span>Trang ' + PAGE + '/' + pages + '</span><button class="tk-btn sm" data-pg="1"' + (PAGE >= pages ? ' disabled' : '') + '>Sau →</button>' : '';
  var cnt = rows.length, subN = rows.filter(function (r) { return r.sub_id; }).length;
  $('resCount').innerHTML = cnt + ' / ' + ROWS.length + ' dòng <span class="tk-hint" style="font-weight:500">· đã nộp ' + subN + ' · chưa nộp ' + (cnt - subN) + '</span>';
  updRemind();
}
function render() { renderCards(); renderClasses(); renderFilters(); renderTable(); renderPresets(); }
function updRemind() { var n = Object.keys(SEL).filter(function (k) { return SEL[k]; }).length; $('remN').textContent = n; $('btnRemind').disabled = !n; }

/* ───── sự kiện ───── */
document.addEventListener('click', function (e) {
  var t = e.target, el;
  if ((el = t.closest('[data-fk]'))) {
    var k = el.getAttribute('data-fk'), v = el.getAttribute('data-fv');
    if (k === 'cls') { if (!v) F.cls = []; else { var i = F.cls.indexOf(v); if (i >= 0) F.cls.splice(i, 1); else F.cls.push(v); } }
    else if (k === 'sc') { F.sc = F.sc === v ? '' : v; F.scMin = ''; F.scMax = ''; }
    else F[k] = (F[k] === v ? '' : v);
    PAGE = 1; render(); return;
  }
  if ((el = t.closest('[data-card]'))) { var c = el.getAttribute('data-card'); F.st = F.st === c ? '' : c; PAGE = 1; render(); return; }
  if ((el = t.closest('tr[data-cls]'))) { var n = el.getAttribute('data-cls'); F.cls = F.cls.length === 1 && F.cls[0] === n ? [] : [n]; PAGE = 1; render(); window.scrollTo({ top: $('filters').offsetTop - 80, behavior: 'smooth' }); return; }
  if ((el = t.closest('th[data-sort]')) && el.getAttribute('data-sort')) { var sk = el.getAttribute('data-sort'); if (SORT.k === sk) SORT.d *= -1; else { SORT.k = sk; SORT.d = (sk === 'nm' || sk === 'title' || sk === 'cls') ? 1 : -1; } renderTable(); return; }
  if ((el = t.closest('[data-pg]'))) { PAGE += +el.getAttribute('data-pg'); renderTable(); return; }
  if (t.id === 'btnClear') { F = { q: '', cls: [], st: '', skill: '', prog: '', ex: '', sc: '', scMin: '', scMax: '', sub: '', due: '' }; PAGE = 1; render(); }
});
document.addEventListener('change', function (e) {
  var t = e.target;
  if (t.id === 'fex') { F.ex = t.value; PAGE = 1; render(); }
  else if (t.id === 'groupBy') { renderTable(); renderPresets(); }
  else if (t.id === 'fmin' || t.id === 'fmax') { F[t.id === 'fmin' ? 'scMin' : 'scMax'] = t.value; F.sc = ''; PAGE = 1; renderFilters(); renderTable(); }
  else if (t.id === 'selAll') { filtered().forEach(function (r) { if (r.st === 'none' && r.student_id) SEL[r.aid] = t.checked; }); renderTable(); }
  else if (t.hasAttribute && t.hasAttribute('data-sel')) { SEL[t.getAttribute('data-sel')] = t.checked; updRemind(); }
});
var qt; document.addEventListener('input', function (e) { if (e.target.id === 'fq') { var v = e.target.value; clearTimeout(qt); qt = setTimeout(function () { F.q = v.trim(); PAGE = 1; renderCards(); renderTable(); renderFilters(); var f = $('fq'); f.focus(); try { f.setSelectionRange(f.value.length, f.value.length); } catch (x) {} }, 250); } });
$('btnReload').onclick = function () { load().then(function () { toast('Đã làm mới'); }); };
$('btnRemind').onclick = function () {
  var ids = Object.keys(SEL).filter(function (k) { return SEL[k]; }).map(Number); if (!ids.length) return;
  if (!confirm('Gửi thông báo nhắc làm bài cho ' + ids.length + ' học sinh đã chọn?')) return;
  fetch('/api/teacher/remind', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ids: ids }) }).then(function (r) { return r.json(); }).then(function (d) { SEL = {}; toast('Đã nhắc ' + (d.sent || 0) + ' học sinh' + (d.skipped ? ' (bỏ qua ' + d.skipped + ': đã nộp / vừa nhắc / chưa có tài khoản)' : '')); renderTable(); }).catch(function () { toast('Không gửi được'); });
};
$('btnCsv').onclick = function () {
  var rows = filtered(), head = ['Học sinh', 'Email', 'Lớp', 'Đề', 'Kỹ năng', 'Chương trình', 'Ngày giao', 'Hạn nộp', 'Trạng thái', 'Nộp muộn', 'Điểm', 'Tối đa', 'Phần trăm', 'Nộp lúc', 'Số lần rời trang'];
  function q(s) { s = String(s == null ? '' : s); return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
  var out = [head.map(q).join(',')].concat(rows.map(function (r) { return [r.nm, r.student_email, r.cnames.join(' / '), r.title, r.skill, r.program, fmt(r.asgT), fmt(r.dueT), SC[r.st] + (r.overdue ? ' (quá hạn)' : ''), r.late ? 'có' : '', r.sub_id ? r.score : '', r.sub_id ? r.max_score : '', r.pct == null ? '' : r.pct, fmt(r.subT), r.strict ? (r.leaves || 0) : ''].map(q).join(','); }));
  var blob = new Blob(['﻿' + out.join('\r\n')], { type: 'text/csv;charset=utf-8' }), a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'theo-doi-bai-nop-' + new Date().toISOString().slice(0, 10) + '.csv'; document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500); toast('Đã xuất ' + rows.length + ' dòng');
};

/* ───── bộ lọc đã lưu ───── */
var BLANK = { q: '', cls: [], st: '', skill: '', prog: '', ex: '', sc: '', scMin: '', scMax: '', sub: '', due: '' };
var BUILTIN = [
  { id: 'b1', name: '⏰ Quá hạn chưa nộp', data: { st: 'overdue' } },
  { id: 'b2', name: '⏳ Chờ chấm', data: { st: 'pend' } },
  { id: 'b3', name: '⌛ Hạn trong 3 ngày (chưa nộp)', data: { due: '3' } },
  { id: 'b4', name: '🔴 Điểm dưới 50%', data: { sc: 'lo' } },
  { id: 'b5', name: '🐢 Nộp muộn', data: { st: 'late' } },
  { id: 'b6', name: '🗓️ Nộp 7 ngày qua', data: { sub: '7' } },
  { id: 'b7', name: '⚠️ Nghi gian lận (rời trang)', data: { st: 'sus' } }
];
var SAVED = [], ACTIVE = '';
function snapshot() { var o = {}; Object.keys(BLANK).forEach(function (k) { o[k] = Array.isArray(F[k]) ? F[k].slice() : F[k]; }); o.groupBy = $('groupBy').value; return o; }
function sameData(a, b) { var x = Object.assign({}, BLANK, a), y = Object.assign({}, BLANK, b); return Object.keys(BLANK).every(function (k) { return JSON.stringify(x[k]) === JSON.stringify(y[k]); }); }
function applyPreset(data) {
  F = Object.assign({}, BLANK, JSON.parse(JSON.stringify(data || {}))); delete F.groupBy; $('groupBy').value = (data && data.groupBy) || ''; PAGE = 1; render();
}
function renderPresets() {
  var cur = snapshot(), none = sameData(cur, {}), h = '<div class="tk-f" style="margin-bottom:6px"><span class="tk-fl" style="width:auto">⚡ Lọc nhanh</span><span class="tk-hint">bấm một nút để lọc ngay — bấm lại để bỏ lọc</span></div><div>';
  BUILTIN.concat(SAVED).forEach(function (p) {
    var on = !none && sameData(cur, p.data);
    h += '<span class="tk-pre' + (on ? ' on' : '') + '"><button data-pre="' + p.id + '">' + esc(p.name) + '</button>' + (String(p.id)[0] === 'b' ? '' : '<button class="x" data-predel="' + p.id + '" title="Xoá bộ lọc này">✕</button>') + '</span>';
  });
  h += '<button class="tk-btn sm" id="btnSavePre" style="margin-bottom:6px"' + (none ? ' disabled title="Hãy chọn vài bộ lọc trước rồi mới lưu"' : '') + '>💾 Lưu bộ lọc hiện tại…</button></div>';
  $('presetBox').innerHTML = h;
}
function loadSaved() {
  return fetch('/api/me/filters?page=track', { credentials: 'same-origin' }).then(function (r) { return r.ok ? r.json() : { filters: [] }; }).then(function (d) { SAVED = d.filters || []; renderPresets(); }).catch(function () {});
}
document.addEventListener('click', function (e) {
  var t = e.target, el;
  if ((el = t.closest('[data-pre]'))) {
    var id = el.getAttribute('data-pre'), p = BUILTIN.concat(SAVED).filter(function (x) { return String(x.id) === id; })[0]; if (!p) return;
    if (sameData(snapshot(), p.data)) applyPreset({}); else applyPreset(p.data); return;
  }
  if ((el = t.closest('[data-predel]'))) {
    var did = el.getAttribute('data-predel'), pr = SAVED.filter(function (x) { return String(x.id) === did; })[0];
    if (!pr || !confirm('Xoá bộ lọc “' + pr.name + '”?')) return;
    fetch('/api/me/filters/' + did, { method: 'DELETE', credentials: 'same-origin' }).then(function () { SAVED = SAVED.filter(function (x) { return String(x.id) !== did; }); renderPresets(); toast('Đã xoá bộ lọc'); }); return;
  }
  if (t.id === 'btnSavePre') {
    var name = prompt('Đặt tên cho bộ lọc này (ví dụ: “12A2 chưa nộp quá hạn”):', suggestName()); if (!name || !name.trim()) return;
    fetch('/api/me/filters', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ page: 'track', name: name.trim(), data: snapshot() }) }).then(function (r) { return r.json(); }).then(function (d) {
      if (!d.ok) { toast(d.error || 'Không lưu được'); return; } toast(d.updated ? 'Đã cập nhật bộ lọc' : 'Đã lưu bộ lọc'); loadSaved();
    }).catch(function () { toast('Không lưu được'); });
  }
});
function suggestName() {
  var p = []; if (F.cls.length) p.push(F.cls.join(' + ')); var st = { none: 'chưa nộp', overdue: 'quá hạn chưa nộp', pend: 'chờ chấm', ok: 'đã chấm', late: 'nộp muộn' }[F.st]; if (st) p.push(st);
  if (F.skill) p.push(F.skill); if (F.prog) p.push(F.prog); if (F.sc) p.push({ lo: 'điểm <50%', mid: 'điểm 50–79%', hi: 'điểm ≥80%' }[F.sc]); return p.join(' · ');
}

var pre = new URLSearchParams(location.search);
load().then(function () {
  var c = pre.get('class'); if (c) { var g = GROUPS.filter(function (x) { return String(x.id) === c; })[0]; if (g) { F.cls = [g.name]; } }
  if (pre.get('status')) F.st = pre.get('status');
  if (pre.get('ex')) F.ex = pre.get('ex');
  if (pre.get('due')) F.due = pre.get('due');
  render(); loadSaved();
});
})();
</script>

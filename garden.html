<style>
.gd-wrap { max-width: 1760px; margin: 0 auto; padding: 8px 10px 40px; }
/* ───────── Màn hình game ───────── */
.gd-stage { --tray: 188px; --top: 92px; --sky1: #5CBDF5; --sky2: #D3F1FF; --m1: #9DBDE0; --m2: #84A8D2; --h1: #93D66F; --h2: #72C45B; --g1: #86CF63; --g2: #5FB24B; --w1: #62C6F6; --w2: #A8E4FF; --dim: rgba(0,0,0,0);
  position: relative; height: clamp(620px, calc(100svh - 176px), 940px); border-radius: 30px; overflow: hidden; border: 5px solid #fff; box-shadow: 0 18px 50px rgba(40,90,60,.32); background: linear-gradient(180deg, var(--sky1), var(--sky2) 55%); user-select: none; isolation: isolate; }
.gd-stage.dusk { --sky1: #FF9A6B; --sky2: #FFE0A8; --m1: #B58BA8; --m2: #9A6F95; --h1: #7DB35E; --h2: #5D9E4E; --g1: #6FB654; --g2: #4C9A42; --w1: #E7A27A; --w2: #FFD2A8; --dim: rgba(255,120,60,.16); }
.gd-stage.night { --sky1: #0F1B4D; --sky2: #3A4A93; --m1: #3F4F8C; --m2: #2F3D78; --h1: #2F6B52; --h2: #245A47; --g1: #2F7B4E; --g2: #226A41; --w1: #2E6FB0; --w2: #5C97D6; --dim: rgba(14,20,80,.38); }
.gd-hq .bvS { filter: url(#gdBevelS); } .gd-hq .bvM { filter: url(#gdBevelM); } .gd-hq .bvL { filter: url(#gdBevelL); } .gd-hq .bvXL { filter: url(#gdBevelXL); }
.gd-stage > svg.scene { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }
.gd-vig { position: absolute; inset: 0; z-index: 3; pointer-events: none; background: radial-gradient(ellipse at 50% 44%, rgba(255,255,255,0) 52%, rgba(24,34,86,.30) 100%), linear-gradient(135deg, rgba(255,238,196,.22) 0%, rgba(255,238,196,0) 34%), linear-gradient(315deg, rgba(60,40,120,.14) 0%, rgba(60,40,120,0) 30%); }
.night .gd-vig { background: radial-gradient(ellipse at 50% 44%, rgba(255,255,255,0) 45%, rgba(8,10,50,.5) 100%); }
.gd-fx { position: absolute; inset: 0; z-index: 4; pointer-events: none; overflow: hidden; border-radius: 8px; }
.gd-fx i { position: absolute; display: block; opacity: 0; }
.gd-fx .pf { width: 7px; height: 7px; border-radius: 50%; background: radial-gradient(circle, #FFFBD0 0, rgba(255,246,176,.9) 35%, rgba(255,246,176,0) 70%); animation: gdPf 8s ease-in-out infinite; }
.gd-fx .lf { width: 11px; height: 7px; border-radius: 0 100% 0 100%; background: linear-gradient(135deg, #8FD36B, #4FA050); animation: gdLf 11s linear infinite; }
.gd-fx .lf.o { background: linear-gradient(135deg, #FFC46B, #E0833A); } .gd-fx .pt { width: 9px; height: 6px; border-radius: 100% 0 100% 0; background: linear-gradient(135deg, #FFD0E2, #FF8FB8); animation: gdLf 12s linear infinite; }
.gd-fx .ff { width: 6px; height: 6px; border-radius: 50%; background: radial-gradient(circle, #FFFBB0, rgba(255,240,120,0) 70%); box-shadow: 0 0 10px 4px rgba(255,240,120,.7); animation: gdFf 6s ease-in-out infinite; display: none; } .night .gd-fx .ff { display: block; }
.gd-fx .gl { width: 9px; height: 9px; background: radial-gradient(circle, #fff, rgba(255,255,255,0) 70%); animation: gdGl 3.4s ease-in-out infinite; }
.gd-fx .rn { width: 8px; height: 8px; border-radius: 50%; background: radial-gradient(circle, #F4E4FF, rgba(190,140,255,0) 70%); box-shadow: 0 0 9px 3px rgba(190,140,255,.6); animation: gdRn 9s ease-in-out infinite; }
@keyframes gdPf { 0% { transform: translate(0, 0) scale(.5); opacity: 0; } 15% { opacity: .95; } 80% { opacity: .8; } 100% { transform: translate(60px, -90px) scale(1.1); opacity: 0; } }
@keyframes gdLf { 0% { transform: translate(0, -30px) rotate(0); opacity: 0; } 10% { opacity: .95; } 50% { transform: translate(40px, 200px) rotate(200deg); } 100% { transform: translate(-30px, 480px) rotate(420deg); opacity: 0; } }
@keyframes gdFf { 0%, 100% { transform: translate(0, 0); opacity: .1; } 25% { opacity: 1; } 50% { transform: translate(24px, -18px); opacity: .35; } 75% { transform: translate(-16px, -34px); opacity: 1; } }
@keyframes gdGl { 0%, 100% { opacity: 0; transform: scale(.3); } 50% { opacity: 1; transform: scale(1.3); } }
@keyframes gdRn { 0% { transform: translate(0, 20px) scale(.5); opacity: 0; } 20% { opacity: 1; } 100% { transform: translate(20px, -120px) scale(1); opacity: 0; } }
.rays polygon { animation: gdRay 7s ease-in-out infinite; } @keyframes gdRay { 0%, 100% { opacity: .35; } 50% { opacity: 1; } } .night .rays { display: none; }
.ic { display: block; width: 34px; height: 34px; } .ic svg { width: 100%; height: 100%; display: block; overflow: visible; filter: drop-shadow(0 2px 2px rgba(60,30,5,.35)); } .gd-pill .ic, .gd-earn .ic { display: inline-block; width: 26px; height: 26px; vertical-align: middle; margin-right: 4px; }
.gd-dim { position: absolute; inset: 0; z-index: 2; background: var(--dim); mix-blend-mode: multiply; pointer-events: none; }
.gd-sky-fx { position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.gd-sun { position: absolute; right: 16%; top: 7%; width: 84px; height: 84px; border-radius: 50%; background: radial-gradient(circle at 40% 38%, #FFF7B0, #FFD23F 60%, #FFB800); box-shadow: 0 0 0 14px rgba(255,214,63,.25), 0 0 60px 26px rgba(255,214,63,.38); animation: gdSun 6s ease-in-out infinite; transition: opacity .6s; }
.gd-moon { position: absolute; right: 16%; top: 8%; width: 70px; height: 70px; border-radius: 50%; background: #FFF6D0; box-shadow: inset -16px -6px 0 0 #E7DCAE, 0 0 40px 14px rgba(255,246,208,.35); opacity: 0; transition: opacity .6s; }
.gd-star { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fff; opacity: 0; animation: gdTw 3s ease-in-out infinite; }
.night .gd-sun { opacity: 0; } .night .gd-moon { opacity: 1; } .night .gd-star { opacity: .9; } .dusk .gd-sun { box-shadow: 0 0 0 14px rgba(255,120,60,.3), 0 0 60px 26px rgba(255,120,60,.4); }
@keyframes gdSun { 50% { box-shadow: 0 0 0 20px rgba(255,214,63,.18), 0 0 74px 34px rgba(255,214,63,.34); } } @keyframes gdTw { 50% { transform: scale(1.8); opacity: .3; } }
.gd-cloud { position: absolute; background: #fff; border-radius: 99px; opacity: .93; animation: gdCloud linear infinite; }
.gd-cloud::before, .gd-cloud::after { content: ""; position: absolute; background: #fff; border-radius: 50%; } .gd-cloud::before { width: 55%; height: 150%; left: 14%; top: -62%; } .gd-cloud::after { width: 40%; height: 120%; left: 50%; top: -42%; }
.night .gd-cloud { opacity: .18; } .dusk .gd-cloud { background: #FFE9D6; } .dusk .gd-cloud::before, .dusk .gd-cloud::after { background: #FFE9D6; }
@keyframes gdCloud { from { transform: translateX(-200px); } to { transform: translateX(calc(100vw + 100px)); } }
.gd-bird { position: absolute; font-size: 20px; animation: gdFly linear infinite; opacity: .85; } .night .gd-bird { display: none; }
@keyframes gdFly { from { transform: translate(-80px, 0); } 50% { transform: translate(50vw, -26px); } to { transform: translate(110vw, 10px); } }
.gd-bfly { position: absolute; z-index: 4; font-size: 22px; pointer-events: none; animation: gdBf 14s ease-in-out infinite; } .night .gd-bfly { display: none; }
@keyframes gdBf { 0% { transform: translate(0, 0); } 25% { transform: translate(120px, -40px); } 50% { transform: translate(240px, 10px); } 75% { transform: translate(100px, 50px); } 100% { transform: translate(0, 0); } }
/* cảnh vật chuyển động */
.sway { animation: gdSway 5s ease-in-out infinite; transform-origin: 0 0; } .sway.b { animation-duration: 6.4s; animation-delay: -2s; }
@keyframes gdSway { 0%, 100% { transform: rotate(-1.4deg); } 50% { transform: rotate(1.4deg); } }
.flow { stroke-dasharray: 26 40; animation: gdFlow 3.2s linear infinite; } @keyframes gdFlow { to { stroke-dashoffset: -132; } }
.smoke { animation: gdSmoke 4s ease-out infinite; opacity: 0; } @keyframes gdSmoke { 0% { transform: translate(0, 0) scale(.5); opacity: .8; } 100% { transform: translate(26px, -70px) scale(1.6); opacity: 0; } }
.duck { animation: gdDuck 5s ease-in-out infinite; } @keyframes gdDuck { 50% { transform: translate(10px, 6px); } }
.boat { animation: gdBoat 4s ease-in-out infinite; transform-origin: center; } @keyframes gdBoat { 50% { transform: translateY(5px) rotate(2deg); } }
.win { fill: #FFF3B8; } .night .win, .dusk .win { fill: #FFC93C; filter: drop-shadow(0 0 6px #FFC93C); } .lampg { opacity: 0; } .night .lampg, .dusk .lampg { opacity: 1; }
/* ───────── HUD ───────── */
.gd-top { position: absolute; z-index: 10; left: 0; right: 0; top: 0; padding: 12px 16px; display: flex; align-items: flex-start; gap: 12px; pointer-events: none; } .gd-top > * { pointer-events: auto; }
.gd-me { display: flex; align-items: center; gap: 10px; background: linear-gradient(180deg, #FFF6E2, #FFE7B8); border: 3px solid #C98E55; border-radius: 22px; padding: 7px 14px 7px 8px; box-shadow: 0 6px 16px rgba(80,40,10,.3), inset 0 2px 0 #fff; min-width: 0; }
.gd-me .av { width: 62px; height: 62px; border-radius: 50%; border: 3px solid #F2B63D; background: #fff; overflow: hidden; display: grid; place-items: center; font-size: 34px; flex: none; box-shadow: 0 3px 8px rgba(0,0,0,.25); } .gd-me .av svg { width: 100%; height: 100%; display: block; }
.gd-me .who { min-width: 0; } .gd-me .lv { font-weight: 800; font-size: 14px; color: #6B3E12; line-height: 1.2; white-space: nowrap; }
.gd-bar { width: 190px; max-width: 100%; height: 13px; border-radius: 99px; background: #E4CFA2; overflow: hidden; margin: 5px 0 3px; box-shadow: inset 0 2px 3px rgba(80,40,10,.35); } .gd-bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #7BDC6B, #3DBE5C); transition: width .6s; }
.gd-me .nx { font-size: 11.5px; font-weight: 700; color: #8A5A2E; }
.gd-sign { flex: 1; display: flex; flex-direction: column; align-items: center; min-width: 0; pointer-events: none; }
.gd-logo { display: flex; align-items: center; gap: 8px; filter: drop-shadow(0 4px 6px rgba(20,60,30,.35)); } .gd-logo .mk { width: 44px; height: 44px; }
.gd-logo h1 { margin: 0; font-size: 30px; line-height: 1; color: #fff; text-shadow: 0 3px 0 #2E8B57, 0 6px 12px rgba(30,80,40,.4); letter-spacing: .3px; font-weight: 800; white-space: nowrap; } .gd-logo h1 span { color: #FFE14D; text-shadow: 0 3px 0 #D98A0B, 0 6px 12px rgba(120,60,0,.3); }
.gd-gname { pointer-events: auto; margin-top: 6px; display: inline-flex; align-items: center; gap: 8px; max-width: 100%; background: linear-gradient(180deg, #C98E55, #A96F3C); color: #FFF3D6; border: 3px solid #7A4A1E; border-radius: 14px; padding: 5px 16px; font: 800 15px inherit; font-family: inherit; cursor: pointer; box-shadow: 0 5px 12px rgba(60,30,5,.4), inset 0 2px 0 rgba(255,255,255,.35); text-shadow: 0 2px 0 rgba(60,30,5,.5); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gd-res { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; align-items: center; margin-left: auto; }
.gd-pill { display: inline-flex; align-items: center; gap: 7px; background: linear-gradient(180deg, #FFF6E2, #FFE7B8); border: 3px solid #C98E55; border-radius: 99px; padding: 5px 15px 5px 8px; font: 800 17px inherit; font-family: inherit; color: #6B3E12; box-shadow: 0 5px 12px rgba(80,40,10,.3), inset 0 2px 0 #fff; min-height: 42px; cursor: default; }
.gd-pill.btn { cursor: pointer; padding: 5px 15px; } .gd-pill.btn .ic { width: 28px; height: 28px; } .gd-pill.btn:hover { filter: brightness(1.06); }
.coin { display: inline-block; width: 1.15em; height: 1.15em; border-radius: 50%; vertical-align: -0.2em; background: radial-gradient(circle at 35% 30%, #FFF3A0 0 18%, #FFD23F 45%, #E59A0B 100%); border: .1em solid #B87408; box-shadow: inset 0 0 0 .13em rgba(255,255,255,.35), 0 1px 2px rgba(80,40,0,.4); position: relative; } .coin::after { content: ""; position: absolute; inset: 28%; border-radius: 50%; border: .08em solid rgba(160,95,5,.55); }
.gd-earn { border: 3px solid #fff; cursor: pointer; font: 800 15px inherit; font-family: inherit; background: linear-gradient(180deg, #FFB347, #FF6B6B); color: #fff; border-radius: 99px; padding: 8px 18px; min-height: 46px; box-shadow: 0 7px 18px rgba(255,107,107,.55); animation: gdPulse 2.4s ease-in-out infinite; text-shadow: 0 2px 0 rgba(160,40,40,.5); } @keyframes gdPulse { 50% { transform: scale(1.06); } }
/* thanh công cụ bên trái */
.gd-dock { position: absolute; z-index: 9; left: 12px; top: calc(var(--top) + 6px); display: flex; flex-direction: column; gap: 8px; padding: 8px; background: linear-gradient(180deg, rgba(201,142,85,.95), rgba(169,111,60,.95)); border: 3px solid #7A4A1E; border-radius: 20px; box-shadow: 0 8px 20px rgba(60,30,5,.4), inset 0 2px 0 rgba(255,255,255,.3); }
.gd-tool { width: 64px; border: 2px solid #E8C48C; background: linear-gradient(180deg, #FFF6E2, #FFE2AA); color: #6B3E12; border-radius: 14px; padding: 6px 2px 5px; font: 800 10.5px inherit; font-family: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 1px; line-height: 1.15; transition: transform .1s; }
.gd-tool .ic { margin: 0 auto 2px; width: 36px; height: 36px; } .gd-tool:hover { transform: translateY(-2px); } .gd-tool.on { background: linear-gradient(180deg, #A58BFF, #6F58EE); color: #fff; border-color: #fff; box-shadow: 0 0 0 3px rgba(111,88,238,.5); } .gd-tool:disabled { opacity: .5; cursor: not-allowed; } .gd-tool small { font-size: 9.5px; font-weight: 700; opacity: .85; }
/* khu vực chơi */
.gd-play { position: absolute; z-index: 5; left: 98px; right: 22px; top: var(--top); bottom: var(--tray); display: flex; align-items: center; justify-content: center; padding-bottom: 34px; }
.gd-lawn { position: relative; --ts: 64px; width: calc(var(--ts) * var(--cols) + 42px); padding: 14px; border-radius: 22px; background: #7A5230; border: 7px solid #B98046; box-shadow: inset 0 0 0 3px #D9A566, 0 14px 0 -2px rgba(70,40,10,.35), 0 22px 34px rgba(30,60,20,.45); flex: none; touch-action: manipulation; }
.gd-lawn::before { content: ""; position: absolute; inset: 0; border-radius: 15px; pointer-events: none; box-shadow: inset 0 0 14px rgba(40,20,0,.35); z-index: 3; }
.gd-zwrap { position: relative; width: calc(var(--ts) * var(--cols)); height: calc(var(--ts) * var(--rows)); border-radius: 8px; overflow: hidden; }
.gd-zsvg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.gd-grid { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(var(--cols), var(--ts)); grid-auto-rows: var(--ts); }
.gt { position: relative; cursor: pointer; outline: none; -webkit-tap-highlight-color: transparent; }
.gt::before { content: ""; position: absolute; inset: 3px; border-radius: 12px; background: radial-gradient(circle at 20% 30%, rgba(255,255,255,.22) 0 2px, transparent 3px), radial-gradient(circle at 70% 65%, rgba(60,120,40,.25) 0 2px, transparent 3px), radial-gradient(circle at 45% 80%, rgba(255,255,255,.16) 0 1.5px, transparent 2.5px), var(--bed, #92D46D); box-shadow: inset 0 0 0 2px var(--bedl, rgba(70,120,40,.4)), 0 3px 0 rgba(70,40,10,.3); }
.gt.alt::before { background-color: var(--bed2, #87C964); }
.gt.cov::before, .gt.bigc::before { display: none; } .gt.cov::after, .gt.bigc::after { display: none; } .gt.bigc { z-index: 4; }
.bigart { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 4; } .bigart svg { width: 100%; height: 100%; display: block; overflow: visible; }
.gt.pop svg.sp, .gt.pop .bigart { animation: gdPopIn .7s cubic-bezier(.2,1.7,.4,1) both; transform-origin: 50% 90%; } @keyframes gdPopIn { from { transform: scale(.2) translateY(14px); opacity: 0; } 60% { opacity: 1; } to { transform: scale(1); } }
.gt.pop::before { animation: gdDust .6s ease-out; } @keyframes gdDust { 0% { box-shadow: inset 0 0 0 2px var(--bedl), 0 0 0 0 rgba(255,255,255,.9); } 100% { box-shadow: inset 0 0 0 2px var(--bedl), 0 0 0 16px rgba(255,255,255,0); } }
.gt.pv-ok::after, .gt.pv-bad::after { content: ''; display: block !important; position: absolute; inset: 3px; border-radius: 12px; z-index: 6; pointer-events: none; } .gt.pv-ok::after { background: rgba(60,200,110,.42); outline: 3px solid #22C55E; } .gt.pv-bad::after { background: rgba(240,70,70,.4); outline: 3px solid #EF4444; }
.gt.blk { cursor: default; pointer-events: none; } .gt.blk::before { display: none; }
.gt.has::after { content: ""; position: absolute; left: 20%; right: 20%; bottom: 8%; height: 16%; border-radius: 50%; background: rgba(60,35,10,.32); }
.gt:not(.blk):hover::before { box-shadow: inset 0 0 0 3px rgba(255,255,255,.85), 0 3px 0 rgba(70,40,10,.3); } .gt.sel::before { box-shadow: inset 0 0 0 3px #FFD23F, 0 3px 0 rgba(70,40,10,.3); }
.gt:hover, .gt.sel { z-index: 3; }
.gt svg.sp { position: absolute; left: 0; top: 0; width: 100%; height: 100%; transform-origin: 50% 90%; z-index: 1; } .gt.grow svg.sp { animation: gdSway2 4.5s ease-in-out infinite; } .gt.tree svg.sp { animation-duration: 6s; }
@keyframes gdSway2 { 0%, 100% { transform: rotate(-1.6deg); } 50% { transform: rotate(1.6deg); } }
.gt .ready { position: absolute; right: 2px; top: 0; z-index: 2; font-size: calc(var(--ts) * .3); animation: gdPop 1.2s ease-in-out infinite; filter: drop-shadow(0 2px 2px rgba(0,0,0,.25)); } @keyframes gdPop { 50% { transform: translateY(-5px) scale(1.15); } }
.gt .tm { position: absolute; left: 4px; right: 4px; top: 2px; z-index: 2; font-size: 10px; font-weight: 800; color: #fff; text-align: center; text-shadow: 0 1px 2px rgba(0,0,0,.6); pointer-events: none; } .gt .tm i { display: block; height: 4px; border-radius: 4px; background: rgba(0,0,0,.3); margin-bottom: 1px; overflow: hidden; } .gt .tm i b { display: block; height: 100%; background: #FFE14D; }
.gt .wd { position: absolute; left: 3px; bottom: 1px; z-index: 2; font-size: calc(var(--ts) * .2); letter-spacing: -2px; }
.gd-pets { position: absolute; left: 0; top: 0; width: calc(var(--ts) * var(--cols)); height: calc(var(--ts) * var(--rows)); pointer-events: none; z-index: 4; }
.gd-pet { position: absolute; left: 0; top: 0; width: var(--ts); height: var(--ts); transition: transform 3.2s linear; pointer-events: auto; cursor: pointer; z-index: 5; }
.gd-pet svg { width: 100%; height: 100%; animation: gdHop .7s ease-in-out infinite; transform-origin: 50% 90%; } .gd-pet.rest svg { animation: gdBreath 2.4s ease-in-out infinite; }
.gd-pet .mood { position: absolute; left: 50%; top: -6px; transform: translateX(-50%); font-size: calc(var(--ts) * .26); animation: gdPop 1.4s ease-in-out infinite; }
@keyframes gdHop { 50% { transform: translateY(-9%); } } @keyframes gdBreath { 50% { transform: scale(1.04, .97); } } .gd-spin { animation: gdSpin 5s linear infinite; } @keyframes gdSpin { to { transform: rotate(360deg); } }
.gd-float { position: absolute; z-index: 20; font-weight: 800; font-size: 18px; color: #fff; text-shadow: 0 2px 3px rgba(0,0,0,.6); pointer-events: none; animation: gdUp 1.3s ease-out forwards; white-space: nowrap; } @keyframes gdUp { from { opacity: 1; transform: translate(-50%, 0); } to { opacity: 0; transform: translate(-50%, -52px); } }
.gd-pop { position: absolute; z-index: 30; background: #fff; border-radius: 16px; box-shadow: 0 12px 30px rgba(30,40,80,.4); padding: 12px 14px; width: 220px; border: 2px solid var(--border); }
.gd-pop h4 { margin: 0 0 2px; font-size: 15px; } .gd-pop p { margin: 0 0 8px; font-size: 12.5px; color: var(--text-muted); line-height: 1.45; } .gd-pop .btns { display: flex; gap: 6px; flex-wrap: wrap; } .gd-pop button { border: 2px solid var(--border); background: var(--surface); border-radius: 11px; padding: 7px 10px; font: 800 12.5px inherit; font-family: inherit; cursor: pointer; min-height: 38px; color: var(--text); } .gd-pop button.pri { background: var(--primary); color: #fff; border-color: var(--primary); }
.wave { animation: gdWave 4.2s ease-in-out infinite; } @keyframes gdWave { 0%, 100% { transform: translateX(-14px); } 50% { transform: translateX(14px); } }
.snowf { animation: gdSnowF 6s linear infinite; } @keyframes gdSnowF { from { transform: translate(0, 0); } 50% { transform: translate(14px, 270px); } to { transform: translate(-6px, 540px); } }

function openQuiz() { $('quiz').classList.add('on'); (TOPICS ? Promise.resolve() : api('/api/garden/topics').then(function (d) { TOPICS = d; })).then(function () { drawSel(); nextQ(); }); }
function drawSel() {
  var h = '<button class="' + (QS.src === 'grammar' ? 'on' : '') + '" data-qs="grammar">📘 Ngữ pháp</button><button class="' + (QS.src === 'vocab' ? 'on' : '') + '" data-qs="vocab">📖 Từ vựng</button>';
  if (QS.src === 'grammar') {
    h += '<select id="qgrade" aria-label="Lớp">' + TOPICS.grades.map(function (g) { return '<option value="' + g + '"' + (+QS.grade === g ? ' selected' : '') + '>Lớp ' + g + '</option>'; }).join('') + '</select>';
    h += '<select id="qlesson" aria-label="Chủ đề"><option value="">Tất cả chủ đề</option>' + TOPICS.lessons.filter(function (l) { return l.grade === +QS.grade; }).map(function (l) { return '<option value="' + l.id + '"' + (QS.lesson === l.id ? ' selected' : '') + '>' + esc(l.title) + '</option>'; }).join('') + '</select>';
  } else h += '<select id="qlevel" aria-label="Cấp độ">' + TOPICS.levels.map(function (l) { return '<option value="' + l + '"' + (QS.level === l ? ' selected' : '') + '>' + l + '</option>'; }).join('') + '</select>';
  $('qsel').innerHTML = h;
  $('qsel').onclick = function (e) { var b = e.target.closest('[data-qs]'); if (b) { QS.src = b.getAttribute('data-qs'); qSave(); drawSel(); nextQ(); } };
  $('qsel').onchange = function (e) { if (e.target.id === 'qgrade') { QS.grade = +e.target.value; QS.lesson = ''; drawSel(); } else if (e.target.id === 'qlesson') QS.lesson = e.target.value; else if (e.target.id === 'qlevel') QS.level = e.target.value; qSave(); nextQ(); };
}
function nextQ() {
  $('qbody').innerHTML = '<p class="gd-sub">Đang tìm câu hỏi…</p>'; QLOCK = false;
  var url = '/api/garden/quiz?src=' + QS.src + (QS.src === 'grammar' ? '&grade=' + QS.grade + '&lesson=' + encodeURIComponent(QS.lesson) : '&level=' + QS.level);
  api(url).then(function (q) {
    QCUR = q; $('qsub').innerHTML = q.left > 0 ? 'Trả lời đúng để <b>lật thẻ thưởng</b>: 20–100 ' + COIN + ', hay trúng thẻ <b>+500</b>, <b>+1000</b>, <b>×2</b>, <b>×3</b> số xu hiện có! Kèm <b>+' + D.RULES.quizWater + ' 💧</b>. Hôm nay còn <b>' + q.left + '</b> câu có thưởng.' : 'Hôm nay bạn đã nhận đủ thưởng — vẫn có thể luyện thêm cho vui nhé!';
    $('qbody').innerHTML = '<div class="gd-q"><div class="tp">' + esc(q.topic) + '</div><div class="qt">' + esc(q.q) + '</div></div><div class="gd-opts">' + q.opts.map(function (o, i) { return '<button class="gd-opt" data-oi="' + i + '">' + esc(o) + '</button>'; }).join('') + '</div><div id="qfb"></div>';
    $('qbody').onclick = function (e) { var b = e.target.closest('[data-oi]'); if (b && !QLOCK) answer(+b.getAttribute('data-oi')); };
  }).catch(function (e) { $('qbody').innerHTML = '<p class="gd-sub">' + esc(e.message) + '</p>'; });
}
function answer(i) {
  QLOCK = true;
  api('/api/garden/quiz/answer', { qid: QCUR.qid, idx: i }).then(function (d) {
    setState(d); [].forEach.call(document.querySelectorAll('.gd-opt'), function (b, k) { if (k === d.answer) b.classList.add('ok'); else if (k === i) b.classList.add('bad'); });
    var g = d.gained || {};
    $('qfb').innerHTML = '<div class="gd-fb ' + (d.correct ? 'ok' : 'bad') + '">' + (d.correct ? '🎉 Chính xác! ' + (d.flip ? '<b>+' + g.water + ' 💧</b>' : '(hôm nay đã đủ thưởng)') : '😅 Chưa đúng rồi.') + '<br>' + esc(d.expl || '') + '</div>' + (d.flip ? flipHtml() : '<div class="gd-act"><button class="gd-btn pri" id="qnext">Câu tiếp ▶</button></div>');
    if ($('qnext')) $('qnext').onclick = nextQ;
    if (d.flip) { var fb = $('qfb'); fb.onclick = function (e) { var c = e.target.closest('.gd-card'); if (c && !c.classList.contains('open') && !fb._done) pickCard(d.flip, +c.getAttribute('data-k'), fb); }; }
  }).catch(function (e) { toast(e.message); QLOCK = false; });
}
function flipHtml() { var c = ''; for (var k = 0; k < D.FLIP.cards; k++) c += '<button class="gd-card" data-k="' + k + '" aria-label="Thẻ thưởng ' + (k + 1) + '"><span class="f back">🎁</span><span class="f front"></span></button>'; return '<div class="gd-flip"><h4>🎁 Chọn 1 thẻ để lật nhận thưởng!</h4><div class="gd-cards">' + c + '</div><div class="gd-prize" id="prize"></div></div>'; }
function cardFace(c, gain) {
  if (c.t === 'coin') return '<div><strong>' + c.v + '</strong><small>' + COIN + ' xu</small></div>';
  if (c.t === 'b500' || c.t === 'b1000') return '<div><small>🎉 BIG BONUS</small><strong>+' + c.v + '</strong><small>' + COIN + ' xu</small></div>';
  return '<div><small>' + (c.t === 'x2' ? 'DOUBLE' : 'TRIPLE') + '</small><strong>×' + (c.t === 'x2' ? 2 : 3) + '</strong><small>' + (gain != null ? '+' + gain + ' ' + COIN : 'số xu hiện có') + '</small></div>';
}
function pickCard(fid, k, fb) {
  fb._done = true;
  api('/api/garden/quiz/flip', { id: fid, pick: k }).then(function (d) {
    setState(d); var cards = fb.querySelectorAll('.gd-card');
    cards[k].querySelector('.front').innerHTML = cardFace(d.cards[k], d.gained); if (d.cards[k].t !== 'coin') cards[k].classList.add('big'); cards[k].classList.add('open');
    setTimeout(function () { [].forEach.call(cards, function (c, j) { if (j !== k) { c.querySelector('.front').innerHTML = cardFace(d.cards[j]); if (d.cards[j].t !== 'coin') c.classList.add('big'); c.classList.add('open', 'dim'); } }); }, 800);
    var jp = d.cards[k].t !== 'coin', pz = $('prize'); pz.className = 'gd-prize' + (jp ? ' jp' : ''); pz.innerHTML = jp ? '🎉 JACKPOT! +' + d.gained + ' ' + COIN : '+' + d.gained + ' ' + COIN;
    if (window.ewtCelebrate) window.ewtCelebrate(jp ? ['party-popper', 'star', 'sparkles', 'glowing-star', 'coin'] : ['star', 'sparkles'], { count: jp ? 26 : 6, from: $('xu') });
    var act = document.createElement('div'); act.className = 'gd-act'; act.innerHTML = '<button class="gd-btn pri" id="qnext">Câu tiếp ▶</button>'; fb.appendChild(act); $('qnext').onclick = nextQ;
  }).catch(function (e) { fb._done = false; toast(e.message); });
}

/* ───────── tham quan vườn bạn bè ───────── */
function drawShare(d) { $('flink').value = location.origin + '/garden.html?visit=' + d.token; $('fopen').checked = !!d.open; }
function openFriend() { $('frm').classList.add('on'); $('fmsg').textContent = ''; api('/api/garden/share').then(drawShare).catch(function () {}); setTimeout(function () { $('femail').focus(); }, 50); }
function goVisit() { var em = $('femail').value.trim(); if (!em) { $('fmsg').textContent = 'Hãy nhập email của bạn bè nhé.'; return; } location.href = 'garden.html?email=' + encodeURIComponent(em); }
$('femail').addEventListener('keydown', function (e) { if (e.key === 'Enter') goVisit(); });
$('fopen').addEventListener('change', function () { api('/api/garden/share', { open: $('fopen').checked }).then(function (d) { drawShare(d); toast(d.open ? 'Bạn bè có thể ghé thăm vườn của bạn 🌷' : 'Đã tắt chế độ cho bạn bè xem vườn.'); }); });

/* ───────── khởi động ───────── */
buildScene(); paintIcons(); gfxInit(); timeOfDay(); setInterval(timeOfDay, 60000);
try { if (localStorage.getItem('ewt-garden-fold')) { $('stage').classList.add('fold'); $('fold').textContent = '▴'; } } catch (e) {}
var QP = new URLSearchParams(location.search), VQ = QP.get('visit') ? 'token=' + encodeURIComponent(QP.get('visit')) : QP.get('email') ? 'email=' + encodeURIComponent(QP.get('email')) : '';
if (VQ) {
  VISIT = true; document.body.classList.add('visit'); document.title = 'Tham quan vườn — EWT Garden';
  api('/api/garden/visit?' + VQ).then(function (d) {
    VISIT = d.owner; setState(d); $('vtxt').textContent = d.owner.me ? '👀 Đây là khu vườn của chính bạn (chế độ xem).' : '👀 Bạn đang tham quan khu vườn của ' + d.owner.name + ' — chỉ xem thôi nhé!';
    if (d.owner.avatar && window.ewtAvatarInto) window.ewtAvatarInto($('gav'), d.owner.avatar, 62);
  }).catch(function (e) { VISIT = true; $('vtxt').textContent = '😕 ' + e.message; $('play').style.display = 'none'; $('stage').querySelector('.gd-top').style.display = 'none'; });
} else {
  api('/api/garden').then(function (d) { setState(d); }).catch(function (e) { $('hint').textContent = e.message; });
  fetch('/api/me/avatar', { credentials: 'same-origin' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (d) { if (d && d.cfg && window.ewtAvatarInto) window.ewtAvatarInto($('gav'), d.cfg, 62); }).catch(function () {});
}
setInterval(function () { if (S && !document.hidden && !$('pop')) render(); }, 20000);
window.addEventListener('resize', function () { if (S) render(); });
})();
</script>
</body>
</html>

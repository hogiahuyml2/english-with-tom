<!DOCTYPE html>
<html lang="vi">
<head>

<style>
.lv-wrap { max-width: 920px; margin: 0 auto; padding: 0 20px; }
.lv-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); margin-bottom: 16px; }
.lv-title { font-size: 16px; font-weight: 700; margin-bottom: 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.lv-sub { font-size: 12.5px; color: var(--text-muted); font-weight: 500; }
.lv-btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 18px; border-radius: 11px; border: none; background: var(--gradient); color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; box-shadow: var(--shadow); }
.lv-btn:disabled { opacity: .5; cursor: default; }
.lv-btn.ghost { background: var(--primary-soft); color: var(--text); box-shadow: none; }
.lv-btn.line { background: transparent; border: 2px solid var(--primary); color: var(--primary); box-shadow: none; }
.lv-btn.sm { padding: 6px 12px; font-size: 12.5px; border-radius: 9px; }
.lv-pill { padding: 8px 15px; border-radius: 99px; border: 1.5px solid var(--border); background: var(--surface); color: var(--text); font-size: 13.5px; font-weight: 600; cursor: pointer; font-family: inherit; }
.lv-pill.on { background: var(--gradient); color: #fff; border-color: transparent; }
.lv-msg { margin-top: 10px; font-size: 13px; padding: 9px 12px; border-radius: 9px; }
.lv-msg.ok { background: var(--success-soft); color: var(--success); } .lv-msg.err { background: rgba(239,68,68,.12); color: #ef4444; } .lv-msg.warn { background: var(--warning-soft); color: var(--warning); }
.lv-bar { height: 9px; background: var(--border); border-radius: 99px; overflow: hidden; } .lv-bar > i { display: block; height: 100%; background: var(--gradient); border-radius: 99px; transition: width .4s; }
.lv-list-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--border); flex-wrap: wrap; } .lv-list-item:first-of-type { border-top: none; }
.lv-list-item .main { flex: 1; min-width: 200px; }
.lv-table { width: 100%; border-collapse: collapse; font-size: 13px; } .lv-table th { text-align: left; color: var(--text-muted); font-size: 11.5px; text-transform: uppercase; padding: 6px 8px; } .lv-table td { padding: 8px; border-top: 1px solid var(--border); vertical-align: top; }
.lv-scroll { overflow-x: auto; }

/* ── tạo bộ từ (giáo viên) ── */
.lv-form input, .lv-form textarea, .lv-form select { width: 100%; padding: 9px 11px; border: 1.5px solid var(--border); border-radius: 9px; font-family: inherit; font-size: 13.5px; background: var(--surface); color: var(--text); }
.lv-form input[type=checkbox], .lv-form input[type=radio] { width: auto; padding: 0; flex-shrink: 0; }
.lv-form textarea { resize: vertical; line-height: 1.5; }
.lv-form label.f { display: block; font-size: 12px; font-weight: 700; color: var(--text-muted); margin: 10px 0 4px; }
.lv-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; } @media (max-width: 620px) { .lv-grid2 { grid-template-columns: 1fr; } }
.lv-grid3 { display: grid; grid-template-columns: 1.2fr .6fr 1.2fr; gap: 10px; } @media (max-width: 620px) { .lv-grid3 { grid-template-columns: 1fr; } }
.lv-item { border: 1.5px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 12px; background: var(--bg-soft); }
.lv-item.flagged { border-color: #f59e0b; } .lv-item.checked { border-color: var(--success); }
.lv-flags { margin-top: 8px; } .lv-flag { font-size: 12.5px; color: var(--warning); padding: 3px 0; line-height: 1.5; } .lv-item.checked .lv-flag { opacity: .45; text-decoration: line-through; }
.lv-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.lv-opt { display: flex; gap: 8px; align-items: center; margin-top: 6px; } .lv-opt b { width: 18px; font-size: 13px; }
.lv-banner { padding: 12px 14px; border-radius: 12px; font-size: 13.5px; font-weight: 600; margin-bottom: 14px; }
.lv-banner.warn { background: var(--warning-soft); color: var(--warning); } .lv-banner.ok { background: var(--success-soft); color: var(--success); }
.lv-pick { max-height: 150px; overflow-y: auto; border: 1.5px solid var(--border); border-radius: 10px; padding: 6px 10px; } .lv-pick label { display: flex; gap: 8px; align-items: center; font-size: 13px; padding: 3px 0; cursor: pointer; }

/* ── học sinh: thẻ + luyện tập ── */
.lv-stage { max-width: 640px; margin: 0 auto; }
.lv-flip { perspective: 1000px; cursor: pointer; margin: 6px 0 14px; }
.lv-flip-in { position: relative; min-height: 300px; transition: transform .5s; transform-style: preserve-3d; }
.lv-flip.on .lv-flip-in { transform: rotateY(180deg); }
.lv-face { position: absolute; inset: 0; backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; border-radius: 18px; border: 1.5px solid var(--border); background: var(--surface); box-shadow: var(--shadow); text-align: center; overflow-y: auto; }
.lv-face.back { transform: rotateY(180deg); background: var(--primary-soft); }
.lv-word { font-size: 34px; font-weight: 700; word-break: break-word; } .lv-pos { font-size: 13px; color: var(--text-muted); font-style: italic; margin: 3px 0; } .lv-ipa { font-size: 20px; color: var(--primary); font-weight: 600; margin: 4px 0 8px; }
.lv-snd { background: var(--primary-soft); border: none; border-radius: 99px; width: 42px; height: 42px; font-size: 18px; cursor: pointer; color: var(--text); } .lv-snd.sm { width: 32px; height: 32px; font-size: 14px; }
.lv-def { font-size: 15px; line-height: 1.6; margin: 4px 0; } .lv-vi { font-size: 22px; font-weight: 700; margin: 6px 0; } .lv-ex { font-size: 14.5px; line-height: 1.65; margin-top: 8px; padding: 10px 12px; background: var(--surface); border-radius: 10px; text-align: left; width: 100%; }
.lv-ex mark { background: rgba(123,110,246,.25); color: inherit; border-radius: 4px; padding: 0 3px; font-weight: 700; }
.lv-nav { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.lv-q { background: var(--surface); border: 1.5px solid var(--border); border-radius: 18px; padding: 22px; box-shadow: var(--shadow); }
.lv-stem { font-size: 19px; line-height: 1.7; font-weight: 500; margin: 8px 0 14px; } .lv-blank { display: inline-block; min-width: 90px; border-bottom: 3px solid var(--primary); text-align: center; color: var(--primary); font-weight: 700; margin: 0 3px; } .lv-blank.ok { color: var(--success); border-color: var(--success); } .lv-blank.bad { color: #ef4444; border-color: #ef4444; }
.lv-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; } @media (max-width: 520px) { .lv-opts { grid-template-columns: 1fr; } }
.lv-ans { padding: 13px 12px; border: 2px solid var(--border); background: var(--surface); color: var(--text); border-radius: 12px; font-size: 15.5px; font-weight: 600; cursor: pointer; font-family: inherit; text-align: left; display: flex; gap: 10px; align-items: center; }
.lv-ans b { width: 24px; height: 24px; border-radius: 50%; background: var(--primary-soft); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0; }
.lv-ans:hover:not(:disabled) { border-color: var(--primary); background: var(--primary-soft); } .lv-ans.ok { border-color: var(--success); background: var(--success-soft); color: var(--success); } .lv-ans.bad { border-color: #ef4444; background: rgba(239,68,68,.12); color: #ef4444; } .lv-ans:disabled { cursor: default; }
.lv-fb { margin-top: 14px; padding: 12px 14px; border-radius: 12px; font-size: 14px; line-height: 1.6; } .lv-fb.ok { background: var(--success-soft); } .lv-fb.bad { background: rgba(239,68,68,.1); }
.lv-score { text-align: center; padding: 10px 0; } .lv-score .big { font-size: 54px; font-weight: 700; } .lv-rev { text-align: left; font-size: 13.5px; } .lv-rev div { padding: 8px 0; border-top: 1px solid var(--border); line-height: 1.55; }
</style>
</head>
<body data-page="lesson-vocab" data-guard="auth">
<div id="site-header"></div>

<section class="page-hero" style="padding:24px 0 20px;">
  <div class="container">
    <div class="crumb"><a href="word-hub.html">Học từ vựng</a> › Bộ từ theo bài học</div>
    <h1 style="font-size:26px;" id="lvHeroTitle">📘 Bộ từ theo bài học</h1>
    <p style="font-size:14px;" id="lvHeroSub">Học thẻ từ vựng giáo viên giao, luyện 10 câu trắc nghiệm rồi gửi kết quả cho giáo viên.</p>
  </div>
</section>

<section class="section" style="padding:20px 0 60px;">
<div class="lv-wrap" id="lvRoot"><div class="lv-card">Đang tải...</div></div>
</section>

<div id="site-footer"></div>
<script src="js/main.js?v=22"></script>
<script>
(function () {
'use strict';
var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function reEsc(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function api(method, url, body) {
  return fetch(url, { method: method, credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined })
    .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { if (!r.ok) { var e = new Error(d.error || 'Lỗi kết nối'); e.status = r.status; e.data = d; throw e; } return d; }); });
}
function toast(msg) { var t = document.createElement('div'); t.style.cssText = 'position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#2e2b45;color:#fff;padding:11px 20px;border-radius:99px;font-weight:600;font-size:14px;z-index:4000;box-shadow:0 8px 28px rgba(0,0,0,.3)'; t.textContent = msg; document.body.appendChild(t); setTimeout(function () { t.remove(); }, 2600); }
var ttsOK = 'speechSynthesis' in window;
function speak(t, rate) { if (!ttsOK || !t) return; try { speechSynthesis.cancel(); var u = new SpeechSynthesisUtterance(t); u.lang = 'en-GB'; u.rate = rate || 0.9; speechSynthesis.speak(u); } catch (e) {} }
function hl(sentence, word) {
  var out = esc(sentence);
  word.split(/[\s-]+/).filter(Boolean).forEach(function (p) {
    var stem = p.length >= 5 ? p.slice(0, p.length - 1) : p;
    out = out.replace(new RegExp('(^|[^A-Za-z])(' + reEsc(stem) + '[A-Za-z]*)', 'i'), '$1<mark>$2</mark>');
  });
  return out;
}
function fmtDl(s) { if (!s) return ''; var d = new Date(s); if (isNaN(d)) return s; var p = function (n) { return (n < 10 ? '0' : '') + n; }; return p(d.getHours()) + ':' + p(d.getMinutes()) + ' ngày ' + p(d.getDate()) + '/' + p(d.getMonth() + 1); }
var ME = { role: 'student' };
var root = $('lvRoot');
function qs(k) { var m = new RegExp('[?&]' + k + '=([^&]*)').exec(location.search); return m ? decodeURIComponent(m[1]) : ''; }

/* ═════════════ DANH SÁCH ═════════════ */
function viewList() {
  $('lvHeroTitle').textContent = '📘 Bộ từ theo bài học';
  if (ME.role === 'student') return viewStudentList();
  root.innerHTML = '<div class="lv-card"><div class="lv-title" style="margin-bottom:12px;"><button class="lv-pill on" data-t="create">➕ Tạo bộ từ mới</button><button class="lv-pill" data-t="mine">📋 Bộ từ đã giao & kết quả</button></div><div id="lvTab"></div></div>';
  Array.prototype.forEach.call(root.querySelectorAll('[data-t]'), function (b) {
    b.onclick = function () {
      Array.prototype.forEach.call(root.querySelectorAll('[data-t]'), function (x) { x.classList.toggle('on', x === b); });
      if (b.getAttribute('data-t') === 'create') viewCreate(); else viewTeacherSets();
    };
  });
  viewCreate();
}
function viewStudentList() {
  api('GET', '/api/lesson-vocab/mine').then(function (r) {
    var h = '<div class="lv-card"><div class="lv-title">📘 Bộ từ giáo viên giao cho bạn</div>';
    if (!r.sets.length) h += '<div class="lv-sub" style="padding:10px 0;">Chưa có bộ từ nào được giao. Khi giáo viên giao bài, bạn sẽ nhận thông báo 🔔.</div>';
    r.sets.forEach(function (s) {
      h += '<div class="lv-list-item"><div class="main"><b>' + esc(s.title) + '</b><div class="lv-sub">' + (s.teacher ? 'Từ ' + esc(s.teacher) + ' · ' : '') + s.words + ' từ + 10 câu luyện tập' + (s.deadline ? ' · Hạn: ' + fmtDl(s.deadline) : '') + '</div>' +
        '<div class="lv-sub">' + (s.sent ? '✅ Đã gửi ' + s.sent + ' lần · điểm cao nhất ' + s.best + '/10' : 'Chưa gửi kết quả') + '</div></div><a class="lv-btn" href="lesson-vocab.html?id=' + s.id + '" style="text-decoration:none;">' + (s.sent ? 'Ôn lại' : 'Học ngay') + '</a></div>';
    });
    root.innerHTML = h + '</div>';
  }).catch(function (e) { root.innerHTML = '<div class="lv-card"><div class="lv-msg err">' + esc(e.message) + '</div></div>'; });
}

/* ═════════════ GIÁO VIÊN: TẠO BỘ TỪ ═════════════ */
var D = { cards: [], questions: [] };
function viewCreate() {
  D = { cards: [], questions: [] };
  $('lvTab').innerHTML =
    '<div class="lv-form"><label class="f">Tên bài học / bộ từ</label><input id="cTitle" maxlength="80" placeholder="VD: Unit 5 — Feelings & Plans">' +
    '<label class="f">Danh sách từ (mỗi dòng một từ) — gồm <b>từ</b> và <b>từ loại</b></label>' +
    '<textarea id="cText" rows="8" placeholder="reluctant | adj&#10;accommodation | n&#10;run out of | phr v&#10;schedule | v&#10;&#10;Cũng nhận: reluctant (adj) · reluctant, adj · reluctant - adj · dán từ Excel (Tab)\nTối đa 30 từ mỗi lần. Từ loại: n, v, adj, adv, prep, conj, pron, det, phr v, idiom, phr"></textarea>' +
    '<div class="lv-sub" style="margin:6px 0 12px;">✨ Bấm nút dưới đây: hệ thống tự tạo <b>phiên âm IPA, nghĩa tiếng Anh đơn giản, nghĩa tiếng Việt, ví dụ thực tế</b> cho từng từ, rồi gợi ý <b>10 câu trắc nghiệm A–D</b>. Mọi nội dung đều được kiểm tra chéo và hiện sẵn để bạn xem lại, sửa trước khi giao.</div>' +
    '<button class="lv-btn" id="cGo">✨ Tạo tự động</button><div id="cMsg"></div></div><div id="cReview" class="lv-form" style="margin-top:16px;"></div>';
  $('cGo').onclick = genAll;
}
function setMsg(kind, html) { $('cMsg').innerHTML = html ? '<div class="lv-msg ' + kind + '">' + html + '</div>' : ''; }
function genAll() {
  var text = $('cText').value;
  if (!text.trim()) { setMsg('err', 'Hãy nhập danh sách từ.'); return; }
  var btn = $('cGo'); btn.disabled = true; $('cReview').innerHTML = '';
  setMsg('warn', '⏳ Bước 1/2: đang tạo thẻ từ (phiên âm, nghĩa, ví dụ)... có thể mất 20–60 giây.');
  api('POST', '/api/lesson-vocab/ai-cards', { text: text }).then(function (r) {
    D.cards = r.cards.map(function (c) { c._ok = false; return c; });
    var pe = r.parseErrors && r.parseErrors.length ? '<br>⚠️ Bỏ qua ' + r.parseErrors.length + ' dòng: ' + r.parseErrors.map(esc).join(' · ') : '';
    if (D.cards.length < 4) { setMsg('err', 'Cần ít nhất 4 từ hợp lệ để tạo câu hỏi 4 đáp án.' + pe); btn.disabled = false; return; }
    setMsg('warn', '⏳ Bước 2/2: đang tạo 10 câu trắc nghiệm và chấm chéo bằng AI độc lập...' + pe);
    return genQuestions().then(function () { setMsg('ok', '✅ Đã tạo xong. Hãy xem lại bên dưới (nội dung có ⚠️ cần bạn kiểm tra kỹ).' + pe); renderReview(); });
  }).catch(function (e) { setMsg('err', esc(e.message) + ' — bạn có thể bấm tạo lại.'); }).then(function () { btn.disabled = false; });
}
function cleanCardsForAI() { return D.cards.map(function (c) { return { word: c.word, pos: c.pos, simple: c.simple, vi: c.vi, example: c.example }; }); }
function genQuestions() {
  return api('POST', '/api/lesson-vocab/ai-questions', { cards: cleanCardsForAI() }).then(function (r) {
    D.questions = r.questions.map(function (q) { q._ok = false; return q; });
    D.missing = r.missing || 0;
  });
}

/* ── màn duyệt nội dung ── */
function unresolved() {
  var n = 0; D.cards.forEach(function (c) { if (c.flags && c.flags.length && !c._ok) n++; });
  D.questions.forEach(function (q) { if (q.flags && q.flags.length && !q._ok) n++; });
  return n;
}
function flagHtml(it) { return (it.flags || []).map(function (f) { return '<div class="lv-flag">⚠️ ' + esc(f.msg) + '</div>'; }).join(''); }
function renderReview() {
  var h = '<div id="rvBanner"></div>';
  h += '<div class="lv-card"><div class="lv-title">📇 Thẻ từ vựng (' + D.cards.length + ') <span class="lv-sub">sửa trực tiếp vào ô nếu cần</span></div>';
  D.cards.forEach(function (c, i) {
    h += '<div class="lv-item" id="ci' + i + '"><div class="lv-grid3"><div><label class="f">Từ</label><input data-c="' + i + '" data-k="word" value="' + esc(c.word) + '"></div><div><label class="f">Loại</label><input data-c="' + i + '" data-k="pos" value="' + esc(c.pos) + '"></div><div><label class="f">Phiên âm IPA' + (c.ipaRef ? ' <span class="lv-sub">(từ điển: ' + esc(c.ipaRef) + ')</span>' : '') + '</label><input data-c="' + i + '" data-k="ipa" value="' + esc(c.ipa) + '"></div></div>' +
      '<div class="lv-grid2"><div><label class="f">Nghĩa tiếng Anh đơn giản</label><textarea rows="2" data-c="' + i + '" data-k="simple">' + esc(c.simple) + '</textarea></div><div><label class="f">Nghĩa tiếng Việt</label><textarea rows="2" data-c="' + i + '" data-k="vi">' + esc(c.vi) + '</textarea></div></div>' +
      '<label class="f">Ví dụ trong ngữ cảnh thực tế</label><textarea rows="2" data-c="' + i + '" data-k="example">' + esc(c.example) + '</textarea>' +
      '<div class="lv-flags" id="cf' + i + '">' + flagHtml(c) + '</div><div class="lv-actions"><button class="lv-btn sm ghost" data-regc="' + i + '">🔄 Tạo lại thẻ này</button>' + (c.flags && c.flags.length ? '<button class="lv-btn sm line" data-okc="' + i + '">✓ Tôi đã kiểm tra mục này</button>' : '') + '<button class="lv-btn sm ghost" data-delc="' + i + '">🗑 Xoá từ</button></div></div>';
  });
  h += '<div class="lv-form"><label class="f">Thêm từ mới vào bộ (mỗi dòng: từ | loại)</label><textarea id="addText" rows="2"></textarea><div class="lv-actions"><button class="lv-btn sm ghost" id="addGo">➕ Tạo thẻ cho từ mới</button></div><div id="addMsg"></div></div></div>';
  h += '<div class="lv-card"><div class="lv-title">📝 10 câu trắc nghiệm A–D <span class="lv-sub">chọn ⚪ trước đáp án đúng</span> <button class="lv-btn sm ghost" id="regAll" style="margin-left:auto;">🔄 Tạo lại 10 câu</button></div>';
  if (D.questions.length !== 10) h += '<div class="lv-banner warn">Hiện có ' + D.questions.length + '/10 câu — hãy bấm "Tạo lại 10 câu" hoặc tạo lại từng câu.</div>';
  D.questions.forEach(function (q, i) {
    h += '<div class="lv-item" id="qi' + i + '"><div class="lv-sub">Câu ' + (i + 1) + ' · từ mục tiêu: <b>' + esc(q.target) + '</b></div><textarea rows="2" data-q="' + i + '" data-k="stem">' + esc(q.stem) + '</textarea>';
    for (var k = 0; k < 4; k++) h += '<div class="lv-opt"><input type="radio" name="qa' + i + '" data-qa="' + i + '" value="' + k + '"' + (q.answer_index === k ? ' checked' : '') + '><b>' + 'ABCD'.charAt(k) + '</b><input data-q="' + i + '" data-o="' + k + '" value="' + esc(q.options[k]) + '"></div>';
    h += '<div class="lv-flags" id="qf' + i + '">' + flagHtml(q) + '</div><div class="lv-actions"><button class="lv-btn sm ghost" data-regq="' + i + '">🔄 Tạo lại câu này</button>' + (q.flags && q.flags.length ? '<button class="lv-btn sm line" data-okq="' + i + '">✓ Tôi đã kiểm tra câu này</button>' : '') + '</div></div>';
  });
  h += '</div>';

function markItem(kind, i) {

  $('lvPractice').innerHTML = '<div class="lv-q"><div class="lv-score"><div style="font-size:40px;">' + (score >= 9 ? '🏆' : score >= 7 ? '🎉' : score >= 5 ? '👍' : '💪') + '</div><div class="big">' + score + '/' + S.questions.length + '</div><div class="lv-sub">' + (score >= 9 ? 'Xuất sắc!' : score >= 7 ? 'Làm tốt lắm!' : score >= 5 ? 'Khá ổn, ôn thêm các câu sai nhé!' : 'Hãy xem lại thẻ từ rồi luyện lại nhé!') + '</div></div>' +
    '<div class="lv-actions" style="justify-content:center;margin:10px 0;"><button class="lv-btn" id="lvSend">📨 Gửi kết quả cho giáo viên</button><button class="lv-btn line" id="lvAgain">↺ Luyện lại</button></div><div id="lvSendMsg"></div>' +
    '<div class="lv-rev"><b>Xem lại từng câu:</b>' + S.questions.map(function (q, i) { var ok = P.ans[i] === q.answer_index; return '<div>' + (ok ? '✅' : '❌') + ' <b>' + (i + 1) + '.</b> ' + esc(q.stem.replace('_____', '[' + q.options[q.answer_index] + ']')) + (ok ? '' : '<br><span class="lv-sub">Bạn chọn: ' + (P.ans[i] == null ? '(bỏ trống)' : esc(q.options[P.ans[i]])) + '</span>') + '</div>'; }).join('') + '</div></div>';
  $('lvAgain').onclick = startPractice;
  $('lvSend').onclick = function () {
    if (S.owner && !confirm('Bạn đang xem như giáo viên. Vẫn gửi kết quả thử?')) return;
    var b = $('lvSend'); b.disabled = true;
    api('POST', '/api/lesson-vocab/' + S.id + '/submit', { answers: S.questions.map(function (q, i) { return P.ans[i] == null ? null : P.ans[i]; }) }).then(function (r) {
      $('lvSendMsg').innerHTML = '<div class="lv-msg ok">✅ Đã gửi kết quả <b>' + r.score + '/' + r.total + '</b> cho giáo viên (lần gửi thứ ' + r.attempt + '). Bạn vẫn có thể luyện lại và gửi lần nữa.</div>'; b.textContent = '✓ Đã gửi'; b.disabled = true; setTimeout(function () { b.textContent = '📨 Gửi lại kết quả mới'; b.disabled = false; }, 400);
    }).catch(function (e) { $('lvSendMsg').innerHTML = '<div class="lv-msg err">' + esc(e.message) + '</div>'; b.disabled = false; });
  };
}

/* ═════════════ KHỞI ĐỘNG ═════════════ */
api('GET', '/api/me').then(function (r) { ME = r.user || ME; }).catch(function () {}).then(function () {
  var id = parseInt(qs('id'), 10);
  if (id && qs('tab') === 'results') return viewResults(id);
  if (id) return viewStudy(id);
  viewList();
});
window.__lv = { get D() { return D; }, get S() { return S; } };
})();
</script>

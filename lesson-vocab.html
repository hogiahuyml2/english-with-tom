<style>
.lv-wrap { max-width: 920px; margin: 0 auto; padding: 0 20px; }

.lv-btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 18px; border-radius: 11px; border: none; background: var(--gradient); color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; box-shadow: var(--shadow); }
.lv-btn:disabled { opacity: .5; cursor: default; }
.lv-btn.ghost { background: var(--primary-soft); color: var(--text); box-shadow: none; }
.lv-btn.line { background: transparent; border: 2px solid var(--primary); color: var(--primary); box-shadow: none; }
.lv-btn.sm { padding: 6px 12px; font-size: 12.5px; border-radius: 9px; }

.lv-pill.on { background: var(--gradient); color: #fff; border-color: transparent; }
.lv-msg { margin-top: 10px; font-size: 13px; padding: 9px 12px; border-radius: 9px; }
.lv-msg.ok { background: var(--success-soft); color: var(--success); } .lv-msg.err { background: rgba(239,68,68,.12); color: #ef4444; } .lv-msg.warn { background: var(--warning-soft); color: var(--warning); }
.lv-bar { height: 9px; background: var(--border); border-radius: 99px; overflow: hidden; } .lv-bar > i { display: block; height: 100%; background: var(--gradient); border-radius: 99px; transition: width .4s; }
.lv-list-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--border); flex-wrap: wrap; } .lv-list-item:first-of-type { border-top: none; }
.lv-list-item .main { flex: 1; min-width: 200px; }
.lv-table { width: 100%; border-collapse: collapse; font-size: 13px; } .lv-table th { text-align: left; color: var(--text-muted); font-size: 11.5px; text-transform: uppercase; padding: 6px 8px; } .lv-table td { padding: 8px; border-top: 1px solid var(--border); vertical-align: top; }
.lv-scroll { overflow-x: auto; }

/* ── nhập bằng ảnh/file + chọn học sinh + báo cáo ── */
.lv-drop { border: 2px dashed var(--border); border-radius: 14px; padding: 18px 14px; text-align: center; cursor: pointer; background: var(--bg-soft); transition: border-color .2s, background .2s; }
.lv-drop:hover, .lv-drop.over { border-color: var(--primary); background: var(--primary-soft); }
.lv-or { text-align: center; font-size: 12.5px; color: var(--text-muted); margin: 10px 0 2px; }
.lv-stu { max-height: 230px; overflow-y: auto; border: 1.5px solid var(--border); border-radius: 10px; padding: 4px 10px; background: var(--surface); }
.lv-stu label { display: flex; gap: 8px; align-items: center; padding: 5px 0; font-size: 13.5px; border-top: 1px solid var(--border); } .lv-stu label:first-child { border-top: none; }
.lv-stu input[type=checkbox] { width: auto; flex-shrink: 0; }
.lv-kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 14px; } .lv-kpi > div { background: var(--bg-soft); border-radius: 12px; padding: 10px 12px; } .lv-kpi b { display: block; font-size: 22px; } .lv-kpi span { font-size: 12px; color: var(--text-muted); }
/* ── tạo bộ từ (giáo viên) ── */
.lv-form input, .lv-form textarea, .lv-form select { width: 100%; padding: 9px 11px; border: 1.5px solid var(--border); border-radius: 9px; font-family: inherit; font-size: 13.5px; background: var(--surface); color: var(--text); }
.lv-form input[type=checkbox], .lv-form input[type=radio] { width: auto; padding: 0; flex-shrink: 0; }
.lv-form textarea { resize: vertical; line-height: 1.5; }
.lv-form label.f { display: block; font-size: 12px; font-weight: 700; color: var(--text-muted); margin: 10px 0 4px; }
.lv-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; } @media (max-width: 620px) { .lv-grid2 { grid-template-columns: 1fr; } }
.lv-grid3 { display: grid; grid-template-columns: 1.2fr .6fr 1.2fr; gap: 10px; } @media (max-width: 620px) { .lv-grid3 { grid-template-columns: 1fr; } }
.lv-item { border: 1.5px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 12px; background: var(--bg-soft); }
.lv-item.flagged { border-color: #f59e0b; } .lv-item.checked { border-color: var(--success); }
.lv-flags { margin-top: 8px; } .lv-flag { font-size: 12.5px; color: var(--warning); padding: 3px 0; line-height: 1.5; } .lv-item.checked .lv-flag { opacity: .45; text-decoration: line-through; }
.lv-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.lv-opt { display: flex; gap: 8px; align-items: center; margin-top: 6px; } .lv-opt b { width: 18px; font-size: 13px; }
.lv-banner { padding: 12px 14px; border-radius: 12px; font-size: 13.5px; font-weight: 600; margin-bottom: 14px; }

.lv-pick { max-height: 150px; overflow-y: auto; border: 1.5px solid var(--border); border-radius: 10px; padding: 6px 10px; } .lv-pick label { display: flex; gap: 8px; align-items: center; font-size: 13px; padding: 3px 0; cursor: pointer; }

/* ── học sinh: thẻ + luyện tập ── */
.lv-stage { max-width: 640px; margin: 0 auto; }
.lv-flip { perspective: 1000px; cursor: pointer; margin: 6px 0 14px; }
.lv-flip-in { position: relative; min-height: 300px; transition: transform .5s; transform-style: preserve-3d; }
.lv-flip.on .lv-flip-in { transform: rotateY(180deg); }
.lv-face { position: absolute; inset: 0; backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; border-radius: 18px; border: 1.5px solid var(--border); background: var(--surface); box-shadow: var(--shadow); text-align: center; overflow-y: auto; }
.lv-face.back { transform: rotateY(180deg); background: var(--primary-soft); }
.lv-word { font-size: 34px; font-weight: 700; word-break: break-word; } .lv-pos { font-size: 13px; color: var(--text-muted); font-style: italic; margin: 3px 0; } .lv-ipa { font-size: 20px; color: var(--primary); font-weight: 600; margin: 4px 0 8px; }
.lv-snd { background: var(--primary-soft); border: none; border-radius: 99px; width: 42px; height: 42px; font-size: 18px; cursor: pointer; color: var(--text); } .lv-snd.sm { width: 32px; height: 32px; font-size: 14px; }
.lv-def { font-size: 15px; line-height: 1.6; margin: 4px 0; } .lv-vi { font-size: 22px; font-weight: 700; margin: 6px 0; } .lv-ex { font-size: 14.5px; line-height: 1.65; margin-top: 8px; padding: 10px 12px; background: var(--surface); border-radius: 10px; text-align: left; width: 100%; }
.lv-ex mark { background: rgba(123,110,246,.25); color: inherit; border-radius: 4px; padding: 0 3px; font-weight: 700; }
.lv-nav { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.lv-q { background: var(--surface); border: 1.5px solid var(--border); border-radius: 18px; padding: 22px; box-shadow: var(--shadow); }
.lv-stem { font-size: 19px; line-height: 1.7; font-weight: 500; margin: 8px 0 14px; } .lv-blank { display: inline-block; min-width: 90px; border-bottom: 3px solid var(--primary); text-align: center; color: var(--primary); font-weight: 700; margin: 0 3px; } .lv-blank.ok { color: var(--success); border-color: var(--success); } .lv-blank.bad { color: #ef4444; border-color: #ef4444; }
.lv-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; } @media (max-width: 520px) { .lv-opts { grid-template-columns: 1fr; } }
.lv-ans { padding: 13px 12px; border: 2px solid var(--border); background: var(--surface); color: var(--text); border-radius: 12px; font-size: 15.5px; font-weight: 600; cursor: pointer; font-family: inherit; text-align: left; display: flex; gap: 10px; align-items: center; }
.lv-ans b { width: 24px; height: 24px; border-radius: 50%; background: var(--primary-soft); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0; }
.lv-ans:hover:not(:disabled) { border-color: var(--primary); background: var(--primary-soft); } .lv-ans.ok { border-color: var(--success); background: var(--success-soft); color: var(--success); } .lv-ans.bad { border-color: #ef4444; background: rgba(239,68,68,.12); color: #ef4444; } .lv-ans:disabled { cursor: default; }
.lv-fb { margin-top: 14px; padding: 12px 14px; border-radius: 12px; font-size: 14px; line-height: 1.6; } .lv-fb.ok { background: var(--success-soft); } .lv-fb.bad { background: rgba(239,68,68,.1); }
.lv-score { text-align: center; padding: 10px 0; } .lv-score .big { font-size: 54px; font-weight: 700; } .lv-rev { text-align: left; font-size: 13.5px; } .lv-rev div { padding: 8px 0; border-top: 1px solid var(--border); line-height: 1.55; }
</style>

<script>
(function () {
'use strict';
var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function reEsc(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function api(method, url, body) {
  return fetch(url, { method: method, credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined })
    .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { if (!r.ok) { var e = new Error(d.error || 'Lỗi kết nối'); e.status = r.status; e.data = d; throw e; } return d; }); });
}
function toast(msg) { var t = document.createElement('div'); t.style.cssText = 'position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#2e2b45;color:#fff;padding:11px 20px;border-radius:99px;font-weight:600;font-size:14px;z-index:4000;box-shadow:0 8px 28px rgba(0,0,0,.3)'; t.textContent = msg; document.body.appendChild(t); setTimeout(function () { t.remove(); }, 2600); }
var ttsOK = 'speechSynthesis' in window;
function speak(t, rate) { if (!ttsOK || !t) return; try { speechSynthesis.cancel(); var u = new SpeechSynthesisUtterance(t); u.lang = 'en-GB'; u.rate = rate || 0.9; speechSynthesis.speak(u); } catch (e) {} }
function hl(sentence, word) {
  var out = esc(sentence);
  word.split(/[\s-]+/).filter(Boolean).forEach(function (p) {
    var stem = p.length >= 5 ? p.slice(0, p.length - 1) : p;
    out = out.replace(new RegExp('(^|[^A-Za-z])(' + reEsc(stem) + '[A-Za-z]*)', 'i'), '$1<mark>$2</mark>');
  });
  return out;
}
function fmtDl(s) { if (!s) return ''; var d = new Date(s); if (isNaN(d)) return s; var p = function (n) { return (n < 10 ? '0' : '') + n; }; return p(d.getHours()) + ':' + p(d.getMinutes()) + ' ngày ' + p(d.getDate()) + '/' + p(d.getMonth() + 1); }
var ME = { role: 'student' };
var root = $('lvRoot');
function qs(k) { var m = new RegExp('[?&]' + k + '=([^&]*)').exec(location.search); return m ? decodeURIComponent(m[1]) : ''; }

/* ═════════════ DANH SÁCH ═════════════ */
function viewList() {
  $('lvHeroTitle').textContent = '📘 Bộ từ theo bài học';
  if (ME.role === 'student') { $('lvHeroTitle').textContent = '📘 Bộ từ được giao'; return viewStudentList(); }
  root.innerHTML = '<div class="lv-card"><div class="lv-title" style="margin-bottom:12px;"><button class="lv-pill on" data-t="create">➕ Tạo bộ từ mới</button><button class="lv-pill" data-t="mine">📋 Bộ từ đã giao & kết quả</button><button class="lv-pill" data-t="report">📈 Báo cáo học sinh</button></div><div id="lvTab"></div></div>';
  Array.prototype.forEach.call(root.querySelectorAll('[data-t]'), function (b) {
    b.onclick = function () {
      Array.prototype.forEach.call(root.querySelectorAll('[data-t]'), function (x) { x.classList.toggle('on', x === b); });
      var t = b.getAttribute('data-t'); if (t === 'create') viewCreate(); else if (t === 'report') viewReport(); else viewTeacherSets();
    };
  });
  viewCreate();
}
function viewStudentList() {
  api('GET', '/api/lesson-vocab/mine').then(function (r) {
    var h = '<div class="lv-card"><div class="lv-title">📘 Bộ từ được giao cho bạn</div>';
    if (!r.sets.length) h += '<div class="lv-sub" style="padding:10px 0;">Chưa có bộ từ nào được giao. Khi giáo viên giao bài, bạn sẽ nhận thông báo 🔔.</div>';
    r.sets.forEach(function (s) {
      h += '<div class="lv-list-item"><div class="main"><b>' + esc(s.title) + '</b><div class="lv-sub">' + (s.teacher ? 'Từ ' + esc(s.teacher) + ' · ' : '') + s.words + ' từ + 10 câu luyện tập' + (s.deadline ? ' · Hạn: ' + fmtDl(s.deadline) : '') + '</div>' +
        '<div class="lv-sub">' + (s.sent ? '✅ Đã gửi ' + s.sent + ' lần · điểm cao nhất ' + s.best + '/10' : 'Chưa gửi kết quả') + '</div></div><a class="lv-btn" href="lesson-vocab.html?id=' + s.id + '" style="text-decoration:none;">' + (s.sent ? 'Ôn lại' : 'Học ngay') + '</a></div>';
    });
    root.innerHTML = h + '</div>';
  }).catch(function (e) { root.innerHTML = '<div class="lv-card"><div class="lv-msg err">' + esc(e.message) + '</div></div>'; });
}

/* ═════════════ GIÁO VIÊN: TẠO BỘ TỪ ═════════════ */
var D = { cards: [], questions: [] };
function viewCreate() {
  D = { cards: [], questions: [] };
  $('lvTab').innerHTML =
    '<div class="lv-form"><label class="f">Tên bài học / bộ từ</label><input id="cTitle" maxlength="80" placeholder="VD: Unit 5 — Feelings & Plans">' +
    '<label class="f">📷 Nhập nhanh bằng ảnh hoặc file</label>' +
    '<div class="lv-drop" id="cDrop"><div style="font-size:30px;">📷 📄</div><b>Thả ảnh / file vào đây, hoặc bấm để chọn</b><div class="lv-sub" style="margin-top:4px;">Ảnh chụp danh sách từ (JPG, PNG), PDF, Word (.docx), Excel (.xlsx), CSV, TXT. Trên điện thoại: bấm để chụp ảnh trực tiếp.</div><input type="file" id="cFile" accept="image/*,.pdf,.docx,.xlsx,.csv,.tsv,.txt" hidden></div>' +
    '<label style="display:flex;gap:8px;align-items:center;margin:8px 0 0;font-size:13px;"><input type="checkbox" id="cAuto" checked style="width:auto;"> Tự tạo thẻ + 10 câu hỏi ngay sau khi đọc xong</label><div id="cImpMsg"></div>' +
    '<div class="lv-or">— hoặc gõ / dán trực tiếp —</div>' +
    '<label class="f">Danh sách từ (mỗi dòng một từ) — gồm <b>từ</b> và <b>từ loại</b></label>' +
    '<textarea id="cText" rows="8" placeholder="reluctant | adj&#10;accommodation | n&#10;run out of | phr v&#10;schedule | v&#10;&#10;Cũng nhận: reluctant (adj) · reluctant, adj · reluctant - adj · dán từ Excel (Tab)\nTối đa 30 từ mỗi lần. Từ loại: n, v, adj, adv, prep, conj, pron, det, phr v, idiom, phr"></textarea>' +
    '<div class="lv-sub" style="margin:6px 0 12px;">✨ Bấm nút dưới đây: hệ thống tự tạo <b>phiên âm IPA, nghĩa tiếng Anh đơn giản, nghĩa tiếng Việt, ví dụ thực tế</b> cho từng từ, rồi gợi ý <b>10 câu trắc nghiệm A–D</b>. Mọi nội dung đều được kiểm tra chéo và hiện sẵn để bạn xem lại, sửa trước khi giao.</div>' +
    '<button class="lv-btn" id="cGo">✨ Tạo tự động</button><div id="cMsg"></div></div><div id="cReview" class="lv-form" style="margin-top:16px;"></div>';
  $('cGo').onclick = genAll;
  bindImport();
}
/* ── Nhập bằng ảnh / file: đọc tự động → điền vào ô danh sách → (tuỳ chọn) tạo thẻ ngay ── */
var restWords = [];
function bindImport() {
  var drop = $('cDrop'), inp = $('cFile');
  drop.onclick = function () { inp.click(); };
  inp.onchange = function () { if (inp.files && inp.files[0]) importFile(inp.files[0]); inp.value = ''; };
  ['dragenter', 'dragover'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); }); });
  ['dragleave', 'drop'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); }); });
  drop.addEventListener('drop', function (e) { var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]; if (f) importFile(f); });
}
function prepImage(file) {
  return new Promise(function (resolve) {
    if (!/^image\//.test(file.type) || file.size < 1200 * 1024) return resolve({ blob: file, name: file.name });
    var img = new Image(), url = URL.createObjectURL(file);
    img.onload = function () {
      var sc = Math.min(1, 1800 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(function (b) { resolve(b ? { blob: b, name: 'photo.jpg' } : { blob: file, name: file.name }); }, 'image/jpeg', 0.85);
    };
    img.onerror = function () { URL.revokeObjectURL(url); resolve({ blob: file, name: file.name }); };
    img.src = url;
  });
}
function impMsg(kind, html) { $('cImpMsg').innerHTML = html ? '<div class="lv-msg ' + kind + '">' + html + '</div>' : ''; }
function importFile(file) {
  if (file.size > 25 * 1024 * 1024) { impMsg('err', 'File quá lớn (tối đa 8MB sau khi nén). Hãy chụp/cắt ảnh nhỏ hơn.'); return; }
  impMsg('warn', '⏳ Đang đọc "' + esc(file.name) + '"... ảnh/PDF có thể mất 10–30 giây.');
  $('cReview').innerHTML = ''; $('cMsg').innerHTML = '';
  prepImage(file).then(function (p) {
    var fd = new FormData(); fd.append('file', p.blob, p.name);
    return fetch('/api/lesson-vocab/extract', { method: 'POST', credentials: 'same-origin', body: fd });
  }).then(function (r) {
    return r.json().catch(function () { return {}; }).then(function (d) { if (!r.ok) throw new Error(d.error || 'Không đọc được file.'); return d; });
  }).then(onExtracted).catch(function (e) { impMsg('err', esc(e.message)); });
}
function onExtracted(d) {
  $('cText').value = d.words.map(function (w) { return w.word + ' | ' + w.pos; }).join('\n');
  restWords = d.rest || [];
  var guessed = d.words.filter(function (w) { return w.guessed; }).map(function (w) { return w.word + ' (' + w.pos + ')'; });
  var unsure = d.words.filter(function (w) { return w.uncertain; }).map(function (w) { return w.word; });
  var h = '✅ Đã đọc được <b>' + (d.words.length + restWords.length) + '</b> từ' + (d.via === 'ai' ? ' bằng AI' : ' từ file') + ' — đã điền vào ô danh sách bên dưới.';
  if (guessed.length) h += '<br>⚠️ <b>Từ loại do AI đoán</b> (ảnh/file không ghi) — hãy kiểm tra: ' + guessed.map(esc).join(', ');
  if (unsure.length) h += '<br>⚠️ <b>Chữ khó đọc</b>, có thể sai chính tả: ' + unsure.map(esc).join(', ');
  if (d.needPos && d.needPos.length) h += '<br>⚠️ Chưa xác định được từ loại, đã bỏ qua (hãy tự thêm vào danh sách): ' + d.needPos.map(esc).join(', ');

function cleanCardsForAI() { return D.cards.map(function (c) { return { word: c.word, pos: c.pos, simple: c.simple, vi: c.vi, example: c.example }; }); }

  D.questions.forEach(function (q, i) {
    h += '<div class="lv-item" id="qi' + i + '"><div class="lv-sub">Câu ' + (i + 1) + ' · từ mục tiêu: <b>' + esc(q.target) + '</b></div><textarea rows="2" data-q="' + i + '" data-k="stem">' + esc(q.stem) + '</textarea>';
    for (var k = 0; k < 4; k++) h += '<div class="lv-opt"><input type="radio" name="qa' + i + '" data-qa="' + i + '" value="' + k + '"' + (q.answer_index === k ? ' checked' : '') + '><b>' + 'ABCD'.charAt(k) + '</b><input data-q="' + i + '" data-o="' + k + '" value="' + esc(q.options[k]) + '"></div>';

    '<label style="display:flex;gap:8px;align-items:center;margin:8px 0;font-size:13px;"><input type="checkbox" id="gAll"> Giao cho TẤT CẢ học sinh trên website</label>' +

function refreshGate() {
  var u = unresolved(), b = $('rvBanner'); if (!b) return;

function markItem(kind, i) {
  var it = kind === 'c' ? D.cards[i] : D.questions[i]; it._ok = true;
  var box = $((kind === 'c' ? 'ci' : 'qi') + i); if (box) { box.classList.remove('flagged'); box.classList.add('checked'); }
  var okb = box && box.querySelector('[data-ok' + kind + ']'); if (okb) okb.style.display = 'none';
  refreshGate();
}
function bindReview() {
  D.cards.forEach(function (c, i) { var b = $('ci' + i); if (c.flags && c.flags.length) b.classList.add('flagged'); });
  D.questions.forEach(function (q, i) { var b = $('qi' + i); if (q.flags && q.flags.length) b.classList.add('flagged'); });
  Array.prototype.forEach.call(document.querySelectorAll('[data-c]'), function (el) {
    el.oninput = function () { var i = +el.getAttribute('data-c'); D.cards[i][el.getAttribute('data-k')] = el.value; if (D.cards[i].flags && D.cards[i].flags.length) markItem('c', i); };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-q][data-k]'), function (el) {
    el.oninput = function () { var i = +el.getAttribute('data-q'); D.questions[i][el.getAttribute('data-k')] = el.value; if (D.questions[i].flags && D.questions[i].flags.length) markItem('q', i); };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-q][data-o]'), function (el) {
    el.oninput = function () { var i = +el.getAttribute('data-q'); D.questions[i].options[+el.getAttribute('data-o')] = el.value; if (D.questions[i].flags && D.questions[i].flags.length) markItem('q', i); };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-qa]'), function (el) {
    el.onchange = function () { var i = +el.getAttribute('data-qa'); D.questions[i].answer_index = +el.value; if (D.questions[i].flags && D.questions[i].flags.length) markItem('q', i); };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-okc]'), function (b) { b.onclick = function () { markItem('c', +b.getAttribute('data-okc')); }; });
  Array.prototype.forEach.call(document.querySelectorAll('[data-okq]'), function (b) { b.onclick = function () { markItem('q', +b.getAttribute('data-okq')); }; });
  Array.prototype.forEach.call(document.querySelectorAll('[data-delc]'), function (b) {
    b.onclick = function () {
      var i = +b.getAttribute('data-delc'); if (D.cards.length <= 4) { toast('Bộ từ cần ít nhất 4 từ.'); return; }
      var w = D.cards[i].word; D.cards.splice(i, 1);
      D.questions.forEach(function (q) { if (String(q.target).toLowerCase() === w.toLowerCase()) { q.flags = (q.flags || []).concat([{ msg: 'Từ mục tiêu "' + w + '" đã bị xoá khỏi bộ — hãy tạo lại câu này.' }]); q._ok = false; } });
      renderReview();
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-regc]'), function (b) {
    b.onclick = function () {
      var i = +b.getAttribute('data-regc'), c = D.cards[i]; b.disabled = true; b.textContent = '⏳ Đang tạo...';
      api('POST', '/api/lesson-vocab/ai-cards', { words: [{ word: c.word, pos: c.pos }] }).then(function (r) { r.cards[0]._ok = false; D.cards[i] = r.cards[0]; renderReview(); }).catch(function (e) { toast(e.message); b.disabled = false; b.textContent = '🔄 Tạo lại thẻ này'; });
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-regq]'), function (b) {
    b.onclick = function () {
      var i = +b.getAttribute('data-regq'), q = D.questions[i]; b.disabled = true; b.textContent = '⏳ Đang tạo...';
      api('POST', '/api/lesson-vocab/ai-questions', { cards: cleanCardsForAI(), only: [q.target] }).then(function (r) {
        if (!r.questions.length) { toast('AI chưa tạo được câu mới, hãy thử lại.'); b.disabled = false; b.textContent = '🔄 Tạo lại câu này'; return; }
        r.questions[0]._ok = false; D.questions[i] = r.questions[0]; renderReview();
      }).catch(function (e) { toast(e.message); b.disabled = false; b.textContent = '🔄 Tạo lại câu này'; });
    };
  });
  $('regAll').onclick = function () { var b = $('regAll'); b.disabled = true; b.textContent = '⏳ Đang tạo...'; genQuestions().then(renderReview).catch(function (e) { toast(e.message); b.disabled = false; b.textContent = '🔄 Tạo lại 10 câu'; }); };
  $('addGo').onclick = function () {
    var b = $('addGo'); b.disabled = true; $('addMsg').innerHTML = '<div class="lv-msg warn">⏳ Đang tạo...</div>';
    api('POST', '/api/lesson-vocab/ai-cards', { text: $('addText').value }).then(function (r) {
      var have = {}; D.cards.forEach(function (c) { have[c.word.toLowerCase()] = 1; });
      r.cards.forEach(function (c) { if (!have[c.word.toLowerCase()] && D.cards.length < 40) { c._ok = false; D.cards.push(c); } });
      renderReview(); toast('Đã thêm thẻ. Hãy bấm "Tạo lại 10 câu" nếu muốn câu hỏi bao gồm từ mới.');
    }).catch(function (e) { $('addMsg').innerHTML = '<div class="lv-msg err">' + esc(e.message) + '</div>'; b.disabled = false; });
  };

/* ── Chọn học sinh cụ thể (có tìm kiếm) ── */
var STU = null, PICK = {};
function stuPickerHtml(id) {
  return '<div><input type="search" id="' + id + 'Q" placeholder="🔍 Tìm học sinh theo tên hoặc email" style="margin-bottom:6px;"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px;"><button type="button" class="lv-btn sm ghost" id="' + id + 'All">☑ Chọn tất cả đang hiện</button><button type="button" class="lv-btn sm ghost" id="' + id + 'Clr">✕ Bỏ chọn</button><span class="lv-sub" id="' + id + 'N"></span></div><div class="lv-stu" id="' + id + '">Đang tải học sinh...</div></div>';

function bindStuPicker(id) {
  PICK[id] = {};

    var q = ($(id + 'Q').value || '').toLowerCase().trim();
    var list = (STU || []).filter(function (u) { return !q || (u.name + ' ' + u.email).toLowerCase().indexOf(q) >= 0; });

  };

  $('lvHeroSub').textContent = 'Theo dõi học sinh đã học, điểm luyện tập và những câu cả lớp hay sai.';
  api('GET', '/api/lesson-vocab/' + id + '/results').then(function (r) {
    var h = '<div class="lv-card"><div class="lv-title">📊 ' + esc(r.title) + '</div><div class="lv-scroll"><table class="lv-table"><thead><tr><th>Học sinh</th><th>Thời gian học</th><th>Số lần gửi</th><th>Cao nhất</th><th>Lần gửi gần nhất</th><th>Câu sai (lần gần nhất)</th></tr></thead><tbody>' +
      r.students.map(function (s) { return '<tr><td><b>' + esc(s.name) + '</b><div class="lv-sub">' + esc(s.email) + '</div></td><td>' + (s.opens || s.seconds ? '<b>' + fmtDur(s.seconds) + '</b><div class="lv-sub">' + s.studyDays + ' ngày · mở ' + s.opens + ' lần' + (s.lastStudy ? '<br>gần nhất ' + fmtDl(s.lastStudy) : '') + '</div>' : '<span class="lv-sub">chưa mở bài</span>') + '</td><td>' + (s.attempts || '<span class="lv-sub">chưa gửi</span>') + '</td><td>' + (s.best != null ? s.best + '/' + r.total : '—') + '</td><td>' + (s.last ? s.last.score + '/' + s.last.total + '<div class="lv-sub">' + fmtDl(s.last.at) + '</div>' : '—') + '</td><td>' + (s.missed.length ? s.missed.join(', ') : (s.last ? '✓ không sai câu nào' : '—')) + '</td></tr>'; }).join('') + '</tbody></table></div></div>';
    if (r.hardest.length) h += '<div class="lv-card"><div class="lv-title">🎯 Câu học sinh làm sai nhiều nhất</div>' + r.hardest.map(function (q) { return '<div class="lv-list-item"><div class="main"><b>Câu ' + q.n + '</b> · từ <b>' + esc(q.target) + '</b><div class="lv-sub">' + esc(q.stem) + '</div></div><b>' + q.wrong + '/' + q.of + ' bạn sai</b></div>'; }).join('') + '</div>';
    h += '<div class="lv-card lv-form"><div class="lv-title">➕ Giao thêm cho học sinh khác</div>' + stuPickerHtml('aStu') + '<button class="lv-btn" id="aGo" style="margin-top:10px;">📨 Giao thêm</button><div id="aMsg"></div></div>';
    root.innerHTML = '<div style="margin-bottom:12px;"><a class="lv-btn sm ghost" href="lesson-vocab.html" style="text-decoration:none;">← Quay lại</a> <a class="lv-btn sm ghost" href="lesson-vocab.html?id=' + id + '" style="text-decoration:none;">👁 Xem như học sinh</a></div>' + h;
    bindStuPicker('aStu');
    $('aGo').onclick = function () {
      var ids = pickedIds('aStu'); if (!ids.length) { $('aMsg').innerHTML = '<div class="lv-msg err">Hãy chọn ít nhất một học sinh.</div>'; return; }
      var b = $('aGo'); b.disabled = true;
      api('POST', '/api/lesson-vocab/' + id + '/assign', { user_ids: ids }).then(function (r2) { $('aMsg').innerHTML = '<div class="lv-msg ok">✅ Đã giao thêm cho ' + r2.added + ' học sinh' + (r2.already ? ' (' + r2.already + ' bạn đã có sẵn)' : '') + '.</div>'; setTimeout(function () { viewResults(id); }, 1500); })
        .catch(function (e) { $('aMsg').innerHTML = '<div class="lv-msg err">' + esc(e.message) + '</div>'; b.disabled = false; });
    };
  }).catch(function (e) { root.innerHTML = '<div class="lv-card"><div class="lv-msg err">' + esc(e.message) + '</div></div>'; });
}

/* ═════════════ BÁO CÁO: ĐIỂM + THỜI GIAN HỌC ═════════════ */
function fmtDur(sec) {
  sec = Math.round(sec || 0); if (sec <= 0) return '0 phút';
  if (sec < 60) return sec + ' giây';
  var m = Math.round(sec / 60); if (m < 60) return m + ' phút';
  var h = Math.floor(m / 60); return h + ' giờ ' + (m % 60 ? (m % 60) + ' phút' : '');
}
var REP = null;
function viewReport(days) {
  days = days || 30;
  $('lvTab').innerHTML = '<div class="lv-sub">Đang tải báo cáo...</div>';
  api('GET', '/api/lesson-vocab/report?days=' + days).then(function (r) {
    REP = r;
    var tot = r.students.reduce(function (a, s) { a.sec += s.seconds; a.done += s.done; a.asg += s.assigned; if (s.avgPct != null) { a.p += s.avgPct; a.pn++; } if (s.seconds > 0) a.active++; return a; }, { sec: 0, done: 0, asg: 0, p: 0, pn: 0, active: 0 });
    var h = '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px;"><b>Khoảng thời gian:</b>' +
      [7, 30, 90].map(function (d) { return '<button class="lv-pill' + (d === r.days ? ' on' : '') + '" data-d="' + d + '">' + d + ' ngày qua</button>'; }).join('') +
      '<span style="flex:1"></span><button class="lv-btn sm ghost" id="repCsv">⬇️ Tải bảng CSV</button></div>';
    h += '<div class="lv-kpi"><div><b>' + r.students.length + '</b><span>học sinh được giao</span></div><div><b>' + tot.active + '</b><span>đã học trong ' + r.days + ' ngày</span></div><div><b>' + fmtDur(tot.sec) + '</b><span>tổng thời gian học</span></div><div><b>' + (tot.pn ? Math.round(tot.p / tot.pn) + '%' : '—') + '</b><span>điểm luyện tập trung bình</span></div><div><b>' + tot.done + '/' + tot.asg + '</b><span>lượt bài đã nộp</span></div></div>';
    if (!r.students.length) { $('lvTab').innerHTML = h + '<div class="lv-sub" style="padding:10px 0;">Chưa có học sinh nào được giao bộ từ.</div>'; bindRep(); return; }
    h += '<div class="lv-scroll"><table class="lv-table"><thead><tr><th>Học sinh</th><th>Đã nộp / được giao</th><th>Điểm TB</th><th>Thời gian học</th><th>Số ngày học</th><th>Hoạt động gần nhất</th></tr></thead><tbody>' +
      r.students.map(function (s) {
        var warn = s.seconds === 0 && s.done === 0 ? ' style="background:var(--warning-soft)"' : '';
        return '<tr' + warn + '><td><b>' + esc(s.name) + '</b><div class="lv-sub">' + esc(s.email) + '</div></td><td>' + s.done + '/' + s.assigned + '</td><td>' + (s.avgPct != null ? s.avgPct + '%' : '—') + '</td><td>' + (s.seconds ? fmtDur(s.seconds) : '<span class="lv-sub">chưa học</span>') + '</td><td>' + s.activeDays + '</td><td>' + (s.last ? fmtDl(s.last) : '<span class="lv-sub">—</span>') + '</td></tr>';
      }).join('') + '</tbody></table></div><div class="lv-sub" style="margin-top:6px;">Dòng nền vàng = học sinh chưa mở bài và chưa nộp kết quả nào. Thời gian chỉ tính khi học sinh đang mở bài và có thao tác.</div>';
    h += '<div class="lv-title" style="margin-top:20px;">📚 Theo từng bộ từ</div><div class="lv-scroll"><table class="lv-table"><thead><tr><th>Bộ từ</th><th>Đã nộp / được giao</th><th>Điểm TB</th><th>Tổng thời gian</th><th></th></tr></thead><tbody>' +
      r.sets.map(function (x) { return '<tr><td><b>' + esc(x.title) + '</b></td><td>' + x.done + '/' + x.assigned + '</td><td>' + (x.avgPct != null ? x.avgPct + '%' : '—') + '</td><td>' + fmtDur(x.seconds) + '</td><td><a class="lv-btn sm" style="text-decoration:none;" href="lesson-vocab.html?id=' + x.id + '&tab=results">Chi tiết</a></td></tr>'; }).join('') + '</tbody></table></div>';
    $('lvTab').innerHTML = h; bindRep();
  }).catch(function (e) { $('lvTab').innerHTML = '<div class="lv-msg err">' + esc(e.message) + '</div>'; });
}
function bindRep() {
  Array.prototype.forEach.call($('lvTab').querySelectorAll('[data-d]'), function (b) { b.onclick = function () { viewReport(+b.getAttribute('data-d')); }; });
  var c = $('repCsv'); if (!c) return;
  c.onclick = function () {
    if (!REP) return;
    var q = function (v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; };
    var rows = [['Học sinh', 'Email', 'Số bộ được giao', 'Số bộ đã nộp', 'Điểm TB (%)', 'Thời gian học (phút)', 'Số ngày học', 'Hoạt động gần nhất']].concat(REP.students.map(function (s) { return [s.name, s.email, s.assigned, s.done, s.avgPct == null ? '' : s.avgPct, Math.round(s.seconds / 60), s.activeDays, s.last || '']; }));
    var csv = '﻿' + rows.map(function (r) { return r.map(q).join(','); }).join('\r\n');
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = 'bao-cao-bo-tu-' + REP.days + 'ngay.csv'; document.body.appendChild(a); a.click(); a.remove();
  };
}

/* ═════════════ HỌC SINH: HỌC THẺ + LUYỆN TẬP ═════════════ */
var S = null, cardIdx = 0, seen = {}, flipped = false, P = null;
function viewStudy(id) {
  api('GET', '/api/lesson-vocab/' + id).then(function (d) {
    S = d; cardIdx = 0; seen = {}; flipped = false; P = null;
    $('lvHeroTitle').textContent = '📘 ' + d.title;
    $('lvHeroSub').textContent = (d.teacher ? 'Giáo viên ' + d.teacher + ' · ' : '') + d.cards.length + ' từ + 10 câu luyện tập' + (d.deadline ? ' · Hạn: ' + fmtDl(d.deadline) : '');
    renderStudy();
    if (!d.owner) startTimeTracker(d.id);
  }).catch(function (e) { root.innerHTML = '<div class="lv-card"><div class="lv-msg err">' + esc(e.message) + '</div><p style="margin-top:10px;"><a href="lesson-vocab.html">← Danh sách bộ từ</a></p></div>'; });
}
/* ── Đo thời gian học: chỉ tính khi tab đang mở VÀ có thao tác trong 45 giây gần nhất ── */
var TT = null;
function startTimeTracker(setId) {
  if (TT) return;
  TT = { id: setId, pending: 0, lastAct: Date.now(), first: true };
  var act = function () { TT.lastAct = Date.now(); };
  ['click', 'keydown', 'touchstart', 'scroll', 'pointermove'].forEach(function (ev) { window.addEventListener(ev, act, { passive: true }); });
  var flush = function (beacon) {
    if (!TT.pending && !TT.first) return;
    var body = JSON.stringify({ seconds: TT.pending, open: TT.first });
    var url = '/api/lesson-vocab/' + TT.id + '/time';
    TT.pending = 0; TT.first = false;
    if (beacon && navigator.sendBeacon) { try { navigator.sendBeacon(url, new Blob([body], { type: 'application/json' })); return; } catch (e) {} }
    fetch(url, { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: body, keepalive: true }).catch(function () {});
  };
  setInterval(function () {
    if (document.visibilityState === 'visible' && Date.now() - TT.lastAct < 45000) TT.pending += 5;
    if (TT.pending >= 30) flush(false);
  }, 5000);
  flush(false); // ghi nhận lượt mở bài
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') flush(true); });
  window.addEventListener('pagehide', function () { flush(true); });
}
function renderStudy() {
  var back = '<div style="margin-bottom:12px;"><a class="lv-btn sm ghost" href="' + (S.owner ? 'lesson-vocab.html' : 'lesson-vocab.html') + '" style="text-decoration:none;">← Danh sách</a>' + (S.owner ? ' <a class="lv-btn sm ghost" href="lesson-vocab.html?id=' + S.id + '&tab=results" style="text-decoration:none;">📊 Kết quả</a>' : '') + '</div>';
  var h = back + (S.note ? '<div class="lv-msg warn" style="margin:0 0 12px;">💬 ' + esc(S.note) + '</div>' : '') +
    '<div class="lv-card"><div class="lv-title">1️⃣ Học thẻ từ vựng <span class="lv-sub" id="lvSeen"></span></div><div class="lv-stage"><div id="lvCard"></div></div></div>' +
    '<div class="lv-card" id="lvPracticeBox"><div class="lv-title">2️⃣ Luyện tập 10 câu trắc nghiệm</div><div id="lvPractice"></div></div>';
  root.innerHTML = h; renderCard(); renderPracticeIntro();
}
function renderCard() {
  var c = S.cards[cardIdx]; seen[cardIdx] = 1; var n = Object.keys(seen).length;
  $('lvSeen').textContent = 'đã xem ' + n + '/' + S.cards.length + ' thẻ';
  $('lvCard').innerHTML = '<div class="lv-flip' + (flipped ? ' on' : '') + '" id="lvFlip"><div class="lv-flip-in"><div class="lv-face"><div class="lv-word">' + esc(c.word) + '</div><div class="lv-pos">' + esc(c.pos) + '</div><div class="lv-ipa">' + esc(c.ipa) + '</div><button class="lv-snd" id="lvSnd" title="Nghe phát âm">🔊</button><div class="lv-sub" style="margin-top:10px;">Bấm thẻ để xem nghĩa</div></div>' +
    '<div class="lv-face back"><div class="lv-pos" style="font-style:normal;"><b>' + esc(c.word) + '</b> · ' + esc(c.pos) + ' · ' + esc(c.ipa) + '</div><div class="lv-def">' + esc(c.simple) + '</div><div class="lv-vi">' + esc(c.vi) + '</div><div class="lv-ex">' + hl(c.example, c.word) + ' <button class="lv-snd sm" id="lvSnd2" title="Nghe câu ví dụ">🔊</button></div></div></div></div>' +
    '<div class="lv-nav"><button class="lv-btn ghost" id="lvPrev"' + (cardIdx === 0 ? ' disabled' : '') + '>← Trước</button><span class="lv-sub">' + (cardIdx + 1) + ' / ' + S.cards.length + '</span><button class="lv-btn" id="lvNext"' + (cardIdx === S.cards.length - 1 ? ' disabled' : '') + '>Sau →</button></div>';
  $('lvFlip').onclick = function (e) { if (e.target.id === 'lvSnd' || e.target.id === 'lvSnd2') return; flipped = !flipped; $('lvFlip').classList.toggle('on', flipped); };
  $('lvSnd').onclick = function (e) { e.stopPropagation(); speak(c.word); };
  $('lvSnd2').onclick = function (e) { e.stopPropagation(); speak(c.example); };
  $('lvPrev').onclick = function () { cardIdx--; flipped = false; renderCard(); };
  $('lvNext').onclick = function () { cardIdx++; flipped = false; renderCard(); };
  if (!c._spoke && ttsOK) { c._spoke = 1; }
}
document.addEventListener('keydown', function (e) {
  if (!S || /INPUT|TEXTAREA|SELECT/.test((e.target || {}).tagName || '')) return;
  if (P && P.active && !P.done) { var k = 'abcd1234'.indexOf(e.key.toLowerCase()); if (k >= 0 && !P.locked) { var b = document.querySelectorAll('.lv-ans')[k % 4]; if (b) b.click(); } else if ((e.key === 'Enter' || e.key === ' ') && P.locked && $('lvNextQ')) { e.preventDefault(); $('lvNextQ').click(); } return; }
  if ($('lvFlip')) { if (e.key === ' ') { e.preventDefault(); $('lvFlip').click(); } else if (e.key === 'ArrowRight' && !$('lvNext').disabled) $('lvNext').click(); else if (e.key === 'ArrowLeft' && !$('lvPrev').disabled) $('lvPrev').click(); }
});

function renderPracticeIntro() {
  var last = S.attempts && S.attempts[0];
  $('lvPractice').innerHTML = '<div class="lv-sub" style="margin-bottom:12px;">Điền từ thích hợp vào chỗ trống, mỗi câu có 4 đáp án A, B, C, D (phím A–D hoặc 1–4). ' + (last ? 'Lần gửi gần nhất: <b>' + last.score + '/' + last.total + '</b>.' : '') + '</div><button class="lv-btn" id="lvStartP">▶ Bắt đầu luyện tập</button>';
  $('lvStartP').onclick = startPractice;
}
function startPractice() { P = { i: 0, ans: [], active: true, locked: false, done: false, sent: false }; renderQ(); $('lvPracticeBox').scrollIntoView({ block: 'start' }); }
function renderQ() {
  var q = S.questions[P.i], parts = q.stem.split('_____');
  $('lvPractice').innerHTML = '<div class="lv-q"><div class="lv-sub">Câu ' + (P.i + 1) + ' / ' + S.questions.length + '</div><div class="lv-bar" style="margin:6px 0 12px;"><i style="width:' + Math.round(P.i / S.questions.length * 100) + '%"></i></div>' +
    '<div class="lv-stem">' + esc(parts[0]) + '<span class="lv-blank" id="lvBlank">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>' + esc(parts[1] || '') + '</div><div class="lv-opts">' +
    q.options.map(function (o, k) { return '<button class="lv-ans" data-k="' + k + '"><b>' + 'ABCD'.charAt(k) + '</b>' + esc(o) + '</button>'; }).join('') + '</div><div id="lvFb"></div></div>';
  P.locked = false;
  Array.prototype.forEach.call($('lvPractice').querySelectorAll('.lv-ans'), function (b) {
    b.onclick = function () {
      if (P.locked) return; P.locked = true; var k = +b.getAttribute('data-k'), ok = k === q.answer_index; P.ans[P.i] = k;
      Array.prototype.forEach.call($('lvPractice').querySelectorAll('.lv-ans'), function (x, j) { x.disabled = true; if (j === q.answer_index) x.classList.add('ok'); });
      if (!ok) b.classList.add('bad');
      var bl = $('lvBlank'); bl.textContent = q.options[q.answer_index]; bl.className = 'lv-blank ' + (ok ? 'ok' : 'bad');
      var card = S.cards.filter(function (c) { return c.word.toLowerCase() === String(q.target).toLowerCase(); })[0];
      $('lvFb').innerHTML = '<div class="lv-fb ' + (ok ? 'ok' : 'bad') + '"><b>' + (ok ? '✅ Chính xác!' : '❌ Chưa đúng — đáp án đúng là ' + 'ABCD'.charAt(q.answer_index) + '. ' + esc(q.options[q.answer_index])) + '</b><br>' + esc(q.stem.replace('_____', q.options[q.answer_index])) +
        (card ? '<br><span class="lv-sub"><b>' + esc(card.word) + '</b> ' + esc(card.ipa) + ' — ' + esc(card.vi) + '</span>' : '') + '</div><button class="lv-btn" id="lvNextQ" style="width:100%;justify-content:center;margin-top:12px;">' + (P.i === S.questions.length - 1 ? 'Xem kết quả 🎉' : 'Câu tiếp theo →') + '</button>';
      $('lvNextQ').onclick = function () { if (P.i === S.questions.length - 1) { P.done = true; renderResult(); } else { P.i++; renderQ(); } };
    };
  });
}
function renderResult() {
  var score = S.questions.reduce(function (s, q, i) { return s + (P.ans[i] === q.answer_index ? 1 : 0); }, 0);
  P.score = score;
  $('lvPractice').innerHTML = '<div class="lv-q"><div class="lv-score"><div style="font-size:40px;">' + (score >= 9 ? '🏆' : score >= 7 ? '🎉' : score >= 5 ? '👍' : '💪') + '</div><div class="big">' + score + '/' + S.questions.length + '</div><div class="lv-sub">' + (score >= 9 ? 'Xuất sắc!' : score >= 7 ? 'Làm tốt lắm!' : score >= 5 ? 'Khá ổn, ôn thêm các câu sai nhé!' : 'Hãy xem lại thẻ từ rồi luyện lại nhé!') + '</div></div>' +
    '<div class="lv-actions" style="justify-content:center;margin:10px 0;"><button class="lv-btn" id="lvSend">📨 Gửi kết quả cho giáo viên</button><button class="lv-btn line" id="lvAgain">↺ Luyện lại</button></div><div id="lvSendMsg"></div>' +
    '<div class="lv-rev"><b>Xem lại từng câu:</b>' + S.questions.map(function (q, i) { var ok = P.ans[i] === q.answer_index; return '<div>' + (ok ? '✅' : '❌') + ' <b>' + (i + 1) + '.</b> ' + esc(q.stem.replace('_____', '[' + q.options[q.answer_index] + ']')) + (ok ? '' : '<br><span class="lv-sub">Bạn chọn: ' + (P.ans[i] == null ? '(bỏ trống)' : esc(q.options[P.ans[i]])) + '</span>') + '</div>'; }).join('') + '</div></div>';
  $('lvAgain').onclick = startPractice;
  $('lvSend').onclick = function () {
    if (S.owner && !confirm('Bạn đang xem như giáo viên. Vẫn gửi kết quả thử?')) return;
    var b = $('lvSend'); b.disabled = true;
    api('POST', '/api/lesson-vocab/' + S.id + '/submit', { answers: S.questions.map(function (q, i) { return P.ans[i] == null ? null : P.ans[i]; }) }).then(function (r) {
      $('lvSendMsg').innerHTML = '<div class="lv-msg ok">✅ Đã gửi kết quả <b>' + r.score + '/' + r.total + '</b> cho giáo viên (lần gửi thứ ' + r.attempt + '). Bạn vẫn có thể luyện lại và gửi lần nữa.</div>'; b.textContent = '✓ Đã gửi'; b.disabled = true; setTimeout(function () { b.textContent = '📨 Gửi lại kết quả mới'; b.disabled = false; }, 400);
    }).catch(function (e) { $('lvSendMsg').innerHTML = '<div class="lv-msg err">' + esc(e.message) + '</div>'; b.disabled = false; });
  };
}

/* ═════════════ KHỞI ĐỘNG ═════════════ */
api('GET', '/api/me').then(function (r) { ME = r.user || ME; }).catch(function () {}).then(function () {
  var id = parseInt(qs('id'), 10);
  if (id && qs('tab') === 'results') return viewResults(id);
  if (id) return viewStudy(id);
  viewList();
});
window.__lv = { get D() { return D; }, get S() { return S; } };
})();

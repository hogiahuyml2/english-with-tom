<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bài học ngữ pháp — English With Tom</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#6F58EE">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=23">
<style>
.sl-wrap { max-width: 820px; margin: 0 auto; padding: 18px 20px 50px; }
.sl-back { display: inline-block; font-size: 13px; color: var(--text-muted); text-decoration: none; margin-bottom: 10px; } .sl-back:hover { color: var(--primary); }
.sl-head { display: flex; gap: 14px; align-items: center; margin-bottom: 14px; }
.sl-head .ico { font-size: 44px; }
.sl-head h1 { margin: 0; font-size: 26px; } .sl-head .sub { color: var(--text-muted); font-size: 14px; }
.sl-sum { background: var(--primary-soft); border-radius: var(--radius); padding: 14px 16px; line-height: 1.6; font-size: 14.5px; margin-bottom: 18px; }
.sl-sec { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 18px; margin-bottom: 14px; box-shadow: var(--shadow); }
.sl-sec h2 { font-size: 17px; margin: 0 0 10px; color: var(--primary); }
.sl-sec p, .sl-sec li { line-height: 1.7; font-size: 14.5px; margin: 6px 0; }
.sl-sec ul { padding-left: 22px; margin: 6px 0; }
.sl-f { background: var(--bg-soft); border-left: 4px solid var(--primary); border-radius: 8px; padding: 10px 14px; margin: 10px 0; font-family: ui-monospace, Menlo, monospace; font-size: 13.5px; line-height: 1.8; overflow-x: auto; }
.sl-t { overflow-x: auto; margin: 10px 0; } .sl-t table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
.sl-t th { background: var(--primary-soft); text-align: left; padding: 8px 10px; } .sl-t td { padding: 8px 10px; border-top: 1px solid var(--border); vertical-align: top; }
.sl-tip, .sl-warn { border-radius: 10px; padding: 10px 14px; margin: 10px 0; font-size: 14px; line-height: 1.6; }
.sl-tip { background: var(--success-soft); } .sl-warn { background: var(--warning-soft); }
.sl-blk { font-size: 17px; font-weight: 800; margin: 26px 0 10px; }
.sl-ex { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--border); } .sl-ex:first-of-type { border-top: none; }
.sl-ex .en { font-weight: 600; font-size: 14.5px; } .sl-ex .vi { color: var(--text-muted); font-size: 13.5px; }
.sl-spk { border: none; background: var(--primary-soft); border-radius: 50%; width: 32px; height: 32px; cursor: pointer; flex-shrink: 0; font-size: 14px; }
.sl-mis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px 0; border-top: 1px solid var(--border); font-size: 14px; } .sl-mis:first-of-type { border-top: none; }
.sl-mis .bad { color: #ef4444; } .sl-mis .good { color: var(--success); } .sl-mis .note { grid-column: 1 / -1; color: var(--text-muted); font-size: 13px; }
@media (max-width: 560px) { .sl-mis { grid-template-columns: 1fr; } }
.sl-quiz { background: var(--surface); border: 2px solid var(--primary); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }
.sl-qtop { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-muted); margin-bottom: 8px; font-weight: 600; }
.sl-bar { height: 8px; background: var(--border); border-radius: 99px; overflow: hidden; margin-bottom: 14px; } .sl-bar > i { display: block; height: 100%; background: var(--gradient); transition: width .3s; }
.sl-stem { font-size: 17px; font-weight: 600; line-height: 1.6; margin-bottom: 14px; }
.sl-stem u { display: inline-block; min-width: 70px; border-bottom: 3px solid var(--primary); text-decoration: none; text-align: center; color: var(--primary); }
.sl-opt { display: block; width: 100%; text-align: left; padding: 12px 14px; margin-bottom: 8px; border: 2px solid var(--border); border-radius: 12px; background: var(--surface); color: var(--text); font-size: 15px; font-family: inherit; cursor: pointer; }
.sl-opt:hover:not(:disabled) { border-color: var(--primary); }
.sl-opt.ok { border-color: var(--success); background: var(--success-soft); } .sl-opt.no { border-color: #ef4444; background: rgba(239,68,68,.12); }
.sl-opt:disabled { cursor: default; }
.sl-expl { margin-top: 10px; padding: 11px 14px; border-radius: 10px; background: var(--bg-soft); font-size: 14px; line-height: 1.6; }
.sl-btn { display: inline-flex; padding: 11px 22px; border-radius: 11px; border: none; background: var(--gradient); color: #fff; font-size: 14.5px; font-weight: 700; cursor: pointer; font-family: inherit; box-shadow: var(--shadow); text-decoration: none; margin-top: 12px; }
.sl-btn.ghost { background: var(--primary-soft); color: var(--text); box-shadow: none; }
.sl-score { text-align: center; padding: 10px 0; } .sl-score .big { font-size: 46px; font-weight: 800; background: var(--gradient); -webkit-background-clip: text; background-clip: text; color: transparent; }
.sl-nav { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
.sl-err { text-align: center; padding: 60px 0; color: var(--text-muted); }
</style>
</head>
<body data-page="school">
<div id="site-header"></div>
<main class="sl-wrap" id="app"><div class="sl-err">Đang tải…</div></main>
<div id="site-footer"></div>
<script src="js/main.js?v=31"></script>
<script src="data/school/index.js?v=2"></script>
<script src="js/school-merge.js?v=1"></script>
<script>
function __schoolMain() {
  var app = document.getElementById('app');
  var IDX = window.SCHOOL_INDEX || [];
  var params = new URLSearchParams(location.search);
  var id = params.get('id'), testGrade = parseInt(params.get('test'), 10);
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function md(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'); }
  function prog() { try { return JSON.parse(localStorage.getItem('ewt-school-progress') || '{}'); } catch (e) { return {}; } }
  function saveProg(key, pct) { try { var P = prog(); var o = P[key] || { best: 0, tries: 0 }; o.best = Math.max(o.best, pct); o.last = pct; o.tries++; o.at = Date.now(); P[key] = o; localStorage.setItem('ewt-school-progress', JSON.stringify(P)); } catch (e) {} }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function speak(t) { try { if (!window.speechSynthesis) return; speechSynthesis.cancel(); var u = new SpeechSynthesisUtterance(t); u.lang = 'en-US'; u.rate = 0.9; speechSynthesis.speak(u); } catch (e) {} }
  function load(grade, cb) { var s = document.createElement('script'); s.src = 'data/school/g' + grade + '.js?v=2'; s.onload = function () { SchoolExtra.applyLessons(); cb(); }; s.onerror = function () { fail('Không tải được dữ liệu bài học. Hãy thử lại.'); }; document.head.appendChild(s); }
  function fail(m) { app.innerHTML = '<div class="sl-err"><p>' + esc(m) + '</p><a class="sl-btn" href="school.html">← Về danh sách bài</a></div>'; }

  /* ── bộ câu hỏi (dùng chung cho bài học & kiểm tra tổng hợp) ── */
  function runQuiz(box, qs, key, onDone) {
    var i = 0, correct = 0, wrong = [];
    function show() {
      var q = qs[i], fixed = q[4] === 1, correctText = q[1][q[2]];
      var opts = fixed ? q[1].slice() : shuffle(q[1]);
      box.innerHTML = '<div class="sl-qtop"><span>Câu ' + (i + 1) + '/' + qs.length + '</span><span>✅ ' + correct + '</span></div><div class="sl-bar"><i style="width:' + (i / qs.length * 100) + '%"></i></div>' +
        '<div class="sl-stem">' + md(q[0]).replace('___', '<u>&nbsp;&nbsp;?&nbsp;&nbsp;</u>') + '</div>' +
        opts.map(function (o, k) { return '<button class="sl-opt" data-k="' + k + '">' + esc(o) + '</button>'; }).join('') + '<div id="fb"></div>';
      var done = false;
      box.querySelectorAll('.sl-opt').forEach(function (b) {
        b.onclick = function () {
          if (done) return; done = true;
          var ok = opts[+b.dataset.k] === correctText;
          if (ok) correct++; else wrong.push(q);
          box.querySelectorAll('.sl-opt').forEach(function (x) { x.disabled = true; if (opts[+x.dataset.k] === correctText) x.classList.add('ok'); });
          if (!ok) b.classList.add('no');
          var st = box.querySelector('.sl-stem u'); if (st) { st.textContent = correctText; }
          document.getElementById('fb').innerHTML = '<div class="sl-expl">' + (ok ? '🎉 <b>Chính xác!</b> ' : '❌ <b>Chưa đúng.</b> Đáp án: <b>' + esc(correctText) + '</b>. ') + md(q[3]) + '</div><button class="sl-btn" id="nx">' + (i + 1 < qs.length ? 'Câu tiếp →' : 'Xem kết quả') + '</button>';
          document.getElementById('nx').onclick = function () { i++; if (i < qs.length) show(); else finish(); };
        };
      });
    }
    function finish() {
      var pct = Math.round(correct / qs.length * 100);
      saveProg(key, pct);
      box.innerHTML = '<div class="sl-score"><div class="big">' + correct + '/' + qs.length + '</div><div style="font-size:16px;font-weight:700">' + pct + '% — ' + (pct >= 90 ? '🏆 Xuất sắc!' : pct >= 70 ? '👏 Tốt lắm!' : pct >= 50 ? '💪 Khá ổn, ôn lại một chút nhé' : '📖 Hãy đọc lại bài học rồi thử lại') + '</div></div>' +
        (wrong.length ? '<div class="sl-blk" style="font-size:15px">Các câu cần xem lại</div>' + wrong.map(function (q) { return '<div class="sl-expl" style="margin-bottom:8px"><div>' + md(q[0]).replace('___', '<b>' + esc(q[1][q[2]]) + '</b>') + '</div><div style="color:var(--text-muted);margin-top:4px">' + md(q[3]) + '</div></div>'; }).join('') : '<p style="text-align:center">Bạn làm đúng toàn bộ! 🌟</p>') +
        '<div style="text-align:center"><button class="sl-btn" id="again">🔁 Làm lại</button> ' + (onDone ? onDone() : '') + '</div>';
      document.getElementById('again').onclick = function () { i = 0; correct = 0; wrong = []; qs = shuffle(qs); show(); };
    }
    show();
  }

  function renderBlock(b) {
    if (b.p) return '<p>' + md(b.p) + '</p>';
    if (b.f) return '<div class="sl-f">' + b.f.map(md).join('<br>') + '</div>';
    if (b.t) return '<div class="sl-t"><table><thead><tr>' + b.t.h.map(function (h) { return '<th>' + md(h) + '</th>'; }).join('') + '</tr></thead><tbody>' + b.t.r.map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + md(c) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>';
    if (b.tip) return '<div class="sl-tip">💡 ' + md(b.tip) + '</div>';
    if (b.warn) return '<div class="sl-warn">⚠️ ' + md(b.warn) + '</div>';
    if (b.ul) return '<ul>' + b.ul.map(function (x) { return '<li>' + md(x) + '</li>'; }).join('') + '</ul>';
    return '';
  }

  /* ── chế độ kiểm tra tổng hợp ── */
  if (testGrade >= 6 && testGrade <= 12) {
    document.title = 'Kiểm tra tổng hợp lớp ' + testGrade + ' — English With Tom';
    load(testGrade, function () {
      var L = window.SCHOOL.lessons, all = [];
      Object.keys(L).forEach(function (k) { if (L[k].grade === testGrade) L[k].quiz.forEach(function (q) { all.push(q); }); });
      var qs = shuffle(all).slice(0, 20);
      app.innerHTML = '<a class="sl-back" href="school.html">← Danh sách bài học</a><div class="sl-head"><div class="ico">📝</div><div><h1>Kiểm tra tổng hợp lớp ' + testGrade + '</h1><div class="sub">20 câu ngẫu nhiên từ tất cả chủ điểm ngữ pháp lớp ' + testGrade + '</div></div></div><div class="sl-quiz" id="qz"></div>';
      runQuiz(document.getElementById('qz'), qs, 'test-' + testGrade);
    });
    return;
  }

  /* ── chế độ bài học ── */
  var meta = IDX.filter(function (l) { return l.id === id; })[0];
  if (!meta) { fail('Không tìm thấy bài học này.'); return; }
  load(meta.grade, function () {
    var d = window.SCHOOL.lessons[id];
    if (!d) { fail('Không tìm thấy bài học này.'); return; }
    document.title = d.title + ' (Lớp ' + d.grade + ') — English With Tom';
    var sameG = IDX.filter(function (l) { return l.grade === d.grade; }), pos = sameG.map(function (l) { return l.id; }).indexOf(id);
    var prev = sameG[pos - 1], next = sameG[pos + 1];
    app.innerHTML = (window.__SCHOOL_PREVIEW ? '<div class="sl-warn" style="margin-bottom:12px">👁️ <b>Bản xem trước</b> — học sinh chưa nhìn thấy bài này nếu chưa xuất bản. <a href="school-admin.html?id=' + encodeURIComponent(id) + '">← Quay lại trang sửa</a></div>' : '') + '<a class="sl-back" href="school.html">← Tiếng Anh phổ thông · Lớp ' + d.grade + '</a>' +
      '<div class="sl-head"><div class="ico">' + esc(d.icon) + '</div><div><h1>' + esc(d.title) + '</h1><div class="sub">' + esc(d.sub) + ' · Lớp ' + d.grade + ' · ' + esc(d.level) + '</div></div></div>' +
      '<div class="sl-sum">' + md(d.summary) + '</div>' +
      d.sections.map(function (s) { return '<section class="sl-sec"><h2>' + md(s.h) + '</h2>' + s.b.map(renderBlock).join('') + '</section>'; }).join('') +
      '<div class="sl-blk">🗣️ Ví dụ (bấm 🔊 để nghe)</div><section class="sl-sec">' + d.ex.map(function (e, k) { return '<div class="sl-ex"><button class="sl-spk" data-k="' + k + '" aria-label="Nghe">🔊</button><div><div class="en">' + md(e[0]) + '</div><div class="vi">' + esc(e[1]) + '</div></div></div>'; }).join('') + '</section>' +
      '<div class="sl-blk">🚫 Lỗi sai thường gặp</div><section class="sl-sec">' + d.mis.map(function (m) { return '<div class="sl-mis"><div class="bad">❌ ' + md(m[0]) + '</div><div class="good">✅ ' + md(m[1]) + '</div>' + (m[2] ? '<div class="note">' + md(m[2]) + '</div>' : '') + '</div>'; }).join('') + '</section>' +
      '<div class="sl-blk">✍️ Luyện tập (' + d.quiz.length + ' câu)</div><div class="sl-quiz" id="qz"></div>' +
      '<div class="sl-nav">' + (prev ? '<a class="sl-btn ghost" href="school-lesson.html?id=' + encodeURIComponent(prev.id) + '">← ' + esc(prev.title) + '</a>' : '<span></span>') + (next ? '<a class="sl-btn ghost" href="school-lesson.html?id=' + encodeURIComponent(next.id) + '">' + esc(next.title) + ' →</a>' : '<a class="sl-btn ghost" href="school-lesson.html?test=' + d.grade + '">📝 Kiểm tra tổng hợp lớp ' + d.grade + '</a>') + '</div>';
    app.querySelectorAll('.sl-spk').forEach(function (b) { b.onclick = function () { speak(d.ex[+b.dataset.k][0].replace(/\*\*/g, '')); }; });
    runQuiz(document.getElementById('qz'), shuffle(d.quiz), id, function () { return next ? '<a class="sl-btn ghost" href="school-lesson.html?id=' + encodeURIComponent(next.id) + '">Bài tiếp theo →</a>' : ''; });
  });
}
SchoolExtra.ready(function () {
  var q = new URLSearchParams(location.search), pid = q.get('id');
  if (q.get('preview') && pid) {
    fetch('/api/school/admin/lesson/' + encodeURIComponent(pid), { credentials: 'same-origin' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (d) {
      if (d && d.lesson) { var L = d.lesson; L.id = pid; SchoolExtra.addPreview(pid, L); window.__SCHOOL_PREVIEW = true; }
      __schoolMain();
    }).catch(function () { __schoolMain(); });
  } else __schoolMain();
});
</script>
</body>
</html>

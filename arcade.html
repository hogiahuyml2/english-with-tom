function inTheme(w, th) { return w.kind === 'word' && w.vi && (!th.topics || th.topics.indexOf(w.topic) >= 0); }

// Chọn n từ: ưu tiên từ CHƯA xuất hiện trong ~120 từ gần nhất của trò này (mỗi lượt chơi ra câu mới), rồi mới tới từ yếu / đến hạn ôn

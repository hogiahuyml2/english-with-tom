<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>EWT City — Thành phố của bạn</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#3E9ED8">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root { --ink: #1F2A44; --muted: #6A7690; --card: #FFFFFF; --line: #DCE4F0; --pri: #3A7BEA; --pri2: #5B9BFF; --gold: #FFC93C; --good: #2FB36D; --bad: #E2503F; --glass: rgba(255,255,255,.92); --font: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; --top: env(safe-area-inset-top, 0px); --bot: env(safe-area-inset-bottom, 0px); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #3E9ED8; font-family: var(--font); color: var(--ink); overscroll-behavior: none; }
#cv { position: fixed; inset: 0; width: 100%; height: 100dvh; display: block; touch-action: none; }
button { font-family: inherit; cursor: pointer; }
.hud { position: fixed; left: 0; right: 0; top: 0; padding: calc(8px + var(--top)) 10px 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; pointer-events: none; z-index: 20; }
.hud > * { pointer-events: auto; }
.badge { display: flex; align-items: center; gap: 8px; background: var(--glass); border-radius: 18px; padding: 5px 12px 5px 6px; box-shadow: 0 4px 14px rgba(20,40,90,.22); min-width: 0; }
.lvl { width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(145deg, #5B9BFF, #3A5BE0); color: #fff; font-weight: 800; font-size: 18px; display: grid; place-items: center; box-shadow: inset 0 -3px 0 rgba(0,0,0,.18); flex: none; }
.lvl small { display: block; font-size: 8px; font-weight: 700; margin-top: -3px; opacity: .85; }
.cname { font-weight: 800; font-size: 14px; line-height: 1.1; white-space: nowrap; }
.xpbar { height: 6px; width: 110px; border-radius: 9px; background: #D9E2F2; overflow: hidden; margin-top: 4px; } .xpbar i { display: block; height: 100%; background: linear-gradient(90deg, #3FC986, #2FB36D); border-radius: 9px; width: 0; transition: width .4s; }
.chip { display: flex; align-items: center; gap: 6px; background: var(--glass); border-radius: 16px; padding: 7px 12px; font-weight: 800; font-size: 14px; box-shadow: 0 4px 14px rgba(20,40,90,.2); border: 0; color: var(--ink); white-space: nowrap; }
.chip b { font-variant-numeric: tabular-nums; } .chip.btn:active { transform: scale(.96); }
.chip .plus { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--good); color: #fff; font-size: 15px; line-height: 1; margin-left: 2px; }
.coin { display: inline-block; width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFE680, #F2B21B 60%, #C98A00); box-shadow: inset 0 0 0 2px #E6A100; vertical-align: -3px; }
.sp { flex: 1; }
.side { position: fixed; right: 10px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 20; }
.rbtn { width: 46px; height: 46px; border-radius: 15px; border: 0; background: var(--glass); font-size: 20px; box-shadow: 0 4px 14px rgba(20,40,90,.25); color: var(--ink); display: grid; place-items: center; font-weight: 800; }
.rbtn:active { transform: scale(.94); }
.mini { position: fixed; left: 10px; top: calc(66px + var(--top)); z-index: 20; background: var(--glass); border-radius: 14px; padding: 5px; box-shadow: 0 4px 14px rgba(20,40,90,.25); }
.mini canvas { display: block; width: 150px; height: 100px; border-radius: 10px; cursor: pointer; touch-action: none; }
.mini .mt { font-size: 10px; font-weight: 700; color: var(--muted); text-align: center; margin-top: 3px; }
.dbar { position: fixed; left: 10px; bottom: calc(86px + var(--bot)); display: flex; flex-direction: column; gap: 6px; z-index: 20; }
.dbtn { border: 0; background: var(--glass); border-radius: 13px; padding: 6px 10px; font-weight: 700; font-size: 12.5px; box-shadow: 0 3px 10px rgba(20,40,90,.22); text-align: left; color: var(--ink); display: flex; gap: 6px; align-items: center; }
.dbtn.lock { opacity: .75; } .dbtn.on { outline: 2px solid var(--pri); }
.bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 8px 10px calc(10px + var(--bot)); display: flex; justify-content: center; gap: 10px; z-index: 25; pointer-events: none; }
.bar > * { pointer-events: auto; }
.tb { min-width: 74px; border: 0; border-radius: 20px; background: var(--glass); padding: 8px 12px 7px; font-weight: 800; font-size: 12px; color: var(--ink); box-shadow: 0 6px 18px rgba(20,40,90,.3); display: flex; flex-direction: column; align-items: center; gap: 1px; position: relative; }
.tb .ic { font-size: 24px; line-height: 1.1; } .tb:active { transform: scale(.95); } .tb.pri { background: linear-gradient(180deg, #5B9BFF, #3A6BE6); color: #fff; } .tb.on { outline: 3px solid var(--gold); }
.dot { position: absolute; right: 6px; top: 4px; background: var(--bad); color: #fff; font-size: 11px; min-width: 18px; height: 18px; border-radius: 9px; display: none; place-items: center; padding: 0 4px; font-weight: 800; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: min(74dvh, 640px); background: var(--card); border-radius: 26px 26px 0 0; box-shadow: 0 -10px 40px rgba(10,30,80,.35); z-index: 40; display: none; flex-direction: column; padding-bottom: var(--bot); }
.sheet.on { display: flex; animation: up .22s ease-out; } @keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet .hd { display: flex; align-items: center; gap: 8px; padding: 12px 14px 6px; } .sheet .hd h3 { margin: 0; font-size: 17px; flex: 1; }
.x { border: 0; background: #EEF2FA; width: 34px; height: 34px; border-radius: 50%; font-size: 17px; font-weight: 800; color: var(--ink); }
.sheet .bd { overflow: auto; padding: 4px 14px 16px; -webkit-overflow-scrolling: touch; flex: 1; }
.tabs { display: flex; gap: 6px; padding: 2px 14px 6px; overflow-x: auto; scrollbar-width: none; } .tabs::-webkit-scrollbar { display: none; }
.tab { border: 2px solid var(--line); background: #fff; border-radius: 14px; padding: 6px 12px; font-weight: 800; font-size: 13px; white-space: nowrap; color: var(--ink); } .tab.on { background: var(--pri); border-color: var(--pri); color: #fff; }
.tools { display: flex; gap: 8px; padding: 0 14px 8px; align-items: center; flex-wrap: wrap; }
.tools input, .tools select { font: 600 13px var(--font); border: 2px solid var(--line); border-radius: 12px; padding: 7px 10px; background: #fff; color: var(--ink); min-width: 0; } .tools input { flex: 1; min-width: 120px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.card { border: 2px solid var(--line); border-radius: 18px; background: #fff; padding: 8px; position: relative; text-align: center; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.card:active { transform: scale(.97); } .card.lock { opacity: .55; filter: grayscale(.6); } .card canvas { width: 112px; height: 84px; }
.card .en { font-weight: 800; font-size: 13.5px; line-height: 1.15; } .card .vi { font-size: 12px; color: var(--muted); font-weight: 600; }
.card .pr { margin-top: 3px; font-weight: 800; font-size: 13px; display: flex; gap: 6px; align-items: center; }
.card .meta { font-size: 11px; color: var(--muted); font-weight: 600; } .card .lk { position: absolute; top: 6px; left: 6px; background: #46506A; color: #fff; font-size: 10.5px; font-weight: 800; padding: 2px 7px; border-radius: 10px; }
.card .sz { position: absolute; top: 6px; right: 6px; background: #EEF2FA; font-size: 10.5px; font-weight: 800; padding: 2px 7px; border-radius: 10px; color: var(--muted); }
.card .say { position: absolute; bottom: 6px; right: 6px; border: 0; background: #EEF2FA; width: 28px; height: 28px; border-radius: 50%; font-size: 14px; }
.btn { border: 0; border-radius: 14px; padding: 10px 14px; font-weight: 800; font-size: 14px; background: #EEF2FA; color: var(--ink); } .btn:active { transform: scale(.97); } .btn:disabled { opacity: .5; }
.btn.pri { background: linear-gradient(180deg, #5B9BFF, #3A6BE6); color: #fff; } .btn.good { background: linear-gradient(180deg, #43D08A, #2FB36D); color: #fff; } .btn.warn { background: linear-gradient(180deg, #FFD65C, #F5B320); color: #5A3A00; } .btn.bad { background: #FDE8E5; color: var(--bad); }
.btn small { display: block; font-weight: 700; font-size: 11px; opacity: .85; margin-top: 1px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: stretch; margin-top: 8px; } .row > .btn { flex: 1; min-width: 120px; }
.info h4 { margin: 0; font-size: 19px; } .info .vi { color: var(--muted); font-weight: 700; font-size: 14px; } .info p { margin: 6px 0; font-size: 14px; line-height: 1.45; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; margin: 8px 0; } .st { background: #F3F6FC; border-radius: 14px; padding: 8px 10px; } .st small { display: block; color: var(--muted); font-weight: 700; font-size: 11px; } .st b { font-size: 15px; font-variant-numeric: tabular-nums; }
.prog { height: 14px; border-radius: 9px; background: #DDE5F3; overflow: hidden; margin: 6px 0; } .prog i { display: block; height: 100%; background: linear-gradient(90deg, #4CD08A, #2FB36D); border-radius: 9px; transition: width .3s; }
.pbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(88px + var(--bot)); background: var(--glass); border-radius: 22px; padding: 8px 10px; box-shadow: 0 8px 26px rgba(20,40,90,.35); z-index: 45; display: none; align-items: center; gap: 8px; max-width: calc(100vw - 20px); flex-wrap: wrap; justify-content: center; }
.pbar.on { display: flex; } .pbar .t { font-weight: 800; font-size: 13.5px; } .pbar .err { color: var(--bad); font-size: 12.5px; font-weight: 700; max-width: 300px; }
.toast { position: fixed; left: 50%; top: calc(70px + var(--top)); transform: translate(-50%, -10px); background: rgba(31,42,68,.94); color: #fff; padding: 10px 16px; border-radius: 16px; font-weight: 700; font-size: 14px; z-index: 90; opacity: 0; pointer-events: none; transition: all .22s; max-width: calc(100vw - 30px); text-align: center; line-height: 1.35; } .toast.on { opacity: 1; transform: translate(-50%, 0); }
.modal { position: fixed; inset: 0; background: rgba(20,30,60,.5); z-index: 60; display: none; place-items: center; padding: 14px; } .modal.on { display: grid; }
.box { background: #fff; border-radius: 24px; padding: 16px; width: min(480px, 100%); max-height: 88dvh; overflow: auto; box-shadow: 0 20px 60px rgba(10,20,60,.5); }
.box h3 { margin: 0 0 6px; } .sub { color: var(--muted); font-size: 13px; margin: 0 0 8px; line-height: 1.45; }
.opt { display: block; width: 100%; text-align: left; border: 2px solid var(--line); border-radius: 14px; background: #fff; padding: 10px 12px; font-weight: 700; font-size: 14.5px; margin-top: 8px; color: var(--ink); } .opt.ok { background: #DDF7E8; border-color: var(--good); } .opt.no { background: #FDE8E5; border-color: var(--bad); }
.flip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; } .fc { aspect-ratio: 3/4; border: 0; border-radius: 16px; background: linear-gradient(145deg, #7B6BFF, #3A5BE0); color: #fff; font-size: 34px; font-weight: 800; display: grid; place-items: center; text-align: center; box-shadow: 0 6px 16px rgba(30,40,120,.35); line-height: 1.2; } .fc.open { background: linear-gradient(145deg, #FFE17A, #FFB020); color: #5A3A00; font-size: 15px; } .fc.dim { opacity: .55; }
.dcard { border: 2px solid var(--line); border-radius: 18px; padding: 10px 12px; margin-bottom: 10px; display: flex; gap: 10px; align-items: center; } .dcard .ico { font-size: 34px; } .dcard .tx { flex: 1; min-width: 0; } .dcard b { font-size: 15px; } .dcard .vi { font-size: 12.5px; color: var(--muted); font-weight: 600; } .dcard p { margin: 3px 0 0; font-size: 12.5px; color: var(--muted); }
.field { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-weight: 700; font-size: 14px; } .field select { font: 700 13px var(--font); border: 2px solid var(--line); border-radius: 10px; padding: 6px 8px; }
.sw { position: relative; width: 46px; height: 26px; flex: none; } .sw input { opacity: 0; position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; z-index: 2; } .sw i { position: absolute; inset: 0; background: #C9D3E6; border-radius: 14px; transition: .2s; } .sw i::after { content: ''; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; background: #fff; border-radius: 50%; transition: .2s; box-shadow: 0 1px 3px rgba(0,0,0,.3); } .sw input:checked + i { background: var(--good); } .sw input:checked + i::after { left: 23px; }
.empty { text-align: center; color: var(--muted); font-weight: 700; padding: 20px 10px; }
@media (max-width: 640px) { .mini { top: calc(112px + var(--top)); } .dbtn { padding: 7px 9px; font-size: 18px; } .dbtn .dn { display: none; } .hud { gap: 6px; } .lvl { width: 36px; height: 36px; font-size: 16px; } .cname {display: none; } .xpbar { width: 70px; } .mini canvas { width: 112px; height: 76px; } .tb { min-width: 62px; padding: 7px 8px 6px; font-size: 11px; } .grid { grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); } .chip { padding: 6px 10px; font-size: 13px; } .dbar { bottom: calc(82px + var(--bot)); } }
@media (prefers-reduced-motion: reduce) { .sheet.on { animation: none; } }

.lh { font-weight: 800; font-size: 13px; color: var(--mut); margin: 14px 0 6px; } .lcard { background: #fff; border: 2px solid var(--line); border-radius: 16px; padding: 10px 12px; margin-bottom: 8px; } .lcard.ok { border-color: #5BCB8B; background: #F2FCF6; } .lcard .t { font-weight: 800; font-size: 15px; } .lcard .s { font-size: 12.5px; color: var(--mut); margin: 2px 0 6px; } .lcard .row2 { display: flex; gap: 6px; flex-wrap: wrap; } .lcard .row2 .btn { padding: 7px 11px; font-size: 13px; }
.wcard { text-align: center; padding: 14px 8px 6px; } .wcard .en { font-size: 30px; font-weight: 800; } .wcard .ipa { color: var(--mut); font-size: 15px; margin: 2px 0; } .wcard .vi { font-size: 22px; font-weight: 800; color: #3A5BE0; margin: 8px 0; } .wcard .ex { background: #F4F6FF; border-radius: 12px; padding: 8px 10px; font-size: 14px; text-align: left; margin-top: 8px; } .wcard .ex i { display: block; color: var(--mut); font-style: normal; font-size: 12.5px; margin-top: 2px; }
.opt small { display: block; font-weight: 600; color: var(--mut); font-size: 12.5px; margin-top: 1px; } .qvi { color: var(--mut); font-size: 13.5px; margin: -4px 0 6px; }
.mg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; } .mg button { border: 2px solid var(--line); background: #fff; border-radius: 12px; padding: 11px 6px; font-weight: 700; font-size: 14px; color: var(--ink); } .mg button.sel { border-color: #3A5BE0; background: #EEF1FF; } .mg button.ok { border-color: #5BCB8B; background: #DDF7E8; opacity: .55; } .mg button.no { animation: shk .35s; border-color: #E9573F; } @keyframes shk { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.modal.peek { place-items: end center; background: rgba(20,30,60,.08); pointer-events: none; } .modal.peek .box { pointer-events: auto; margin-bottom: calc(var(--bot) + 66px); }
.lk2 { position: absolute; top: 6px; left: 6px; background: #FFF1C9; color: #8A5A00; border-radius: 8px; padding: 2px 6px; font-size: 11px; font-weight: 800; }

.visiting #bar, .visiting #coinB, .visiting #tkChip, .visiting #cpChip, .visiting #pbar, .visiting #rbar { display: none !important; }
#visBar { position: fixed; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 58px); z-index: 30; display: none; gap: 8px; align-items: center; background: rgba(255,255,255,.96); border-radius: 18px; padding: 8px 10px; box-shadow: 0 6px 22px rgba(10,30,80,.3); max-width: calc(100vw - 20px); flex-wrap: wrap; justify-content: center; } .visiting #visBar { display: flex; } #visBar b { font-size: 14px; } #visBar .btn { padding: 7px 10px; font-size: 13px; }
.frow { display: flex; align-items: center; gap: 8px; padding: 9px 10px; border: 2px solid var(--line); border-radius: 14px; background: #fff; margin-bottom: 7px; } .frow.me { border-color: #7B6BFF; background: #F3F1FF; } .frow .nm { flex: 1; min-width: 0; font-weight: 800; font-size: 14px; } .frow .nm small { display: block; font-weight: 600; color: var(--mut); font-size: 12px; } .frow .btn { padding: 6px 10px; font-size: 12.5px; } .frow .rk { width: 30px; text-align: center; font-weight: 800; font-size: 16px; }
.pj { background: #fff; border: 2px solid var(--line); border-radius: 16px; padding: 10px 12px; margin-bottom: 8px; } .pj.done { border-color: #5BCB8B; background: #F2FCF6; } .pj .pb { height: 12px; border-radius: 8px; background: #E6EBF5; overflow: hidden; margin: 6px 0; } .pj .pb i { display: block; height: 100%; background: linear-gradient(90deg, #4CD08A, #2BB673); }
.stk { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; } .stk button { font-size: 24px; width: 46px; height: 46px; border-radius: 14px; border: 2px solid var(--line); background: #fff; } .stk button.on { border-color: #3A5BE0; background: #EEF1FF; }
.fin { width: 100%; font: 600 14px var(--font); border: 2px solid var(--line); border-radius: 12px; padding: 9px 10px; margin-top: 6px; }
#fxLayer { position: fixed; inset: 0; pointer-events: none; z-index: 70; overflow: hidden; } .pt { position: absolute; font-size: 26px; will-change: transform, opacity; animation: ptf 1.5s ease-out forwards; } @keyframes ptf { 0% { opacity: 1; transform: translate(0, 0) scale(.4); } 15% { transform: translate(calc(var(--dx) * .3), calc(var(--dy) * .3)) scale(1.2); } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.9) rotate(var(--rot)); } }
@media (prefers-reduced-motion: reduce) { .pt { animation-duration: .01s; } }
#floatNotes { position: fixed; inset: 0; pointer-events: none; z-index: 12; overflow: hidden; } .fn { position: absolute; background: #fff; border-radius: 16px; padding: 6px 11px; font-size: 13px; font-weight: 700; box-shadow: 0 4px 14px rgba(10,30,80,.3); max-width: 220px; animation: fnf 12s ease-in-out forwards; } .fn b { color: #3A5BE0; } @keyframes fnf { 0% { opacity: 0; transform: translateY(20px); } 8% { opacity: 1; } 50% { transform: translateY(-40px) translateX(10px); } 92% { opacity: 1; } 100% { opacity: 0; transform: translateY(-90px) translateX(-6px); } }
@media (prefers-reduced-motion: reduce) { .fn { animation: none; opacity: 1; } }
</style>
</head>
<body>
<canvas id="cv" aria-label="Bản đồ thành phố"></canvas>

<div class="hud">
  <div class="badge"><div class="lvl"><span id="lvN">1</span><small>CẤP</small></div><div><div class="cname" id="cName">EWT City</div><div class="xpbar" title="Điểm lên cấp"><i id="xpB"></i></div></div></div>
  <button class="chip btn" id="coinB" type="button" title="Xu — bấm để kiếm thêm"><span class="coin"></span><b id="coinN">0</b><span class="plus">+</span></button>
  <div class="chip" title="Dân số"><span>👥</span><b id="popN">0</b></div>
  <div class="chip" title="Hạnh phúc — công viên, trường học, bệnh viện làm dân vui hơn và nộp nhiều thuế hơn"><span id="hapE">😊</span><b id="hapN">0%</b></div>
  <div class="chip" id="tkChip" title="Phiếu xây nhanh" style="display:none"><span>🎫</span><b id="tkN">0</b></div>
  <div class="chip" id="cpChip" title="Phiếu giảm giá mở quận" style="display:none"><span>🏷️</span><b id="cpN">0</b></div>
  <div class="sp"></div>
  <button class="chip btn" id="sndB" type="button" aria-label="Nhạc nền" title="Bật / tắt nhạc nền theo từng quận">🔇</button>
  <button class="chip btn" id="setB" type="button" aria-label="Cài đặt">⚙️</button>
  <a class="chip btn" href="garden.html" style="text-decoration:none;color:inherit" title="Sang EWT Garden">🌷</a>
  <a class="chip btn" href="word-hub.html" style="text-decoration:none;color:inherit" title="Về Luyện từ">🏠</a>
</div>

<div class="mini"><canvas id="mm" width="300" height="200" title="Chạm để nhảy tới nơi bạn muốn"></canvas><div class="mt">Bản đồ nhỏ</div></div>
<div class="dbar" id="dbar"></div>
<div class="side">
  <button class="rbtn" id="zIn" type="button" aria-label="Phóng to">＋</button>
  <button class="rbtn" id="zOut" type="button" aria-label="Thu nhỏ">－</button>
  <button class="rbtn" id="rL" type="button" aria-label="Xoay trái">⟲</button>
  <button class="rbtn" id="rR" type="button" aria-label="Xoay phải">⟳</button>
  <button class="rbtn" id="zAll" type="button" aria-label="Xem toàn thành phố" title="Xem toàn thành phố">🗺️</button>

<script>
(function () {
'use strict';
var C = EWTCityData, A = EWTCityArt, $ = function (id) { return document.getElementById(id); }, S = null, ENG = null, ROLE = '', INFO = null, SORT = 'lvl', TABK = 'home', DF = -1, CONT = false, SEL = null, ROADDEL = false, ROADCELLS = [];
var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
var fmt = function (n) { n = Math.round(n); return n >= 1e6 ? (n / 1e6).toFixed(n >= 1e7 ? 0 : 1).replace('.0', '') + 'M' : n >= 1e4 ? (n / 1e3).toFixed(n >= 1e5 ? 0 : 1).replace('.0', '') + 'K' : n.toLocaleString('vi-VN'); };
var COIN = '<span class="coin"></span>';
function say(t) { try { var u = new SpeechSynthesisUtterance(t); u.lang = 'en-US'; u.rate = .85; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {} }
var tt; function toast(m, ms) { var el = $('toast'); el.innerHTML = m.replace(/🪙/g, COIN); el.classList.add('on'); clearTimeout(tt); tt = setTimeout(function () { el.classList.remove('on'); }, ms || 2800); }

  return fetch(url, { method: body === undefined ? 'GET' : 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: body === undefined ? undefined : JSON.stringify(body) }).then(function (r) {
    return r.json().catch(function () { return {}; }).then(function (j) { if (r.status === 401) { location.href = 'login.html?next=' + encodeURIComponent('city.html'); throw new Error('Bạn cần đăng nhập.'); } if (!r.ok) throw new Error(j.error || 'Có lỗi, thử lại nhé.'); return j; });
  });
}
function confirmBox(title, text, yes) { return new Promise(function (res) { $('cfmT').textContent = title; $('cfmP').innerHTML = text; $('cfmYes').textContent = yes || 'Đồng ý'; $('cfmM').classList.add('on'); $('cfmYes').onclick = function () { $('cfmM').classList.remove('on'); res(true); }; $('cfmNo').onclick = function () { $('cfmM').classList.remove('on'); res(false); }; }); }
var setting = { weather: 'auto', time: 'auto', cars: 1, people: 1, boats: 1, sky: 1 };
try { var sv = JSON.parse(localStorage.getItem('ewt-city-set') || 'null'); if (sv) Object.keys(sv).forEach(function (k) { setting[k] = sv[k]; }); } catch (e) {}
function saveSet() { try { localStorage.setItem('ewt-city-set', JSON.stringify(setting)); } catch (e) {} }

/* ───── khởi động động cơ ───── */
ENG = new EWTCityEngine($('cv'), $('mm'), {
  onSelect: function (b) { if (VIS) { if (b) toast('🏠 ' + esc(C.BY[b.k].en) + ' — ' + esc(C.BY[b.k].vi) + ' (cấp ' + b.lv + ')', 2200); ENG.sel = -1; return; } if (b) openInfo(b.i); else { INFO = null; $('infoS').classList.remove('on'); } },
  onBubble: function (b) { collect(b.i); },
  onPlace: function (g) { placeNow(); },
  onGhost: function (g) { updatePbar(); },
  onRoad: function (cells, tapOnly) { roadDone(cells, tapOnly); },
  onRoadTap: function (i) { if (ENG.mode === 'road' && ROADDEL) removeRoad([i]); },
  onFixed: function (f) { var d = C.FIXED_DEF[f.k]; if (d) { toast('🏛️ <b>' + d.en + '</b> — ' + d.vi + ' <button class="x" style="width:28px;height:28px;margin-left:6px" id="fxSay">🔊</button>', 3500); setTimeout(function () { var b = $('fxSay'); if (b) b.onclick = function () { say(d.en); }; }, 30); } },
  onLocked: function (d) { if (!VIS) openDist(d); },
  onMode: function (m) { $('bRoad').classList.toggle('on', m === 'road'); }
});
function applySettings() {
  var f = ENG.fx; f.cars = !!setting.cars; f.people = !!setting.people; f.boats = !!setting.boats; f.sky = !!setting.sky;
  ENG.weather = setting.weather === 'auto' ? autoWeather() : setting.weather; ENG.hourOverride = setting.time === 'day' ? 12 : setting.time === 'night' ? 23 : null;
}
function autoWeather() { var d = new Date(), k = (d.getDate() * 7 + Math.floor(d.getHours() / 4)) % 9; return k === 0 || k === 5 ? 'cloud' : k === 3 ? 'rain' : 'clear'; }
applySettings();

/* ───── tải trạng thái ───── */
function setState(d) { S = d.city; if (d.role) ROLE = d.role; ENG.setState(S); hud(); if (INFO != null) renderInfo(); if ($('shopS').classList.contains('on')) renderShop(); if ($('distS').classList.contains('on')) renderDist(); roadBar(); }
function hud() {
  var s = S.stats; $('lvN').textContent = s.level; $('coinN').textContent = fmt(S.coins); $('coinN').title = String(S.coins); $('popN').textContent = fmt(s.pop);
  $('hapN').textContent = s.happy + '%'; $('hapE').textContent = s.happy >= 85 ? '😄' : s.happy >= 65 ? '😊' : s.happy >= 50 ? '😐' : '☹️';
  var lo = C.LEVEL_AT[s.level - 1] || 0, hi = C.LEVEL_AT[s.level]; $('xpB').style.width = (hi ? clampN((s.score - lo) / (hi - lo) * 100, 3, 100) : 100) + '%';
  $('tkChip').style.display = S.tickets ? '' : 'none'; $('tkN').textContent = S.tickets; $('cpChip').style.display = S.coupons ? '' : 'none'; $('cpN').textContent = S.coupons;
  var sum = 0, n = 0; S.bs.forEach(function (b) { if (b.pend >= 1) { sum += b.pend; n++; } }); $('colDot').style.display = n ? 'grid' : 'none'; $('colDot').textContent = n; $('bCol').title = n ? 'Có ' + fmt(sum) + ' xu thuế đang chờ' : 'Chưa có thuế';
  $('dbar').innerHTML = C.DISTRICTS.map(function (d) { var open = S.districts.indexOf(d.id) >= 0; return '<button class="dbtn' + (open ? '' : ' lock') + '" data-d="' + d.id + '" type="button" title="' + esc(d.vi) + '"><span>' + d.icon + (open ? '' : '🔒') + '</span><span class="dn">' + esc(d.en.split(' ')[0]) + '</span></button>'; }).join('');
}
function clampN(v, a, b) { return Math.max(a, Math.min(b, v)); }
var firstLoad = true;
function load() { if (VIS) return Promise.resolve(); return api('/api/city').then(function (d) { setState(d); if (firstLoad) { firstLoad = false; var qp = new URLSearchParams(location.search); if (qp.get('visit')) setTimeout(function () { enterVisit(qp.get('visit')); }, 300); else if (qp.get('vuid')) setTimeout(function () { enterVisit('uid:' + qp.get('vuid')); }, 300); else setTimeout(showFloatNotes, 1200); setTimeout(function () { ENG.focusDistrict(0); }, 80); if (!S.bs.length) toast('👋 Chào mừng đến EWT City! Bấm 🏗️ Xây dựng để đặt ngôi nhà đầu tiên (miễn phí).', 6000); } }).catch(function (e) { toast(e.message, 4000); }); }

/* ───── cửa hàng ───── */
var CATTAB = C.CATS.map(function (c) { return c; }).concat([['bundle', '📦 Gói combo'], ['plan', '📐 Quy hoạch']]);
function renderShop() {
  $('shopTabs').innerHTML = CATTAB.map(function (c) { return '<button class="tab' + (TABK === c[0] ? ' on' : '') + '" data-tab="' + c[0] + '" type="button">' + c[1] + '</button>'; }).join('');
  if (TABK === 'bundle') return renderBundles(); if (TABK === 'plan') return renderPlans();
  var q = $('shopQ').value.trim().toLowerCase(), list = C.ITEMS.filter(function (it) { if (TABK !== 'all' && it.cat !== TABK && !q) return false; if (DF >= 0 && it.ds.indexOf(DF) < 0) return false; if (q && (it.en + ' ' + it.vi + ' ' + it.k).toLowerCase().indexOf(q) < 0) return false; return true; });
  list.sort(function (a, b) { return SORT === 'cost' ? a.cost - b.cost : SORT === 'inc' ? b.inc - a.inc : SORT === 'hp' ? b.hp - a.hp : a.lvl - b.lvl || a.cost - b.cost; });
  $('shopG').innerHTML = list.length ? '' : '<div class="empty" style="grid-column:1/-1">Không tìm thấy công trình nào.</div>';
  list.forEach(function (it) {
    var lock = S.stats.level < it.lvl, free = (S.free[it.k] | 0) > 0, d = document.createElement('div'); d.className = 'card' + (lock ? ' lock' : ''); d.setAttribute('data-k', it.k);
    var nl = it.ch && ROLE !== 'admin' && S.chapters.indexOf(it.ch) < 0, noev = it.ev && S.ev.indexOf(it.ev) < 0, inv = S.inv[it.k] | 0; d.innerHTML = (lock ? '<span class="lk">🔒 Cấp ' + it.lvl + '</span>' : noev ? '<span class="lk2">🎉 Chờ sự kiện</span>' : nl ? '<span class="lk2">📖 Cần học từ</span>' : '') + '<span class="sz">' + it.w + '×' + it.h + '</span>';
    d.appendChild(A.thumb(it.k, 112, 1));
    d.insertAdjacentHTML('beforeend', '<div class="en">' + esc(it.en) + '</div><div class="vi">' + esc(it.vi) + '</div><div class="pr">' + (free ? '<span style="color:var(--good)">MIỄN PHÍ ×' + S.free[it.k] + '</span>' : COIN + ' ' + fmt(it.cost)) + (inv ? ' <span style="color:var(--good)">· 📦 kho ×' + inv + '</span>' : '') + '</div><div class="meta">' + (it.inc ? '+' + fmt(it.inc) + ' xu/giờ · ' : '') + (it.pop ? '👥 ' + it.pop + ' · ' : '') + (it.hp ? '😊 +' + it.hp : '') + ' ⏱ ' + dur(it.secs) + '</div>');
    var sb = document.createElement('button'); sb.className = 'say'; sb.type = 'button'; sb.textContent = '🔊'; sb.setAttribute('aria-label', 'Nghe phát âm'); sb.onclick = function (e) { e.stopPropagation(); say(it.en); }; d.appendChild(sb);
    if (!lock && !noev && !nl) { var kb = document.createElement('button'); kb.className = 'say'; kb.style.right = '44px'; kb.type = 'button'; kb.textContent = '🛒'; kb.title = 'Mua trữ vào kho'; kb.setAttribute('aria-label', 'Mua trữ vào kho'); kb.onclick = function (e) { e.stopPropagation(); stockBox(it); }; d.appendChild(kb); }
    d.onclick = function () { pick(it); }; $('shopG').appendChild(d);
  });
}
function dur(s) { return s >= 3600 ? Math.floor(s / 3600) + 'h' + (Math.floor(s % 3600 / 60) ? Math.floor(s % 3600 / 60) + 'm' : '') : s >= 60 ? Math.floor(s / 60) + 'm' + (s % 60 ? s % 60 + 's' : '') : s + 's'; }
function openShop() { closeSheets(); setMode('view'); var sel = $('shopD'); if (!sel.options.length) { sel.innerHTML = '<option value="-1">Tất cả quận</option>' + C.DISTRICTS.map(function (d) { return '<option value="' + d.id + '">' + d.icon + ' ' + esc(d.vi) + '</option>'; }).join(''); } renderShop(); $('shopS').classList.add('on'); }
function pick(it) {
  if (S.stats.level < it.lvl) return toast('🔒 Cần thành phố cấp ' + it.lvl + ' để mở ' + it.vi + '.');
  if (it.ch && ROLE !== 'admin' && S.chapters.indexOf(it.ch) < 0) { toast('📖 Học xong chương này để mở <b>' + esc(it.vi) + '</b> nhé!', 3200); return openLearn(it.ch); }
  if (it.ev && S.ev.indexOf(it.ev) < 0) return toast('🎉 ' + esc(it.vi) + ' chỉ có khi sự kiện đang diễn ra nhé!', 3000);
  if (!(S.free[it.k] > 0) && !(S.inv[it.k] > 0) && S.coins < it.cost) toast('Bạn chưa đủ xu cho ' + it.vi + ' (cần ' + fmt(it.cost) + ') — hãy 🧠 Kiếm xu hoặc xây nhà rẻ trước nhé.', 3600);
  $('shopS').classList.remove('on'); SEL = it; setMode('place', it.k); say(it.en);
}
function setMode(m, k) { ENG.setMode(m, k); $('pbar').classList.toggle('on', m === 'place'); $('rbar').classList.toggle('on', m === 'road'); if (m === 'place') updatePbar(); if (m === 'road') { ROADCELLS = []; roadBar(); } if (m === 'view') { SEL = null; } $('bRoad').classList.toggle('on', m === 'road'); }
function updatePbar() {
  var g = ENG.ghost; if (!g) return; var it = C.BY[g.k], free = (S.free[it.k] | 0) > 0; $('pName').innerHTML = esc(it.en) + ' · <span style="font-weight:600;color:var(--muted)">' + esc(it.vi) + '</span> — ' + (free ? '<b style="color:var(--good)">MIỄN PHÍ</b>' : COIN + ' <b>' + fmt(it.cost) + '</b>'); $('pErr').textContent = g.ok ? '' : g.err; $('pOk').disabled = !g.ok;
}
function placeNow() {
  var g = ENG.ghost; if (!g || !g.ok) { if (g && g.err) toast(g.err, 3000); return; }
  var it = C.BY[g.k]; if (!(S.free[it.k] > 0) && S.coins < it.cost) return toast('Chưa đủ xu (cần ' + fmt(it.cost) + ') — bấm 🧠 Kiếm xu nhé!', 3200);
  $('pOk').disabled = true;
  api('/api/city/place', { k: g.k, x: g.x, y: g.y }).then(function (d) { setState(d); SND('place'); say(it.en); if (!CONT && !$('pCont').checked) setMode('view'); else { ENG.refreshGhost(); updatePbar(); } toast('🏗️ Bắt đầu xây ' + esc(it.vi) + '!', 1800); }).catch(function (e) { toast(e.message, 3600); ENG.refreshGhost(); updatePbar(); });
}

/* ───── đường ───── */
function roadBar() {
  if (ENG.mode !== 'road') return; var n = ROADCELLS.length, st = ENG.stateObj(), cnt = 0; ROADCELLS.forEach(function (c) { if (ROADDEL ? ENG.roadsX[c[1] * C.W + c[0]] : C.canRoad(st, c[0], c[1], ENG.occ).ok) cnt++; });
  $('rTxt').innerHTML = n ? (ROADDEL ? 'Dỡ ' + cnt + ' ô đường (hoàn ' + cnt * C.RULES.roadCost / 2 + ' ' + COIN + ')' : 'Xây ' + cnt + ' ô đường · ' + COIN + ' <b>' + cnt * C.RULES.roadCost + '</b>') : (ROADDEL ? 'Chạm vào đường bạn tự xây để dỡ' : 'Kéo ngón tay trên bản đồ để vẽ đường (' + C.RULES.roadCost + ' xu / ô)'); $('rOk').disabled = !cnt;
}
function roadDone(cells, tap) { ROADCELLS = cells; if (ROADDEL) { var idxs = cells.filter(function (c) { return ENG.roadsX[c[1] * C.W + c[0]]; }).map(function (c) { return c[1] * C.W + c[0]; }); if (idxs.length) removeRoad(idxs); return; } roadBar(); $('rErr').textContent = ''; if (cells.length) { var st = ENG.stateObj(), bad = null; cells.forEach(function (c) { var r = C.canRoad(st, c[0], c[1], ENG.occ); if (!r.ok && !bad && !/Đã có đường/.test(r.err)) bad = r.err; }); $('rErr').textContent = bad || ''; } }
function buildRoad() {
  var st = ENG.stateObj(), idxs = ROADCELLS.filter(function (c) { return C.canRoad(st, c[0], c[1], ENG.occ).ok; }).map(function (c) { return c[1] * C.W + c[0]; }); if (!idxs.length) return;

}
function removeRoad(idxs) { api('/api/city/road/remove', { cells: idxs }).then(function (d) { setState(d); ROADCELLS = []; roadBar(); toast('Đã dỡ ' + d.removed + ' ô đường.', 1800); }).catch(function (e) { toast(e.message, 3600); }); }

/* ───── thông tin công trình ───── */
function openInfo(id) { if (VIS) return; INFO = id; closeSheets(true); setMode('view'); renderInfo(); $('infoS').classList.add('on'); var b = S.bs.filter(function (x) { return x.i === id; })[0]; if (b) say(C.BY[b.k].en); }
function renderInfo() {
  var b = S.bs.filter(function (x) { return x.i === INFO; })[0]; if (!b) { $('infoS').classList.remove('on'); INFO = null; return; }
  var it = C.BY[b.k], now = ENG.nowMs(), building = b.tg > b.lv, lv = b.lv || b.tg, rem = Math.max(0, (b.t1 - now) / 1000), st = S.stats;
  $('infoT').innerHTML = esc(it.en) + ' <span style="font-weight:700;color:var(--muted);font-size:14px">· ' + esc(it.vi) + '</span>';
  var h = '<p><button class="btn" id="iSay" type="button">🔊 ' + esc(it.en) + '</button></p><p style="margin-top:0">' + esc(it.desc) + '<br><span style="color:var(--muted)">Cấp ' + lv + '/' + C.MAXLV + ' · ' + it.w + '×' + it.h + ' ô</span></p>';
  if (building) {
    var pct = clampN((now - b.t0) / (b.t1 - b.t0) * 100, 0, 100); h += '<div class="prog"><i id="iProg" style="width:' + pct + '%"></i></div><div style="font-weight:800;font-size:15px">⏳ ' + (b.lv === 0 ? 'Đang xây' : 'Đang nâng lên cấp ' + b.tg) + ': còn <span id="iRem">' + timeTxt(rem) + '</span></div>';
    var cx2 = C.speedCost('x2', rem), cn = C.speedCost('now', rem);

function stickerBox(tok, name, notes, left) {
  STK = ''; var draw = function () { lmodal('<h3>💬 Lời nhắn cho ' + esc(name) + '</h3><p class="sub">Còn ' + left + ' lượt hôm nay. Chọn sticker và/hoặc viết vài chữ (tối đa 80 ký tự).</p><div class="stk">' + VIS.stickers.map(function (x) { return '<button type="button" data-sk="' + x + '" class="' + (STK === x ? 'on' : '') + '">' + x + '</button>'; }).join('') + '</div><input class="fin" id="nTxt" maxlength="80" placeholder="Ví dụ: Thành phố của bạn đẹp quá!" autocomplete="off">' + (notes && notes.length ? '<div class="sub" style="margin-top:8px">Gần đây: ' + notes.slice(0, 4).map(function (n) { return esc(n.sticker) + ' <b>' + esc(n.who) + '</b>' + (n.text ? ': ' + esc(n.text) : ''); }).join(' · ') + '</div>' : '') + '<div class="row"><button class="btn" data-close="learnM" type="button">Để sau</button><button class="btn pri" id="nGo" type="button">Gửi</button></div>'); $('learnMB').onclick = function (e) { var b = e.target.closest('[data-sk]'); if (b) { var t = $('nTxt').value; STK = STK === b.getAttribute('data-sk') ? '' : b.getAttribute('data-sk'); draw(); $('nTxt').value = t; } }; $('nGo').onclick = function () { api('/api/city/visit/note', { token: tok, sticker: STK, text: $('nTxt').value }).then(function (r) { $('learnM').classList.remove('on'); VIS.notes = r.notes; VIS.noteLeft = r.noteLeft; toast('💬 Đã gửi!' + (r.reward ? ' Bạn nhận +' + r.reward + ' 🪙' : ''), 2800); if (r.reward) { MYS.coins += r.reward; } SND('note'); burst(STK ? [STK, '💬', '✨'] : ['💬', '✨', '💖'], 12); if (r.reward) setTimeout(function () { SND('coin'); burst(['🪙'], 6); }, 450); }).catch(function (e) { toast(e.message, 3200); }); }; };
  draw();
}
function giftBox(tok, name) {
  var me = MYS || S, items = Object.keys(me.inv || {}).filter(function (k) { return me.inv[k] > 0 && C.BY[k]; }), cur = items[0] || '', mode = 'xu';
  var draw = function () {
    var h = '<h3>🎁 Tặng quà cho ' + esc(name) + '</h3><div class="tabs" style="padding:0 0 6px"><button class="tab' + (mode === 'xu' ? ' on' : '') + '" data-gm="xu" type="button">💰 Tặng xu</button><button class="tab' + (mode === 'item' ? ' on' : '') + '" data-gm="item" type="button">📦 Tặng đồ trong kho</button></div>';
    if (mode === 'xu') h += '<p class="sub">Tối đa 50.000 xu mỗi lần, 300.000 xu/ngày cho một bạn, 20 lượt/ngày (dùng chung với EWT Garden).</p>' + numBox('gXu', 100, 50000) + '<input class="fin" id="gNote" maxlength="60" placeholder="Lời nhắn (không bắt buộc)" autocomplete="off"><div class="row"><button class="btn" data-close="learnM" type="button">Để sau</button><button class="btn pri" id="gGo" type="button">Tặng xu</button></div>';
    else if (!items.length) h += '<p class="empty">Kho của bạn đang trống. Hãy 🛒 mua trữ đồ ở cửa hàng rồi quay lại tặng bạn nhé.</p><div class="row"><button class="btn" data-close="learnM" type="button">Đóng</button></div>';
    else h += '<div class="field">Món quà<select id="gK">' + items.map(function (k) { return '<option value="' + k + '"' + (cur === k ? ' selected' : '') + '>' + esc(C.BY[k].vi) + ' (kho: ' + me.inv[k] + ')</option>'; }).join('') + '</select></div>' + numBox('gN', 1, 10) + '<p class="sub">Mỗi ngày tặng tối đa 20 món (10 món cho một bạn).</p><div class="row"><button class="btn" data-close="learnM" type="button">Để sau</button><button class="btn pri" id="gGo" type="button">Tặng đồ</button></div>';
    lmodal(h);
    $('learnMB').onclick = function (e) { var b = e.target.closest('[data-gm]'); if (b) { mode = b.getAttribute('data-gm'); draw(); return; } var nb = e.target.closest('[data-nm]'); if (nb) { var inp = $(nb.getAttribute('data-nm')); inp.value = Math.max(1, Math.min(+inp.max, (Math.floor(+inp.value) || 1) + (+nb.getAttribute('data-d')))); } };
    if ($('gK')) $('gK').onchange = function () { cur = this.value; };
    if ($('gGo')) $('gGo').onclick = function () {
      var go = mode === 'xu' ? api('/api/city/gift/xu', { token: tok, xu: +$('gXu').value, note: $('gNote').value }) : api('/api/city/gift/item', { token: tok, k: $('gK').value, n: +$('gN').value });
      go.then(function (r) { $('learnM').classList.remove('on'); if (mode === 'xu') { if (MYS) MYS.coins = r.coins; S.coins = r.coins; hud(); toast('💰 Đã tặng xu cho ' + esc(name) + '!', 2600); burst(['🪙', '💰', '✨'], 16); } else { (MYS || S).inv = r.inv; toast('🎁 Đã gửi quà cho ' + esc(name) + '!', 2600); burst(['🎁', '🎀', '✨', '💖'], 16); } SND('gift'); }).catch(function (e) { toast(e.message, 3600); });
    };
  };
  draw();
}
function showFloatNotes() {
  api('/api/city/notes').then(function (d) {
    var last = 0; try { last = +localStorage.getItem('ewt-city-notes') || 0; } catch (e) {} var fresh = d.notes.filter(function (n) { return n.id > last && !n.mine; }).slice(0, 4);
    if (!fresh.length) { $('frDot').style.display = 'none'; return; } $('frDot').style.display = 'grid'; $('frDot').textContent = fresh.length;
    fresh.forEach(function (n, i) { setTimeout(function () { var el = document.createElement('div'); el.className = 'fn'; el.style.left = (12 + Math.random() * 55) + '%'; el.style.top = (35 + Math.random() * 35) + '%'; el.innerHTML = esc(n.sticker || '💬') + ' <b>' + esc(n.who) + '</b>' + (n.text ? ': ' + esc(n.text) : ''); $('floatNotes').appendChild(el); SND('ping'); setTimeout(function () { el.remove(); }, 12500); }, 1500 + i * 2200); });
    try { localStorage.setItem('ewt-city-notes', String(d.notes[0].id)); } catch (e) {}
  }).catch(function () {});
}
function openSet() {
  var sel = function (id, opts, cur) { return '<select id="' + id + '">' + opts.map(function (o) { return '<option value="' + o[0] + '"' + (String(cur) === String(o[0]) ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select>'; };
  var sw = function (id, on) { return '<label class="sw"><input type="checkbox" id="' + id + '"' + (on ? ' checked' : '') + '><i></i></label>'; };
  var h = '<div class="field">Thời tiết' + sel('sWea', [['auto', 'Tự động'], ['clear', '☀️ Nắng'], ['cloud', '☁️ Nhiều mây'], ['rain', '🌧️ Mưa'], ['snow', '❄️ Tuyết']], setting.weather) + '</div>';
  h += '<div class="field">Thời gian' + sel('sTime', [['auto', 'Theo giờ thật'], ['day', '🌞 Luôn ban ngày'], ['night', '🌙 Luôn ban đêm']], setting.time) + '</div>';
  h += '<div class="field">Xe cộ chạy trên đường' + sw('sCars', setting.cars) + '</div><div class="field">Người đi bộ' + sw('sPpl', setting.people) + '</div><div class="field">Thuyền trên sông, biển' + sw('sBoat', setting.boats) + '</div><div class="field">Mây, chim, khinh khí cầu, máy bay' + sw('sSky', setting.sky) + '</div>';
  h += '<div class="field">Hiện khu quy hoạch<label class="sw"><input type="checkbox" id="sZone"' + (ENG.showZones ? ' checked' : '') + '><i></i></label></div>';
  if (ROLE === 'admin') h += '<div class="row"><button class="btn warn" id="sCoins" type="button">💰 Nạp 999.999.999 xu để thử game (chỉ quản trị)</button></div>';
  $('setB2').innerHTML = h; $('setM').classList.add('on');
  var ch = function () { setting.weather = $('sWea').value; setting.time = $('sTime').value; setting.cars = $('sCars').checked ? 1 : 0; setting.people = $('sPpl').checked ? 1 : 0; setting.boats = $('sBoat').checked ? 1 : 0; setting.sky = $('sSky').checked ? 1 : 0; ENG.showZones = $('sZone').checked; saveSet(); applySettings(); };
  ['sWea', 'sTime', 'sCars', 'sPpl', 'sBoat', 'sSky', 'sZone'].forEach(function (id) { $(id).onchange = ch; });
  if ($('sCoins')) $('sCoins').onclick = function () { api('/api/garden/admin/test-coins', {}).then(function () { toast('💰 Đã nạp xu thử nghiệm!'); load(); }).catch(function (e) { toast(e.message); }); };
}

/* ───── sự kiện giao diện ───── */
function closeSheets(keepInfo) { ['shopS', 'distS', 'learnS', 'friendS'].forEach(function (id) { $(id).classList.remove('on'); }); if (!keepInfo) { $('infoS').classList.remove('on'); INFO = null; } }
document.addEventListener('click', function (e) {
  var t = e.target, el;
  if ((el = t.closest('[data-close]'))) { $(el.getAttribute('data-close')).classList.remove('on'); if (el.getAttribute('data-close') === 'infoS') { INFO = null; ENG.sel = -1; } return; }
  if ((el = t.closest('[data-tab]'))) { TABK = el.getAttribute('data-tab'); renderShop(); return; }
  if ((el = t.closest('[data-d]')) && el.classList.contains('dbtn')) { var d = +el.getAttribute('data-d'); if (S.districts.indexOf(d) >= 0) ENG.focusDistrict(d); else openDist(d); return; }
  if ((el = t.closest('[data-go]'))) { $('distS').classList.remove('on'); ENG.focusDistrict(+el.getAttribute('data-go')); return; }
  if ((el = t.closest('[data-un]'))) { unlock(+el.getAttribute('data-un'), !!el.getAttribute('data-cp')); return; }
  if ((el = t.closest('[data-say]'))) { say(el.getAttribute('data-say')); return; }
  if ((el = t.closest('[data-sp]'))) { speed(el.getAttribute('data-sp')); return; }
  if ((el = t.closest('[data-act]'))) { var a = el.getAttribute('data-act'); if (a === 'collect') collect(INFO); else if (a === 'up') upgrade(); else if (a === 'dem') demolish(); return; }
  if ((el = t.closest('[data-ft]'))) { FT = el.getAttribute('data-ft'); SND('click'); renderFriends(); return; }
  if ((el = t.closest('[data-fv]'))) { enterVisit(FR.friends[+el.getAttribute('data-fv')].token); return; }
  if ((el = t.closest('[data-fvt]'))) { enterVisit(el.getAttribute('data-fvt')); return; }
  if ((el = t.closest('[data-fg]'))) { var ff = FR.friends[+el.getAttribute('data-fg')]; giftBox(ff.token, ff.short); return; }
  if ((el = t.closest('[data-fnd]'))) { api('/api/city/notes/delete', { id: +el.getAttribute('data-fnd') }).then(renderFriends); return; }
  if ((el = t.closest('[data-ln]'))) { var ac = el.getAttribute('data-ln'), cid = el.getAttribute('data-ch'); if (ac === 'study') { LS = { ch: cid, i: 0 }; studyCard(); } else if (ac === 'test') startTest(cid); else startMatch(cid); return; }
  if ((el = t.closest('[data-lt]'))) { testPick(+el.getAttribute('data-lt')); return; }
  if ((el = t.closest('[data-ml],[data-mr]')) && el.closest('#mg')) { matchTap(el); return; }
  if ((el = t.closest('[data-qa]'))) { answerQ(+el.getAttribute('data-qa')); return; }
  if ((el = t.closest('[data-fp]'))) { flipCard(+el.getAttribute('data-fp'), el.getAttribute('data-fid')); return; }
});
$('bFriend').onclick = function () { openFriends('list'); }; $('visBack').onclick = leaveVisit; $('visNote').onclick = function () { stickerBox(VIS.tok, VIS.owner.short, VIS.notes, VIS.noteLeft); }; $('visGift').onclick = function () { giftBox(VIS.tok, VIS.owner.short); }; $('bLearn').onclick = function () { openLearn(); }; $('bShop').onclick = openShop; $('bQuiz').onclick = openQuiz; $('coinB').onclick = openQuiz; $('bDist').onclick = function () { openDist(); };
$('bCol').onclick = function () { collect(null); };
$('bRoad').onclick = function () { if (ENG.mode === 'road') setMode('view'); else { closeSheets(); setMode('road'); } };
$('setB').onclick = openSet; $('zIn').onclick = function () { ENG.zoomAt(1.35, ENG.cw / 2, ENG.ch / 2); }; $('zOut').onclick = function () { ENG.zoomAt(1 / 1.35, ENG.cw / 2, ENG.ch / 2); };
$('rL').onclick = function () { ENG.rotate(-1); }; $('rR').onclick = function () { ENG.rotate(1); }; $('zAll').onclick = function () { ENG.fitAll(); };
$('pOk').onclick = placeNow; $('pNo').onclick = function () { setMode('view'); }; $('pCont').onchange = function () { CONT = this.checked; };
$('rNo').onclick = function () { setMode('view'); }; $('rOk').onclick = buildRoad; $('rDel').onchange = function () { ROADDEL = this.checked; ROADCELLS = []; ENG.roadPrev = null; roadBar(); };
$('shopQ').oninput = renderShop; $('shopD').onchange = function () { DF = +this.value; renderShop(); }; $('shopO').onchange = function () { SORT = this.value; renderShop(); };
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { setMode('view'); closeSheets(); } if (e.key === 'q' || e.key === 'Q') ENG.rotate(-1); if (e.key === 'e' || e.key === 'E') ENG.rotate(1); });
window.addEventListener('resize', function () { ENG.resize(); });
load();
window.EWTCityApp = { openLearn: openLearn, ENG: ENG, state: function () { return S; } };
})();
</script>

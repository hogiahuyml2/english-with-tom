<script>
(function () {
'use strict';
var A = window.EWTAvatar, $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
var tt; function toast(t, ms) { var el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(tt); tt = setTimeout(function () { el.classList.remove('on'); }, ms || 2600); }
function api(url, method, body) { return fetch(url, { method: method || 'GET', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined }).then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { if (!r.ok) { var e = new Error(d.error || 'Lỗi ' + r.status); e.data = d; throw e; } return d; }); }); }

var CFG = A.defaults(), SAVED = null, OWNED = {}, COINS = 0, ALL_FREE = false, TAB = 'char', HISTORY = [], DIRTY = false;
var TABS_ANIMAL = [['char', '🐾 Nhân vật'], ['face', '😊 Khuôn mặt'], ['outfit', '👕 Trang phục'], ['hat', '🎩 Mũ'], ['acc', '✨ Phụ kiện'], ['bg', '🖼️ Nền']];
var TABS_HUMAN = [['hchar', '🧑 Chọn nhân vật'], ['hbg', '🖼️ Màu nền']];
var TABS_KEN = [['kchar', '🦁 Chọn thú'], ['hbg', '🖼️ Màu nền']];
var TABS_KID = [['kface', '🙂 Khuôn mặt'], ['khair', '💇 Tóc & nón'], ['kout', '👕 Áo'], ['kbgt', '🖼️ Nền']];
var TABS_FIG = [['fset', '🎭 Chọn bộ & nhân vật'], ['facc', '🎩 Nón, tóc, phụ kiện'], ['fbg', '🖼️ Màu nền']];
var TABS_PIX = [['pchar', '👾 Gương mặt'], ['pout', '👕 Áo & tóc'], ['hbg', '🖼️ Màu nền']];
var GRID = [];
function isHuman() { return CFG.st === 'human'; }
function mode() { return CFG.st || 'animal'; }
function humanStyle() { return A.HUMAN.filter(function (x) { return x.id === CFG.hs; })[0] || A.HUMAN[0]; }
function newGrid() { GRID = []; for (var i = 0; i < 12; i++) GRID.push(A.randSeed()); }
function modeSwitch() {
  var M = [['animal', '🐾 Thú tự phối', 'Mèo, gấu, thỏ… đổi màu, quần áo, phụ kiện'], ['kenney', '🦁 Thú tròn dễ thương', 'Gấu trúc, cánh cụt, voi… kiểu hoạt hình'], ['human', '🧑 Nhân vật người', 'Chọn kiểu vẽ và khuôn mặt bạn thích'], ['pixel', '👾 Nhân vật pixel', 'Phong cách game, nhiều trang phục'], ['kid', '🧒 Bạn nhỏ hoạt hình', 'Mặt tròn dễ thương, tự chọn tóc, nón, áo'], ['fig', '🎭 Bộ sưu tập 9 bộ', 'Ông bà, pixel, RPG, quái vật, giả kim…']];
  return '<div class="av-modes">' + M.map(function (m) { return '<button class="av-mode' + (mode() === m[0] ? ' on' : '') + '" data-mode="' + m[0] + '"><b>' + m[1] + '</b><span>' + m[2] + '</span></button>'; }).join('') + '</div>';
}
function kenTiles() {
  return '<div class="av-lab">Chọn con vật</div><div class="av-tiles">' + A.KEN.map(function (x) { return '<button class="av-tile' + (CFG.ka === x.id ? ' on' : '') + '" data-ka="' + x.id + '">' + A.render(Object.assign({}, CFG, { ka: x.id }), { size: 72, shape: 'round' }) + '<span>' + x.name + '</span></button>'; }).join('') + '</div>' +
    '<div class="av-lab">Kiểu khuôn mặt</div><div class="av-tiles">' + A.KEN_V.map(function (x) { return '<button class="av-tile' + (CFG.kv === x.id ? ' on' : '') + '" data-kv="' + x.id + '">' + A.render(Object.assign({}, CFG, { kv: x.id }), { size: 72, shape: 'round' }) + '<span>' + x.name + '</span></button>'; }).join('') + '</div>';
}
function pixTiles(kind, list, label) {
  return '<div class="av-lab">' + label + '</div><div class="av-tiles">' + list.map(function (x) { var p = {}; p[kind] = x.id; return '<button class="av-tile' + (CFG[kind] === x.id ? ' on' : '') + '" data-pk="' + kind + '" data-pv="' + x.id + '">' + A.render(Object.assign({}, CFG, p), { size: 72, shape: 'round' }) + '<span>' + x.name + '</span></button>'; }).join('') + '</div>';
}
function gTiles(kind, list, label) {
  return '<div class="av-lab">' + label + '</div><div class="av-tiles">' + list.map(function (x) { var p = {}; p[kind] = x.id; return '<button class="av-tile' + (CFG[kind] === x.id ? ' on' : '') + '" data-gk="' + kind + '" data-gv="' + x.id + '">' + A.render(Object.assign({}, CFG, p), { size: 72, shape: 'round' }) + '<span>' + x.name + '</span></button>'; }).join('') + '</div>';
}
function gToggle(kind, label, onName, offName) {
  return '<div class="av-lab">' + label + '</div><div class="av-tiles">' + [[0, offName], [1, onName]].map(function (x) { var p = {}; p[kind] = x[0]; return '<button class="av-tile' + (CFG[kind] === x[0] ? ' on' : '') + '" data-gk="' + kind + '" data-gv="' + x[0] + '">' + A.render(Object.assign({}, CFG, p), { size: 72, shape: 'round' }) + '<span>' + x[1] + '</span></button>'; }).join('') + '</div>';
}
function accTiles(key, list, label) {
  return '<div class="av-lab">' + label + '</div><div class="av-tiles">' + list.map(function (x) { var p = {}; p[key] = x.id; return '<button class="av-tile' + (CFG[key] === x.id ? ' on' : '') + '" data-ak="' + key + '" data-av="' + x.id + '">' + A.render(Object.assign({}, CFG, p), { size: 72, shape: 'round' }) + '<span>' + esc(x.name) + '</span></button>'; }).join('') + '</div>';
}
function accPanel() {
  var Ac = EWTFigures.ACC, h = accTiles('fh', Ac.HAT, 'Nón');
  if (CFG.fh !== 'none' && CFG.fh !== 'halo') h += pixSw('fhc', Ac.COLORS, 'Màu nón');
  h += accTiles('fw', Ac.WIG, 'Kiểu tóc (đội lên tóc gốc)'); if (CFG.fw !== 'none') h += pixSw('fwc', Ac.HAIRC, 'Màu tóc');
  h += accTiles('fg', Ac.GLASS, 'Kính'); h += accTiles('fn', Ac.NECK, 'Cổ'); if (CFG.fn !== 'none') h += pixSw('fnc', Ac.COLORS, 'Màu khăn / nơ');
  h += accTiles('fa', Ac.OUTFIT, 'Áo'); if (CFG.fa !== 'none') h += pixSw('fac', Ac.COLORS, 'Màu áo');

function figTiles() {
  var Fg = EWTFigures, cur = Fg.find(CFG.fs, CFG.fc) || Fg.find('elder', 'ong-kinh');

    '<div class="av-lab">Nhân vật trong bộ “' + esc(cur.set.name) + '” — ' + esc(cur.set.sub) + '</div><div class="av-tiles">' + cur.set.chars.map(function (ch) { return '<button class="av-tile' + (cur.ch.id === ch.id ? ' on' : '') + '" data-fc="' + ch.id + '">' + A.render(Object.assign({}, CFG, { fs: cur.set.id, fc: ch.id, fo: 0 }), { size: 72, shape: 'round' }) + '<span>' + esc(ch.name) + '</span></button>'; }).join('') + '</div>';

function setCfg(patch, keepHistory) {

function panel() {

  if (TAB === 'hchar') h = humanTiles();
  if (TAB === 'kchar') h = kenTiles();
  if (TAB === 'pchar') h = pixSw('pk', A.PIX.skin, 'Màu da') + pixTiles('pm', A.PIX.mouth, 'Biểu cảm') + pixTiles('pb', A.PIX.beard, 'Râu') + '<div class="av-lab">Kính râm</div><div class="av-tiles"><button class="av-tile' + (!CFG.pg ? ' on' : '') + '" data-pg="0"><div class="none">🚫</div><span>Không</span></button><button class="av-tile' + (CFG.pg ? ' on' : '') + '" data-pg="1">' + A.render(Object.assign({}, CFG, { pg: 1 }), { size: 72, shape: 'round' }) + '<span>Có kính</span></button></div>';
  if (TAB === 'kface') h = pixSw('kk', EWTKid.SKIN, 'Màu da') + gTiles('ke', EWTKid.EYES, 'Mắt') + gTiles('km', EWTKid.MOUTH, 'Miệng') + gToggle('kg', 'Kính', 'Có kính', 'Không') + gToggle('kb', 'Má hồng', 'Có', 'Không');
  if (TAB === 'khair') h = gTiles('kh', EWTKid.HAIR, 'Kiểu tóc') + pixSw('khc', EWTKid.HAIRC, 'Màu tóc') + gTiles('kt', EWTKid.HAT, 'Nón & phụ kiện');
  if (TAB === 'kout') h = gTiles('ko', EWTKid.OUTFIT, 'Kiểu áo') + swatches('oc', A.OUTFIT_PALETTE, 'Màu áo');
  if (TAB === 'kbgt') h = gTiles('kbg', EWTKid.BG, 'Hoạ tiết nền') + swatches('bgc', A.BG_PALETTE, 'Màu nền');
  if (TAB === 'pout') h = pixTiles('ph', A.PIX.hair, 'Tóc & mũ') + pixSw('phc', A.PIX.hairc, 'Màu tóc') + swatches('oc', A.OUTFIT_PALETTE, 'Màu áo');
  if (TAB === 'hbg') h = swatches('bgc', A.BG_PALETTE, 'Màu nền');
  if (TAB === 'char') h = charTiles() + swatches('c1', A.PALETTE, 'Màu lông / da') + swatches('c2', ['#FFF1E0', '#FFFFFF', '#FDE68A', '#FBCFE8', '#BFDBFE', '#BBF7D0', '#E9D5FF', '#FCA5A5'], 'Màu phụ (bụng, tai trong, mõm)');
  if (TAB === 'face') h = tiles('ex', 'Biểu cảm') + tiles('cheek', 'Má', '∅') + tiles('glasses', 'Kính', '👓');
  if (TAB === 'outfit') h = tiles('outfit', 'Trang phục', '🚫') + swatches('oc', A.OUTFIT_PALETTE, 'Màu trang phục');
  if (TAB === 'hat') h = tiles('hat', 'Mũ & phụ kiện đầu', '🚫') + swatches('hc', A.OUTFIT_PALETTE, 'Màu mũ');
  if (TAB === 'acc') h = tiles('neck', 'Đồ quanh cổ', '🚫') + swatches('nc', A.OUTFIT_PALETTE, 'Màu đồ quanh cổ') + tiles('phones', 'Tai nghe', '🚫') + swatches('pc', A.OUTFIT_PALETTE, 'Màu tai nghe') + tiles('held', 'Cầm trên tay', '🚫');
  if (TAB === 'bg') h = tiles('bg', 'Hoạ tiết nền') + swatches('bgc', A.BG_PALETTE, 'Màu nền');
  $('panel').innerHTML = h;
}
function draw() {
  $('stage').innerHTML = A.render(CFG, { size: 260 });
  var c = mode() === 'human' ? humanStyle() : mode() === 'kenney' ? { name: (A.KEN.filter(function (x) { return x.id === CFG.ka; })[0] || A.KEN[0]).name, sub: 'Thú tròn dễ thương' } : mode() === 'pixel' ? { name: 'Nhân vật pixel', sub: 'Phong cách game' } : mode() === 'kid' ? { name: 'Bạn nhỏ hoạt hình', sub: 'Tự chọn tóc, nón, áo' } : mode() === 'fig' ? (function () { var f = EWTFigures.find(CFG.fs, CFG.fc) || EWTFigures.find('elder', 'ong-kinh'); return { name: f.ch.name, sub: 'Bộ ' + f.set.name }; })() : charName(); $('nm').innerHTML = esc(c.name) + '<small>' + esc(c.sub) + '</small>';
  var TABS = { human: TABS_HUMAN, kenney: TABS_KEN, pixel: TABS_PIX, kid: TABS_KID, fig: TABS_FIG }[mode()] || TABS_ANIMAL; if (!TABS.some(function (t) { return t[0] === TAB; })) TAB = TABS[0][0];
  $('modes').innerHTML = modeSwitch();
  $('tabs').innerHTML = TABS.map(function (t) { return '<button class="av-tab' + (TAB === t[0] ? ' on' : '') + '" data-tab="' + t[0] + '">' + t[1] + '</button>'; }).join('');
  panel(); $('coin').textContent = '🪙 ' + COINS + ' xu';
  $('save').disabled = !DIRTY && !!SAVED; $('msg').innerHTML = DIRTY || !SAVED ? 'Chỉnh xong nhớ bấm <b>Lưu nhân vật</b> nhé!' : '✅ Nhân vật đã được lưu — đang hiện ở Hồ sơ và bảng xếp hạng.';
}

/* ───── mở khoá ───── */
function unlock(kind, id) {
  var it = A.OPT[kind].filter(function (x) { return x.id === id; })[0], key = A.keyOf(kind, id);
  if (!confirm('Mở khoá “' + it.name + '” với ' + it.price + ' 🪙?\n(Bạn đang có ' + COINS + ' 🪙)')) return;
  api('/api/avatar/buy', 'POST', { key: key }).then(function (d) {
    COINS = d.coins; OWNED = {}; (d.owned || []).forEach(function (k) { OWNED[k] = 1; });
    var p = {}; p[kind] = id; setCfg(p); toast('🎉 Đã mở khoá “' + it.name + '”!');
  }).catch(function (e) { toast(e.message, 4200); });
}

document.addEventListener('click', function (e) {
  var t = e.target, el;
  if ((el = t.closest('[data-tab]'))) { TAB = el.getAttribute('data-tab'); draw(); return; }
  if ((el = t.closest('[data-mode]'))) {
    var nm = el.getAttribute('data-mode'); if (nm === mode()) return;
    if (nm === 'animal') { HISTORY.push(JSON.stringify(CFG)); var cc = Object.assign({}, CFG); delete cc.st; CFG = A.normalize(cc); DIRTY = JSON.stringify(CFG) !== JSON.stringify(SAVED); }
    else { var pt = { st: nm }; if (nm === 'fig') { pt.fs = CFG.fs || 'elder'; pt.fc = CFG.fc || 'ong-kinh'; } if (nm === 'human') { pt.hs = CFG.hs || 'peeps'; pt.seed = CFG.seed || A.randSeed(); } if (nm === 'pixel') { pt.pk = CFG.pk; pt.ph = CFG.ph; pt.phc = CFG.phc; pt.pg = CFG.pg; pt.pm = CFG.pm; pt.pb = CFG.pb; } setCfg(pt); }
    TAB = { human: 'hchar', kenney: 'kchar', pixel: 'pchar', kid: 'kface', fig: 'fset', animal: 'char' }[nm]; draw(); return;
  }
  if ((el = t.closest('[data-ak]'))) { var ap = {}; ap[el.getAttribute('data-ak')] = el.getAttribute('data-av'); setCfg(ap); return; }
  if (t.closest('#accReset')) { setCfg({ fh: 'none', fw: 'none', fg: 'none', fn: 'none', fa: 'none' }); return; }
  if ((el = t.closest('[data-fs]'))) { var fsn = el.getAttribute('data-fs'); setCfg({ fs: fsn, fc: EWTFigures.SETS.filter(function (x) { return x.id === fsn; })[0].chars[0].id }); return; }
  if ((el = t.closest('[data-fc]'))) { setCfg({ fc: el.getAttribute('data-fc') }); return; }
  if (t.closest('#figBgOrig')) { setCfg({ fo: 0 }); return; }
  if ((el = t.closest('[data-ka]'))) { setCfg({ ka: el.getAttribute('data-ka') }); return; }
  if ((el = t.closest('[data-kv]'))) { setCfg({ kv: el.getAttribute('data-kv') }); return; }
  if ((el = t.closest('[data-pk]'))) { var pp = {}; pp[el.getAttribute('data-pk')] = el.getAttribute('data-pv'); setCfg(pp); return; }
  if ((el = t.closest('[data-gk]'))) { var gk = el.getAttribute('data-gk'), gp = {}; gp[gk] = (gk === 'kg' || gk === 'kb') ? +el.getAttribute('data-gv') : el.getAttribute('data-gv'); setCfg(gp); return; }
  if ((el = t.closest('[data-pg]'))) { setCfg({ pg: +el.getAttribute('data-pg') }); return; }
  if ((el = t.closest('[data-pf]'))) { var pq = {}; pq[el.getAttribute('data-pf')] = el.getAttribute('data-c'); setCfg(pq); return; }
  if ((el = t.closest('[data-hs]'))) { setCfg({ hs: el.getAttribute('data-hs') }); return; }
  if ((el = t.closest('[data-seed]'))) { setCfg({ seed: el.getAttribute('data-seed') }); return; }
  if (t.closest('#moreFaces')) { newGrid(); draw(); return; }
  if ((el = t.closest('.av-tile'))) {
    var k = el.getAttribute('data-k'), v = el.getAttribute('data-v'), p = {};
    if (k !== 'ch' && !owned(k, v)) { unlock(k, v); return; }
    p[k] = v; setCfg(p); return;
  }
  if ((el = t.closest('.av-dot'))) { var q = {}; q[el.getAttribute('data-f')] = el.getAttribute('data-c'); if (mode() === 'fig') q.fo = 1; setCfg(q); return; }
});
document.addEventListener('input', function (e) { var t = e.target; if (t.type === 'color' && t.getAttribute('data-f')) { var q = {}; q[t.getAttribute('data-f')] = t.value; if (mode() === 'fig') q.fo = 1; setCfg(q, true); } });
document.addEventListener('change', function (e) { var t = e.target; if (t.type === 'color' && t.getAttribute('data-f')) HISTORY.push(JSON.stringify(CFG)); });
$('stage').onclick = function () { var sv = $('stage').firstChild; if (sv && sv.animate) sv.animate([{ transform: 'translateY(0) scale(1)' }, { transform: 'translateY(-18px) scale(1.06,.95)' }, { transform: 'translateY(0) scale(.97,1.03)' }, { transform: 'translateY(0) scale(1)' }], { duration: 650, easing: 'cubic-bezier(.3,.7,.4,1)' }); if (window.ewtCelebrate) window.ewtCelebrate(['sparkles', 'star', 'glowing-star'], { from: $('stage'), count: 8 }); };
$('rnd').onclick = function () { var rk = function (a) { return a[Math.floor(Math.random() * a.length)]; };
  var r = mode() === 'fig' ? (function () { var st = rk(EWTFigures.SETS), ch = rk(st.chars); var Ac = EWTFigures.ACC, pk = function (l) { return Math.random() < 0.55 ? rk(l).id : 'none'; }; return A.normalize(Object.assign({}, CFG, { fs: st.id, fc: ch.id, fo: 0, fh: pk(Ac.HAT), fhc: rk(Ac.COLORS), fw: Math.random() < 0.3 ? rk(Ac.WIG).id : 'none', fwc: rk(Ac.HAIRC), fg: Math.random() < 0.3 ? rk(Ac.GLASS).id : 'none', fn: pk(Ac.NECK), fnc: rk(Ac.COLORS), fa: pk(Ac.OUTFIT), fac: rk(Ac.COLORS) })); })() : mode() === 'kid' ? A.normalize(Object.assign({}, CFG, { kk: rk(EWTKid.SKIN), kh: rk(EWTKid.HAIR).id, khc: rk(EWTKid.HAIRC), ke: rk(EWTKid.EYES).id, km: rk(EWTKid.MOUTH).id, kg: Math.random() < .3 ? 1 : 0, kt: Math.random() < .5 ? 'none' : rk(EWTKid.HAT).id, ko: rk(EWTKid.OUTFIT).id, kbg: rk(EWTKid.BG).id, oc: rk(A.OUTFIT_PALETTE), bgc: rk(A.BG_PALETTE) })) : mode() === 'kenney' ? A.normalize(Object.assign({}, CFG, { ka: A.KEN[Math.floor(Math.random() * A.KEN.length)].id, kv: Math.random() < .5 ? 'round' : 'square', bgc: A.BG_PALETTE[Math.floor(Math.random() * A.BG_PALETTE.length)] })) : mode() === 'pixel' ? A.normalize(Object.assign({}, CFG, { pk: A.PIX.skin[Math.floor(Math.random() * A.PIX.skin.length)], ph: A.PIX.hair[Math.floor(Math.random() * A.PIX.hair.length)].id, pb: A.PIX.beard[Math.floor(Math.random() * 3)].id, phc: A.PIX.hairc[Math.floor(Math.random() * 8)], pg: Math.random() < .3 ? 1 : 0, pm: A.PIX.mouth[Math.floor(Math.random() * 3)].id, oc: A.OUTFIT_PALETTE[Math.floor(Math.random() * 10)], bgc: A.BG_PALETTE[Math.floor(Math.random() * 10)] })) : isHuman() ? A.normalize(Object.assign({}, CFG, { hs: A.HUMAN[Math.floor(Math.random() * A.HUMAN.length)].id, seed: A.randSeed(), bgc: A.BG_PALETTE[Math.floor(Math.random() * A.BG_PALETTE.length)] })) : A.random(); HISTORY.push(JSON.stringify(CFG)); CFG = r; DIRTY = true; draw(); };
$('undo').onclick = function () { if (!HISTORY.length) { toast('Chưa có thay đổi nào để hoàn tác'); return; } CFG = A.normalize(JSON.parse(HISTORY.pop())); DIRTY = JSON.stringify(CFG) !== JSON.stringify(SAVED); draw(); };
$('save').onclick = function () {
  var b = this; b.disabled = true; b.textContent = 'Đang lưu…';
  api('/api/me/avatar', 'PUT', { cfg: CFG }).then(function (d) { SAVED = d.cfg; CFG = d.cfg; DIRTY = false; b.textContent = '💾 Lưu nhân vật'; draw(); toast('✅ Đã lưu nhân vật của bạn!'); }).catch(function (err) { b.disabled = false; b.textContent = '💾 Lưu nhân vật'; toast(err.message, 4500); });
};
$('dl').onclick = function () {
  if (isHuman() || mode() === 'kenney') {
    var hi = new Image(); hi.onload = function () { var c = document.createElement('canvas'); c.width = c.height = 512; var x = c.getContext('2d'); x.fillStyle = CFG.bgc; x.fillRect(0, 0, 512, 512); if (mode() === 'kenney') x.drawImage(hi, 66, 66, 380, 380 * hi.naturalHeight / hi.naturalWidth); else x.drawImage(hi, 0, 0, 512, 512); c.toBlob(function (bl) { var a = document.createElement('a'); a.href = URL.createObjectURL(bl); a.download = 'nhan-vat-' + CFG.hs + '.png'; document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500); toast('Đã tải ảnh nhân vật'); }, 'image/png'); };
    hi.onerror = function () { toast('Không tạo được ảnh, hãy thử lại'); }; hi.src = A.imgUrl(CFG); return;
  }
  var svg = A.render(CFG, { size: 512 }), img = new Image(), url = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml' }));
  img.onload = function () { var c = document.createElement('canvas'); c.width = c.height = 512; c.getContext('2d').drawImage(img, 0, 0, 512, 512); URL.revokeObjectURL(url); c.toBlob(function (bl) { var a = document.createElement('a'); a.href = URL.createObjectURL(bl); a.download = 'nhan-vat-' + CFG.ch + '.png'; document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500); toast('Đã tải ảnh nhân vật'); }, 'image/png'); };
  img.onerror = function () { toast('Không tạo được ảnh, hãy thử lại'); }; img.src = url;
};
window.addEventListener('beforeunload', function (e) { if (DIRTY) { e.preventDefault(); e.returnValue = ''; } });

api('/api/me/avatar').then(function (d) {
  ALL_FREE = !!d.all_free; COINS = d.coins || 0; (d.owned || []).forEach(function (k) { OWNED[k] = 1; });
  if (d.cfg) { CFG = d.cfg; SAVED = d.cfg; } else { CFG = A.random(); SAVED = null; DIRTY = true; setTimeout(function () { toast('Đây là nhân vật gợi ý cho bạn — hãy chỉnh theo ý thích rồi lưu nhé!', 4200); }, 600); }
  draw();
}).catch(function () { draw(); });
})();
</script>

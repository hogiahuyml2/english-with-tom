<style>
.sa-wrap { max-width: 1280px; margin: 0 auto; padding: 14px 18px 60px; }
.sa-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.sa-top h1 { font-size: 24px; margin: 0; flex: 1; min-width: 220px; }
.sa-btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; border-radius: 11px; border: 1.5px solid var(--border); background: var(--surface); color: var(--text); font: 700 13.5px inherit; font-family: inherit; cursor: pointer; text-decoration: none; transition: border-color .15s, background .15s, transform .1s; }
.sa-btn:hover:not(:disabled) { border-color: var(--primary); background: var(--primary-soft); }
.sa-btn.pri { background: var(--gradient); color: #fff; border-color: transparent; box-shadow: var(--shadow); } .sa-btn.pri:hover:not(:disabled) { background: var(--gradient); filter: brightness(1.06); }
.sa-btn.dng { color: #dc2626; } .sa-btn.sm { padding: 5px 10px; font-size: 12.5px; border-radius: 9px; } .sa-btn:disabled { opacity: .5; cursor: not-allowed; }
.sa-grid { display: grid; grid-template-columns: 340px 1fr; gap: 16px; align-items: start; }
@media (max-width: 900px) { .sa-grid { grid-template-columns: 1fr; } .sa-grid.editing .sa-side { display: none; } .sa-grid:not(.editing) .sa-main { display: none; } }
.sa-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow); }
.sa-side { position: sticky; top: 76px; max-height: calc(100vh - 96px); overflow: auto; }
.sa-pills { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.sa-pill { padding: 5px 11px; border-radius: 99px; border: 1.5px solid var(--border); background: var(--surface); color: var(--text); font: 700 12.5px inherit; font-family: inherit; cursor: pointer; } .sa-pill.on { background: var(--gradient); color: #fff; border-color: transparent; }
.sa-in, .sa-ta, .sa-sel { width: 100%; padding: 9px 11px; border: 1.5px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--text); font: 14px inherit; font-family: inherit; }
.sa-in:focus, .sa-ta:focus, .sa-sel:focus { outline: none; border-color: var(--primary); }
.sa-ta { resize: vertical; min-height: 64px; line-height: 1.5; }
.sa-li { display: flex; gap: 10px; align-items: flex-start; padding: 10px; border-radius: 12px; cursor: pointer; border: 1.5px solid transparent; }
.sa-li:hover { background: var(--bg-soft); } .sa-li.on { border-color: var(--primary); background: var(--primary-soft); }
.sa-li .ico { font-size: 24px; line-height: 1.1; } .sa-li b { display: block; font-size: 14px; line-height: 1.3; } .sa-li small { color: var(--text-muted); font-size: 12px; }
.sa-chip { display: inline-block; font-size: 10.5px; font-weight: 800; padding: 1px 8px; border-radius: 99px; margin-right: 4px; background: var(--bg-soft); color: var(--text-muted); }
.sa-chip.draft { background: var(--warning-soft); color: var(--warning); } .sa-chip.pub, .sa-chip.edited { background: var(--success-soft); color: var(--success); } .sa-chip.hidden { background: rgba(239,68,68,.12); color: #ef4444; } .sa-chip.flag { background: #fef3c7; color: #92400e; }
.sa-bar { position: sticky; top: 64px; z-index: 20; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; background: var(--surface); border: 1.5px solid var(--border); border-radius: 14px; padding: 10px 12px; box-shadow: var(--shadow); margin-bottom: 12px; }
.sa-bar .sp { flex: 1; }
.sa-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0; }
.sa-tab { padding: 8px 14px; border-radius: 10px; border: 1.5px solid var(--border); background: var(--surface); color: var(--text); font: 700 13px inherit; font-family: inherit; cursor: pointer; } .sa-tab.on { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); }
.sa-fld { margin-bottom: 12px; } .sa-fld label { display: block; font-size: 12.5px; font-weight: 700; color: var(--text-muted); margin-bottom: 4px; }
.sa-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; } .sa-row3 { display: grid; grid-template-columns: 1fr 1fr 1.2fr; gap: 10px; } .sa-row-ico { display: grid; grid-template-columns: 90px 1fr; gap: 10px; }
@media (max-width: 640px) { .sa-row2, .sa-row3 { grid-template-columns: 1fr; } }
.sa-sec { border: 1.5px solid var(--border); border-radius: 14px; padding: 12px; margin-bottom: 12px; background: var(--bg-soft); }
.sa-sec-h { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; } .sa-sec-h .sa-in { font-weight: 700; }
.sa-blk { border: 1.5px dashed var(--border); border-radius: 12px; padding: 10px; margin-bottom: 8px; background: var(--surface); }
.sa-blk-h { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; font-size: 12.5px; font-weight: 800; color: var(--primary); } .sa-blk-h .sp { flex: 1; }
.sa-q { border: 1.5px solid var(--border); border-radius: 14px; padding: 12px; margin-bottom: 12px; background: var(--surface); }
.sa-opt { display: grid; grid-template-columns: 26px 1fr; gap: 8px; align-items: center; margin-top: 6px; } .sa-opt input[type=radio] { width: 18px; height: 18px; accent-color: var(--success); }
.sa-msg { border-radius: 12px; padding: 10px 14px; font-size: 13.5px; line-height: 1.55; margin-bottom: 12px; }
.sa-msg.err { background: rgba(239,68,68,.1); color: #b91c1c; } .sa-msg.warn { background: var(--warning-soft); color: #92400e; } .sa-msg.ok { background: var(--success-soft); color: #166534; } .sa-msg.info { background: var(--primary-soft); }
.sa-msg ul { margin: 4px 0 0 18px; padding: 0; }
.sa-hint { font-size: 12.5px; color: var(--text-muted); margin: 4px 0 8px; line-height: 1.5; }
.sa-empty { text-align: center; color: var(--text-muted); padding: 50px 10px; }
.sa-ov { position: fixed; inset: 0; background: rgba(15,12,40,.55); z-index: 100; display: none; align-items: flex-start; justify-content: center; padding: 40px 14px; overflow: auto; } .sa-ov.on { display: flex; }
.sa-modal { width: 100%; max-width: 640px; background: var(--surface); border-radius: 18px; padding: 20px; box-shadow: 0 24px 60px rgba(0,0,0,.35); }
.sa-drop { border: 2.5px dashed var(--border); border-radius: 16px; padding: 24px 14px; text-align: center; cursor: pointer; background: var(--bg-soft); transition: border-color .15s, background .15s; } .sa-drop:hover, .sa-drop.over { border-color: var(--primary); background: var(--primary-soft); }
.sa-prog { height: 10px; border-radius: 99px; background: var(--border); overflow: hidden; margin: 8px 0; } .sa-prog > i { display: block; height: 100%; background: var(--gradient); transition: width .4s; }
.sa-code { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; min-height: 380px; }
.sa-toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #111827; color: #fff; padding: 10px 18px; border-radius: 12px; font-size: 14px; z-index: 200; opacity: 0; transition: opacity .25s; pointer-events: none; max-width: 90vw; } .sa-toast.on { opacity: 1; }
</style>
<script src="js/dialog.js?v=1"></script>
</head>
<body data-page="school" data-guard="teacher">
<div id="site-header"></div>
<main class="sa-wrap">
  <div class="sa-top">
    <h1>✏️ Quản lý bài học ngữ pháp phổ thông</h1>
    <a class="sa-btn" href="school.html">👁️ Xem trang học sinh</a>
    <button class="sa-btn" id="btnNew">➕ Bài mới (tự viết)</button>
    <button class="sa-btn pri" id="btnAI">🤖 Tạo bài từ file lý thuyết (AI)</button>
  </div>
  <div class="sa-grid" id="grid">
    <aside class="sa-side sa-card" id="side"></aside>
    <section class="sa-main" id="main"><div class="sa-card sa-empty">Chọn một bài ở danh sách bên trái để sửa, hoặc bấm <b>“Tạo bài từ file lý thuyết (AI)”</b> để AI soạn bài nháp từ file của bạn.</div></section>
  </div>
</main>

<!-- hộp thoại AI -->
<div class="sa-ov" id="ovAI"><div class="sa-modal" id="mdAI"></div></div>
<div class="sa-ov" id="ovHist"><div class="sa-modal" id="mdHist"></div></div>
<div class="sa-toast" id="toast"></div>
<div id="site-footer"></div>
<script src="js/track.js?v=1" defer></script>
<script src="js/main.js?v=50"></script>
<script>
(function () {
'use strict';
var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function api(method, url, body) {
  return fetch(url, { method: method, credentials: 'same-origin', headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined })
    .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { if (!r.ok) { var e = new Error(d.error || 'Lỗi kết nối'); e.data = d; e.status = r.status; throw e; } return d; }); });
}
var tt; function toast(t) { var el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(tt); tt = setTimeout(function () { el.classList.remove('on'); }, 2600); }
var STATE = { builtin: 'Gốc', edited: 'Đã sửa · đang hiển thị', published: 'Đã xuất bản', draft: 'Nháp', hidden: 'Đang ẩn' };
var CHIP = { builtin: '', edited: 'edited', published: 'pub', draft: 'draft', hidden: 'hidden' };

/* ───────── Danh sách ───────── */
var LIST = [], F = { g: 0, st: '', q: '' }, CUR = null, DIRTY = false, TAB = 'info';
function norm(s) { return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd'); }
function loadList() { return api('GET', '/api/school/admin/list').then(function (r) { LIST = r.lessons; renderList(); }).catch(function (e) { $('side').innerHTML = '<div class="sa-msg err">' + esc(e.message) + '</div>'; }); }
function renderList() {
  var items = LIST.filter(function (l) { return (!F.g || l.grade === F.g) && (!F.st || l.state === F.st) && (!F.q || norm(l.title + ' ' + l.sub).indexOf(F.q) >= 0); });
  var h = '<div class="sa-pills">' + [0, 6, 7, 8, 9, 10, 11, 12].map(function (g) { return '<button class="sa-pill' + (F.g === g ? ' on' : '') + '" data-g="' + g + '">' + (g ? 'Lớp ' + g : 'Tất cả') + '</button>'; }).join('') + '</div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px"><select class="sa-sel" id="fSt"><option value="">Mọi trạng thái</option>' + Object.keys(STATE).map(function (k) { return '<option value="' + k + '"' + (F.st === k ? ' selected' : '') + '>' + STATE[k] + '</option>'; }).join('') + '</select><input class="sa-in" id="fQ" placeholder="🔍 Tìm bài…" value="' + esc(F.q) + '"></div>' +
    '<div class="sa-hint">' + items.length + ' / ' + LIST.length + ' bài. Bài “Nháp” chưa hiện với học sinh.</div>';
  var byG = {}; items.forEach(function (l) { (byG[l.grade] = byG[l.grade] || []).push(l); });
  h += Object.keys(byG).map(Number).sort(function (a, b) { return a - b; }).map(function (g) {
    return '<div style="font-weight:800;font-size:13px;margin:10px 0 4px;color:var(--primary)">Lớp ' + g + '</div>' + byG[g].map(function (l) {
      return '<div class="sa-li' + (CUR && CUR.id === l.id ? ' on' : '') + '" data-id="' + esc(l.id) + '"><div class="ico">' + esc(l.icon) + '</div><div style="flex:1;min-width:0"><b>' + esc(l.title) + '</b><small>' + esc(l.sub) + ' · ' + l.q + ' câu</small><div style="margin-top:3px">' + (l.state !== 'builtin' ? '<span class="sa-chip ' + CHIP[l.state] + '">' + STATE[l.state] + '</span>' : '<span class="sa-chip">Gốc</span>') + (l.flags ? '<span class="sa-chip flag">⚠️ ' + l.flags + '</span>' : '') + '</div></div></div>';
    }).join('');
  }).join('');
  $('side').innerHTML = h;
  Array.prototype.forEach.call($('side').querySelectorAll('[data-g]'), function (b) { b.onclick = function () { F.g = +b.dataset.g; renderList(); }; });
  Array.prototype.forEach.call($('side').querySelectorAll('[data-id]'), function (b) { b.onclick = function () { openLesson(b.dataset.id); }; });
  $('fSt').onchange = function () { F.st = this.value; renderList(); };
  $('fQ').oninput = function () { F.q = norm(this.value.trim()); var pos = this.selectionStart; renderList(); var el = $('fQ'); el.focus(); try { el.setSelectionRange(pos, pos); } catch (e) {} };
}

/* ───────── Mở / lưu bài ───────── */
async function confirmLeave() { return !DIRTY || (await ewtConfirm('Bài đang sửa chưa lưu. Rời đi và bỏ các thay đổi?')); }
async function openLesson(id) {
  if (!(await confirmLeave())) return;
  api('GET', '/api/school/admin/lesson/' + encodeURIComponent(id)).then(function (d) {
    CUR = { id: id, lesson: d.lesson, state: d.state, builtin: d.builtin, hasOverride: d.hasOverride, flags: d.flags || [], versions: d.versions || [], source: d.source || '', msgs: null };
    ensureShape(CUR.lesson); DIRTY = false; TAB = 'info'; $('grid').classList.add('editing'); renderEditor(); renderList(); history.replaceState(null, '', '?id=' + encodeURIComponent(id)); window.scrollTo(0, 0);
  }).catch(function (e) { toast(e.message); });
}
function ensureShape(L) {
  L.sections = L.sections || []; L.ex = L.ex || []; L.mis = L.mis || []; L.quiz = L.quiz || [];
  L.sections.forEach(function (s) { s.b = s.b || []; });
  L.quiz.forEach(function (q) { q[1] = (q[1] || []).slice(0, 4); while (q[1].length < 4) q[1].push(''); if (!Number.isInteger(q[2])) q[2] = -1; });
}
function dirty() { DIRTY = true; var b = $('btnSave'); if (b) b.textContent = '💾 Lưu' + (CUR.state === 'published' || CUR.state === 'edited' ? ' (cập nhật ngay cho học sinh)' : ' nháp') + ' •'; }
function save(status) {
  var body = { lesson: CUR.lesson, flags: CUR.flags }; if (status) body.status = status;
  return api('PUT', '/api/school/admin/lesson/' + encodeURIComponent(CUR.id), body).then(function (r) {
    DIRTY = false; CUR.state = r.state; CUR.msgs = { errors: r.errors || [], warns: r.warns || [] };
    return Promise.all([loadList(), api('GET', '/api/school/admin/lesson/' + encodeURIComponent(CUR.id)).then(function (d) { CUR.versions = d.versions; CUR.hasOverride = d.hasOverride; })]).then(function () { renderEditor(); return r; });
  }).catch(function (e) { CUR.msgs = { errors: (e.data && e.data.errors) || [e.message], warns: (e.data && e.data.warns) || [], failed: true }; renderEditor(); toast(e.message); throw e; });
}

/* ───────── Giao diện sửa bài ───────── */
var BLK = { p: '📝 Đoạn văn', f: '🧮 Công thức', t: '📊 Bảng', tip: '💡 Mẹo', warn: '⚠️ Lưu ý / bẫy', ul: '• Danh sách' };
function blkKind(b) { return b.p != null ? 'p' : b.f ? 'f' : b.t ? 't' : b.tip != null ? 'tip' : b.warn != null ? 'warn' : 'ul'; }
function tableToText(t) { return [t.h.join(' | ')].concat(t.r.map(function (r) { return r.join(' | '); })).join('\n'); }
function textToTable(s) { var rows = s.split('\n').map(function (l) { return l.split('|').map(function (c) { return c.trim(); }); }).filter(function (r) { return r.some(Boolean); }); if (!rows.length) return { h: ['Cột 1'], r: [] }; var h = rows[0]; return { h: h, r: rows.slice(1).map(function (r) { r = r.slice(0, h.length); while (r.length < h.length) r.push(''); return r; }) }; }
function stateButtons() {
  var live = CUR.state === 'published' || CUR.state === 'edited';
  var h = '<button class="sa-btn pri" id="btnSave">💾 Lưu' + (live ? ' (cập nhật ngay cho học sinh)' : ' nháp') + '</button>';
  if (!live && CUR.state !== 'hidden') h += '<button class="sa-btn" id="btnPub">🚀 Xuất bản cho học sinh</button>';
  if (live) h += '<button class="sa-btn" id="btnUnpub">↩️ Gỡ về nháp</button>';
  h += '<button class="sa-btn" id="btnPrev">👁️ Xem trước</button><button class="sa-btn" id="btnChk">🤖 Kiểm tra đáp án</button><button class="sa-btn" id="btnHist">🕘 Lịch sử</button>';
  return h;
}
function renderEditor() {
  var L = CUR.lesson;
  var h = '<div class="sa-bar"><button class="sa-btn sm" id="btnBack" title="Về danh sách">←</button><b style="font-size:15px">' + esc(L.icon) + ' ' + esc(L.title || '(chưa đặt tên)') + '</b> <span class="sa-chip ' + CHIP[CUR.state] + '">' + STATE[CUR.state] + '</span><span class="sp"></span>' + stateButtons() + '</div>';
  var m = CUR.msgs;
  if (m && m.errors && m.errors.length) h += '<div class="sa-msg err"><b>' + (m.failed ? 'Chưa lưu/xuất bản được. ' : '') + 'Cần sửa (' + m.errors.length + '):</b><ul>' + m.errors.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>';
  if (m && m.warns && m.warns.length) h += '<div class="sa-msg warn"><b>Nên xem lại:</b><ul>' + m.warns.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>';
  if (m && !m.failed && !(m.errors || []).length) h += '<div class="sa-msg ok">✅ Đã lưu. Bài hợp lệ' + ((CUR.state === 'published' || CUR.state === 'edited') ? ' và đang hiển thị với học sinh.' : '. Bấm “Xuất bản” khi bạn đã duyệt xong.') + '</div>';
  if (CUR.flags && CUR.flags.length) h += '<div class="sa-msg warn"><b>⚠️ Các điểm AI/hệ thống đề nghị bạn kiểm tra (' + CUR.flags.length + '):</b><ul>' + CUR.flags.map(function (f, i) { return '<li>' + (f.where ? '<b>' + esc(f.where) + ':</b> ' : '') + esc(f.msg) + ' <a href="#" data-clr="' + i + '" style="font-size:12px">[đã xem xong]</a></li>'; }).join('') + '</ul></div>';
  if (CUR.source) h += '<div class="sa-hint">Nguồn: ' + (/^ai:/.test(CUR.source) ? '🤖 AI phân tích file “' + esc(CUR.source.slice(3)) + '”' : esc(CUR.source)) + '</div>';
  h += '<div class="sa-tabs">' + [['info', '📌 Thông tin'], ['sections', '📖 Giải thích'], ['ex', '🗣️ Ví dụ (' + L.ex.length + ')'], ['mis', '🚫 Lỗi thường gặp (' + L.mis.length + ')'], ['quiz', '✍️ Luyện tập (' + L.quiz.length + ')'], ['json', '🧾 JSON']].map(function (t) { return '<button class="sa-tab' + (TAB === t[0] ? ' on' : '') + '" data-tab="' + t[0] + '">' + t[1] + '</button>'; }).join('') + '</div>';
  h += '<div class="sa-card" id="tabBody"></div>';
  h += '<div class="sa-card" style="margin-top:14px"><b>Thao tác khác</b><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">' +
    (CUR.state !== 'hidden' ? '<button class="sa-btn sm" id="btnHide">🙈 Ẩn bài khỏi học sinh</button>' : '<button class="sa-btn sm" id="btnShow">👁️ Hiện lại bài</button>') +
    (CUR.builtin && CUR.hasOverride ? '<button class="sa-btn sm" id="btnRevert">♻️ Khôi phục bản gốc (bỏ mọi chỉnh sửa)</button>' : '') +
    (!CUR.builtin ? '<button class="sa-btn sm dng" id="btnDel">🗑️ Xoá bài này</button>' : '') + '</div>' + (CUR.builtin ? '<div class="sa-hint">Bài gốc không bị sửa trong mã nguồn — các chỉnh sửa lưu riêng và có thể khôi phục bất cứ lúc nào.</div>' : '') + '</div>';
  $('main').innerHTML = h; renderTab(); bindBar();
}
function bindBar() {
  var on = function (id, fn) { var b = $(id); if (b) b.onclick = fn; };
  on('btnBack', async function () { if (!(await confirmLeave())) return; DIRTY = false; CUR = null; $('grid').classList.remove('editing'); $('main').innerHTML = '<div class="sa-card sa-empty">Chọn một bài ở danh sách để sửa.</div>'; renderList(); history.replaceState(null, '', location.pathname); });
  on('btnSave', function () { save().then(function () { toast('Đã lưu'); }).catch(function () {}); });
  on('btnPub', async function () { if (!(await ewtConfirm('Xuất bản bài này? Học sinh sẽ nhìn thấy ngay.'))) return; save('published').then(function () { toast('Đã xuất bản'); }).catch(function () {}); });

  ['dragenter', 'dragover'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); }); });
  ['dragleave', 'drop'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); }); });
  drop.addEventListener('drop', function (e) { var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]; if (f) setFile(f); });
  $('aiClose').onclick = function () { clearInterval(poll); $('ovAI').classList.remove('on'); };
  $('aiGo').onclick = function () {
    var fd = new FormData(); fd.append('file', file); fd.append('grade', $('aiGrade').value); fd.append('max', $('aiMax').value); fd.append('note', $('aiNote').value);
    $('aiGo').disabled = true; $('aiOut').innerHTML = '<div class="sa-msg info">⏳ Đang gửi file…</div>';
    fetch('/api/school/admin/analyze', { method: 'POST', credentials: 'same-origin', body: fd }).then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { if (!r.ok) throw new Error(d.error || 'Không gửi được file.'); return d; }); })
      .then(function (d) { track(d.job); }).catch(function (e) { $('aiOut').innerHTML = '<div class="sa-msg err">' + esc(e.message) + '</div>'; $('aiGo').disabled = false; });
  };
}
function track(job) {
  clearInterval(poll);
  function tick() {
    api('GET', '/api/school/admin/jobs/' + job).then(function (j) {
      var pct = j.total ? Math.round(j.done / j.total * 100) : 5;
      var h = '<div class="sa-msg info"><b>' + esc(j.phase || '') + '</b><div class="sa-prog"><i style="width:' + (j.status === 'done' ? 100 : pct) + '%"></i></div><span class="sa-hint">Quá trình có thể mất vài phút (mỗi bài ~1 phút). Bạn có thể để cửa sổ này mở.</span></div>';
      if (j.issues && j.issues.length) h += '<div class="sa-msg warn"><b>AI ghi chú về file:</b><ul>' + j.issues.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>';
      if (j.lessons && j.lessons.length) h += '<div class="sa-msg ok"><b>Bài nháp đã tạo:</b>' + j.lessons.map(function (l) { return l.failed ? '<div>❌ ' + esc(l.title) + ' — AI chưa viết được, hãy thử lại</div>' : '<div style="padding:4px 0"><a href="#" data-open="' + esc(l.id) + '"><b>' + esc(l.title) + '</b></a> ' + (l.flags ? '<span class="sa-chip flag">⚠️ ' + l.flags + ' điểm cần xem</span>' : '<span class="sa-chip pub">không có cảnh báo</span>') + '</div>'; }).join('') + '</div>';
      if (j.status === 'error') { h += '<div class="sa-msg err">' + esc(j.error || 'Có lỗi.') + '</div>'; clearInterval(poll); $('aiGo').disabled = false; }
      if (j.status === 'done') { clearInterval(poll); loadList(); h += '<div class="sa-hint">Xong! Bấm vào tên bài để mở, đọc lại, sửa và xuất bản.</div>'; }
      $('aiOut').innerHTML = h;
      Array.prototype.forEach.call($('aiOut').querySelectorAll('[data-open]'), function (a) { a.onclick = function (e) { e.preventDefault(); $('ovAI').classList.remove('on'); DIRTY = false; openLesson(a.dataset.open); }; });
    }).catch(function (e) { clearInterval(poll); $('aiOut').innerHTML = '<div class="sa-msg err">' + esc(e.message) + '</div>'; });
  }
  tick(); poll = setInterval(tick, 3000);
}

window.addEventListener('beforeunload', function (e) { if (DIRTY) { e.preventDefault(); e.returnValue = ''; } });
loadList().then(function () { var id = new URLSearchParams(location.search).get('id'); if (id) openLesson(id); });
})();
</script>
